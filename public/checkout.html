<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Ödeme | Brokers Coffee</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  body { font-family: 'Plus Jakarta Sans', sans-serif; background:#faf9f6; }
  h1, h2 { font-family: 'Playfair Display', serif; }
  input, select { font-family: 'Plus Jakarta Sans', sans-serif; }
</style>
</head>
<body class="min-h-screen">

<header class="bg-white sticky top-0 z-10 border-b border-[#e3e2e0]">
<div class="max-w-3xl mx-auto px-5 py-4 flex items-center justify-between">
<a href="/" class="font-bold text-lg text-[#0d1b3d]" style="font-family:'Playfair Display',serif;">Brokers Coffee</a>
<a href="/cart.html" class="text-sm text-[#735c00]">← Sepete Dön</a>
</div>
</header>

<main class="max-w-3xl mx-auto px-5 py-8">
<h1 class="text-2xl text-[#0d1b3d] mb-6">Ödeme</h1>

<div id="empty-msg" class="hidden text-[#827472]">Sepetiniz boş. <a href="/" class="text-[#735c00] underline">Menüye dönün</a>.</div>

<form id="checkout-form" class="flex flex-col gap-6">

<section class="bg-white rounded-lg shadow-sm p-5">
<h2 class="text-lg text-[#0d1b3d] mb-4">Sipariş Özeti</h2>
<div id="order-summary" class="flex flex-col gap-2 text-sm text-[#504442] mb-3"></div>
<div class="flex justify-between font-bold text-[#0d1b3d] pt-3 border-t border-[#e3e2e0]">
<span>Toplam</span>
<span id="order-total">₺0</span>
</div>
</section>

<section class="bg-white rounded-lg shadow-sm p-5">
<h2 class="text-lg text-[#0d1b3d] mb-4">Teslimat Bilgileri</h2>
<div class="flex flex-col gap-3">
<input required id="customerName" placeholder="Ad Soyad" class="border border-[#d3c3c0] rounded px-4 py-2.5"/>
<input required id="phone" type="tel" placeholder="Telefon (05xx xxx xx xx)" class="border border-[#d3c3c0] rounded px-4 py-2.5"/>
<div class="flex gap-3">
<label class="flex items-center gap-2 flex-1 border border-[#d3c3c0] rounded px-4 py-2.5 cursor-pointer">
<input type="radio" name="deliveryType" value="gel-al" checked/> Gel Al
</label>
<label class="flex items-center gap-2 flex-1 border border-[#d3c3c0] rounded px-4 py-2.5 cursor-pointer">
<input type="radio" name="deliveryType" value="kurye"/> Kurye
</label>
</div>
<input id="address" placeholder="Teslimat adresi (kurye seçtiyseniz)" class="border border-[#d3c3c0] rounded px-4 py-2.5 hidden"/>
</div>
</section>

<section class="bg-white rounded-lg shadow-sm p-5">
<h2 class="text-lg text-[#0d1b3d] mb-4">Ödeme Yöntemi</h2>
<div id="payment-method-options" class="grid grid-cols-2 md:grid-cols-3 gap-2 mb-1">
<label class="payment-method-label flex items-center gap-2 border border-[#d3c3c0] rounded px-3 py-2.5 cursor-pointer text-sm">
<input type="radio" name="paymentMethod" value="card" checked/> Kredi Kartı
</label>
<label class="payment-method-label flex items-center gap-2 border border-[#d3c3c0] rounded px-3 py-2.5 cursor-pointer text-sm">
<input type="radio" name="paymentMethod" value="multinet"/> Multinet
</label>
<label class="payment-method-label flex items-center gap-2 border border-[#d3c3c0] rounded px-3 py-2.5 cursor-pointer text-sm">
<input type="radio" name="paymentMethod" value="pluxee"/> Pluxee
</label>
<label class="payment-method-label flex items-center gap-2 border border-[#d3c3c0] rounded px-3 py-2.5 cursor-pointer text-sm">
<input type="radio" name="paymentMethod" value="ticket"/> Ticket
</label>
<label class="payment-method-label flex items-center gap-2 border border-[#d3c3c0] rounded px-3 py-2.5 cursor-pointer text-sm">
<input type="radio" name="paymentMethod" value="metropol"/> Metropol Kart
</label>
</div>
<p id="payment-method-note" class="hidden text-xs text-amber-700 bg-amber-50 rounded px-3 py-2 mt-2"></p>
</section>

<section id="card-details-section" class="bg-white rounded-lg shadow-sm p-5">
<h2 class="text-lg text-[#0d1b3d] mb-4">Kart Bilgileri</h2>
<div class="flex flex-col gap-3">
<input required id="cardHolder" placeholder="Kart Üzerindeki İsim" class="border border-[#d3c3c0] rounded px-4 py-2.5"/>
<input required id="pan" inputmode="numeric" maxlength="19" placeholder="Kart Numarası" class="border border-[#d3c3c0] rounded px-4 py-2.5"/>
<div class="flex gap-3">
<input required id="month" inputmode="numeric" maxlength="2" placeholder="AA" class="border border-[#d3c3c0] rounded px-4 py-2.5 w-1/3"/>
<input required id="year" inputmode="numeric" maxlength="2" placeholder="YY" class="border border-[#d3c3c0] rounded px-4 py-2.5 w-1/3"/>
<input required id="cvc" inputmode="numeric" maxlength="4" placeholder="CVC" class="border border-[#d3c3c0] rounded px-4 py-2.5 w-1/3"/>
</div>
</div>
<p class="text-xs text-[#827472] mt-3">Kart bilgileriniz güvenli bağlantı üzerinden doğrudan Paynet'e iletilir, sitemizde saklanmaz.</p>
</section>

<p id="error-msg" class="text-red-600 text-sm hidden"></p>

<button type="submit" id="submit-btn" class="bg-[#0d1b3d] text-white font-semibold uppercase tracking-widest text-sm py-3.5 rounded hover:bg-[#16285c] transition-colors">Ödemeyi Tamamla</button>
</form>
</main>

<script src="/js/cart.js"></script>
<script>
const cart = getCart();
if (!cart.length) {
  document.getElementById('checkout-form').classList.add('hidden');
  document.getElementById('empty-msg').classList.remove('hidden');
} else {
  renderSummary();
}

let discountPreview = null;

async function refreshDiscountPreview() {
  try {
    const res = await fetch('/api/payment/preview-discount', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ items: getCart().map(i => ({ productId: i.productId, price: i.price, qty: i.qty })) }),
    });
    if (res.ok) {
      discountPreview = await res.json();
      renderSummary();
    }
  } catch (e) {}
}

function renderSummary() {
  const items = getCart();
  const subtotal = cartTotal();
  const discountAmount = discountPreview ? discountPreview.discountAmount : 0;
  const total = subtotal - discountAmount;

  let html = items.map(i =>
    `<div class="flex justify-between"><span>${i.qty}× ${i.name}${i.size ? ' (' + i.size + ')' : ''}</span><span>₺${(i.price * i.qty).toFixed(0)}</span></div>`
  ).join('');

  if (discountPreview && discountPreview.discountBreakdown.length) {
    discountPreview.discountBreakdown.forEach(d => {
      const label = d.percent !== null ? `Personel İndirimi (%${d.percent})` : 'Personel Özel Fiyatı';
      html += `<div class="flex justify-between text-emerald-600 font-semibold pt-2 border-t border-[#e3e2e0] mt-1"><span>${label}</span><span>−₺${d.amount.toFixed(0)}</span></div>`;
    });
  }

  document.getElementById('order-summary').innerHTML = html;
  document.getElementById('order-total').textContent = '₺' + total.toFixed(0);
}

refreshDiscountPreview();

document.querySelectorAll('input[name="deliveryType"]').forEach(radio => {
  radio.addEventListener('change', () => {
    const addressInput = document.getElementById('address');
    if (document.querySelector('input[name="deliveryType"]:checked').value === 'kurye') {
      addressInput.classList.remove('hidden');
      addressInput.required = true;
    } else {
      addressInput.classList.add('hidden');
      addressInput.required = false;
    }
  });
});

const PAYMENT_METHOD_LABELS = {
  multinet: 'Multinet',
  pluxee: 'Pluxee',
  ticket: 'Ticket',
  metropol: 'Metropol Kart',
};

document.querySelectorAll('input[name="paymentMethod"]').forEach(radio => {
  radio.addEventListener('change', () => {
    const method = document.querySelector('input[name="paymentMethod"]:checked').value;
    const cardSection = document.getElementById('card-details-section');
    const note = document.getElementById('payment-method-note');
    const cardInputs = cardSection.querySelectorAll('input');

    if (method === 'card') {
      cardSection.classList.remove('hidden');
      cardInputs.forEach(i => i.required = true);
      note.classList.add('hidden');
    } else {
      cardSection.classList.add('hidden');
      cardInputs.forEach(i => i.required = false);
      note.textContent = `${PAYMENT_METHOD_LABELS[method]} ile online ödeme yakında aktif olacak. Şimdilik mağazada kartınızı okutabilir ya da Kredi Kartı seçeneğini kullanabilirsiniz.`;
      note.classList.remove('hidden');
    }
  });
});

document.getElementById('checkout-form').addEventListener('submit', async (e) => {
  const selectedMethod = document.querySelector('input[name="paymentMethod"]:checked').value;
  if (selectedMethod !== 'card') {
    e.preventDefault();
    return;
  }
  e.preventDefault();
  const submitBtn = document.getElementById('submit-btn');
  const errorMsg = document.getElementById('error-msg');
  errorMsg.classList.add('hidden');
  submitBtn.disabled = true;
  submitBtn.textContent = 'İşleniyor...';

  const payload = {
    items: getCart().map(i => ({ productId: i.productId, name: i.name, size: i.size, price: i.price, qty: i.qty })),
    customerName: document.getElementById('customerName').value,
    phone: document.getElementById('phone').value,
    deliveryType: document.querySelector('input[name="deliveryType"]:checked').value,
    address: document.getElementById('address').value || null,
    total: cartTotal(),
    cardHolder: document.getElementById('cardHolder').value,
    pan: document.getElementById('pan').value.replace(/\s/g, ''),
    month: document.getElementById('month').value,
    year: document.getElementById('year').value,
    cvc: document.getElementById('cvc').value,
  };

  try {
    const res = await fetch('/api/payment/init', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) {
      errorMsg.textContent = data.error || 'Ödeme başlatılamadı, tekrar deneyin.';
      errorMsg.classList.remove('hidden');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Ödemeyi Tamamla';
      return;
    }
    // Sepeti temizle, 3D doğrulama sayfasına yönlendir
    localStorage.removeItem('brokers_coffee_cart');
    if (data.htmlContent) {
      document.open();
      document.write(data.htmlContent);
      document.close();
    } else if (data.postUrl) {
      window.location.href = data.postUrl;
    }
  } catch (err) {
    errorMsg.textContent = 'Bağlantı hatası, tekrar deneyin.';
    errorMsg.classList.remove('hidden');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Ödemeyi Tamamla';
  }
});
</script>
