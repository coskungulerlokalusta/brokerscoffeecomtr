<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sadakat Programı | Brokers Coffee</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style> body { font-family: 'Plus Jakarta Sans', sans-serif; background:#faf9f6; } h1,h2 { font-family: 'Playfair Display', serif; } </style>
</head>
<body class="min-h-screen">
<header class="bg-white border-b border-[#e3e2e0]">
<div class="max-w-2xl mx-auto px-5 py-4 flex items-center justify-between">
<a href="/" class="font-bold text-lg text-[#0d1b3d]" style="font-family:'Playfair Display',serif;">Brokers Coffee</a>
<a href="/" class="text-sm text-[#735c00]">← Ana Sayfa</a>
</div>
</header>

<main class="max-w-2xl mx-auto px-5 py-8">
<div id="loading" class="text-[#827472]">Yükleniyor...</div>

<div id="unauth" class="hidden text-center">
<p class="text-[#827472] mb-4">Puanlarını görmek için giriş yapmalısın.</p>
<a href="/login.html" class="inline-block bg-[#0d1b3d] text-white font-semibold uppercase tracking-widest text-sm py-3 px-6 rounded">Giriş Yap</a>
</div>

<div id="content" class="hidden">
<div class="bg-[#0d1b3d] text-white rounded-lg p-6 mb-8 text-center">
<p class="text-xs uppercase tracking-widest text-white/60 mb-1">Puan Bakiyen</p>
<p id="points-balance" class="text-4xl font-bold">0</p>
</div>

<h2 class="text-xl text-[#0d1b3d] mb-4">Ödüller</h2>
<div id="rewards-list" class="flex flex-col gap-3"></div>
</div>

<div id="redeem-modal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
<div class="bg-white rounded-lg p-6 w-full max-w-xs text-center">
<p class="text-sm text-[#827472] mb-2">Ödül kodunu baristaya göster:</p>
<p id="redeem-code" class="text-3xl font-bold text-[#0d1b3d] tracking-widest mb-4"></p>
<button id="redeem-close" class="w-full border border-[#d3c3c0] rounded py-2.5 text-sm font-semibold">Kapat</button>
</div>
</div>
</main>

<script>
let currentPoints = 0;

async function init() {
  try {
    const meRes = await fetch('/api/account/me');
    if (!meRes.ok) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('unauth').classList.remove('hidden');
      return;
    }
    const me = await meRes.json();
    currentPoints = me.loyaltyPoints;
    document.getElementById('points-balance').textContent = currentPoints;

    const rewardsRes = await fetch('/api/rewards');
    const rewards = await rewardsRes.json();
    renderRewards(rewards);

    document.getElementById('loading').classList.add('hidden');
    document.getElementById('content').classList.remove('hidden');
  } catch (e) {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('unauth').classList.remove('hidden');
  }
}

function renderRewards(rewards) {
  const list = document.getElementById('rewards-list');
  if (!rewards.length) {
    list.innerHTML = '<p class="text-[#827472]">Şu an aktif ödül yok.</p>';
    return;
  }
  list.innerHTML = rewards.map(r => {
    const canAfford = currentPoints >= r.pointsCost;
    return `
      <div class="bg-white rounded-lg shadow-sm p-4 flex items-center justify-between">
        <div>
          <p class="font-semibold text-[#0d1b3d]">${r.title}</p>
          <p class="text-xs text-[#827472]">${r.description || ''}</p>
          <p class="text-sm text-[#735c00] font-semibold mt-1">${r.pointsCost} puan</p>
        </div>
        <button data-id="${r.id}" class="redeem-btn text-xs font-bold uppercase tracking-widest px-4 py-2 rounded ${canAfford ? 'bg-[#0d1b3d] text-white' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}" ${canAfford ? '' : 'disabled'}>Kullan</button>
      </div>
    `;
  }).join('');

  list.querySelectorAll('.redeem-btn:not([disabled])').forEach(btn => {
    btn.addEventListener('click', async () => {
      const res = await fetch(`/api/rewards/${btn.dataset.id}/redeem`, { method: 'POST' });
      const data = await res.json();
      if (!res.ok) { alert(data.error || 'Bir hata oluştu'); return; }
      currentPoints = data.remainingPoints;
      document.getElementById('points-balance').textContent = currentPoints;
      document.getElementById('redeem-code').textContent = data.code;
      document.getElementById('redeem-modal').classList.remove('hidden');
      const rewardsRes = await fetch('/api/rewards');
      renderRewards(await rewardsRes.json());
    });
  });
}

document.getElementById('redeem-close').addEventListener('click', () => {
  document.getElementById('redeem-modal').classList.add('hidden');
});

init();
</script>
</body>
</html>
