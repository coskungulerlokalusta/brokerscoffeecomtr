<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>DurakPOS Asistan</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0B1F38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DurakPOS Asistan">
<style>
:root{
  --navy:#0B1F38; --navy2:#173254; --bg:#F2F0EA; --surface:#fff; --border:#E7E2D8;
  --text:#241A0F; --muted:#8A7C67; --accent:#C97A2E; --success:#2E7D46; --danger:#B4302E;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{font-family:-apple-system,Arial,sans-serif; background:var(--bg); color:var(--text);}
button,input{font-family:inherit;}

.login-wrap{max-width:420px; margin:0 auto; padding:24px;}
.logo{font-size:24px; font-weight:800; text-align:center; margin:40px 0 30px;}
.logo span{color:var(--accent);}
.login-card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px;}
.login-card label{font-size:12px; color:var(--muted); display:block; margin-bottom:5px; margin-top:14px;}
.login-card label:first-of-type{margin-top:0;}
.login-card input{width:100%; background:#F7F5F0; border:1px solid var(--border); border-radius:10px; padding:12px; color:var(--text); font-size:15px; outline:none;}
.login-err{color:var(--danger); font-size:12px; margin-top:10px; min-height:14px;}
.login-btn{width:100%; background:var(--navy); color:#fff; font-weight:800; padding:13px; border-radius:12px; font-size:15px; border:none; margin-top:16px;}
.refresh-note{text-align:center; color:var(--muted); font-size:11px; padding:10px;}

.app-shell{display:flex; flex-direction:column; height:100vh; height:100dvh;}
.chat-header{display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--navy); color:#fff; flex-shrink:0;}
.chat-header .chat-avatar{width:38px; height:38px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0;}
.chat-header .chat-title{font-size:14px; font-weight:800;}
.chat-header .chat-sub{font-size:11px; opacity:0.7;}
.chat-header select{margin-left:auto; font-size:11.5px; padding:5px 8px; border-radius:8px; border:none; background:rgba(255,255,255,0.12); color:#fff; font-weight:700;}
.chat-header .logout-x{background:none; border:none; color:rgba(255,255,255,0.7); font-size:18px; margin-left:8px;}

.chat-messages{flex:1; overflow-y:auto; padding:14px 14px; display:flex; flex-direction:column; gap:3px;
  background:#E9DFC9; background-image:radial-gradient(rgba(0,0,0,0.025) 1px, transparent 1px); background-size:18px 18px;}
.chat-bubble{max-width:82%; padding:8px 10px 6px 11px; border-radius:9px; font-size:14px; line-height:1.45; white-space:pre-wrap; position:relative; box-shadow:0 1px 1px rgba(0,0,0,0.08); margin-bottom:5px;}
.chat-bubble.user{align-self:flex-end; background:#DCF8C6; color:#1a1a1a; border-bottom-right-radius:2px;}
.chat-bubble.assistant{align-self:flex-start; background:#fff; color:#1a1a1a; border-bottom-left-radius:2px;}
.chat-bubble.thinking{align-self:flex-start; background:#fff; color:var(--muted); font-style:italic;}
.chat-bubble .chat-time{display:block; text-align:right; font-size:10px; color:#8a8a8a; margin-top:3px;}
.chat-bubble img.chat-img{max-width:100%; border-radius:6px; margin-bottom:4px; display:block;}
.chat-bubble .action-tag{display:inline-block; background:#E7F5EA; color:#2E7D46; font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:6px; margin-top:6px;}
.chat-empty{text-align:center; color:var(--muted); font-size:12.5px; padding:24px 20px; background:#fff; border-radius:10px; margin:10px auto; max-width:85%;}
.chat-suggestions{display:flex; flex-wrap:wrap; gap:8px; padding:0 14px 10px; background:#E9DFC9;}
.chat-suggestion{background:#fff; border:1px solid var(--border); border-radius:999px; padding:8px 13px; font-size:11.5px; font-weight:600; color:var(--text);}
.chat-img-preview{display:flex; align-items:center; gap:10px; padding:8px 16px; background:#fff; border-top:1px solid var(--border);}
.chat-img-preview img{width:44px; height:44px; object-fit:cover; border-radius:8px;}
.chat-img-preview button{background:none; color:var(--danger); font-size:12px; font-weight:700; border:none;}
.chat-input-row{display:flex; align-items:center; gap:8px; padding:10px 12px; background:var(--surface); border-top:1px solid var(--border); flex-shrink:0; padding-bottom:calc(10px + env(safe-area-inset-bottom));}
.chat-input-row input{flex:1; background:#fff; border:1px solid var(--border); border-radius:22px; padding:11px 16px; font-size:15px;}
.chat-attach-btn{width:40px; height:40px; border-radius:50%; background:var(--bg); font-size:17px; flex-shrink:0; border:none;}
.chat-send-btn{width:40px; height:40px; border-radius:50%; background:var(--navy); color:#fff; font-size:16px; flex-shrink:0; border:none;}
.chat-send-btn:disabled{opacity:0.5;}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API_BASE = '/api';
let token = localStorage.getItem('panel_token') || null;
let tenant = JSON.parse(localStorage.getItem('panel_tenant') || 'null');
let branches = JSON.parse(localStorage.getItem('panel_branches') || '[]');
let loginErr = '';
let aiChatHistory = [];
let pendingChatImage = null;

async function switchBranch(targetTenantId){
  try{
    const res = await fetch(API_BASE+'/auth/switch-branch', {
      method:'POST', headers:{'Content-Type':'application/json', 'Authorization':'Bearer '+token},
      body: JSON.stringify({ targetTenantId })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error);
    token = data.token; tenant = data.tenant;
    localStorage.setItem('panel_token', token);
    localStorage.setItem('panel_tenant', JSON.stringify(tenant));
    aiChatHistory = []; render();
  }catch(e){ alert(e.message); }
}

async function api(path, opts={}){
  const res = await fetch(API_BASE + path, { ...opts, headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token, ...(opts.headers||{}) } });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || 'İstek başarısız');
  return data;
}

function escapeHtml(str){ return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function render(){ document.getElementById('app').innerHTML = token ? renderChatApp() : renderLogin(); attach(); }

function renderLogin(){
  return `
  <div class="login-wrap">
    <div class="logo">Durak<span>POS</span> Asistan</div>
    <div class="login-card">
      <div class="login-err">${loginErr}</div>
      <label>E-posta</label>
      <input type="email" id="email" autocomplete="username">
      <label>Şifre</label>
      <input type="password" id="pass" autocomplete="current-password">
      <button class="login-btn" id="loginBtn">Giriş Yap</button>
    </div>
    <p class="refresh-note">Yönetim panelinde kullandığınız e-posta/şifre ile giriş yapın.</p>
  </div>`;
}

function actionLabel(tool){
  const labels = {
    add_product:'Ürün eklendi', update_product:'Ürün güncellendi', delete_product:'Ürün silindi',
    add_category:'Kategori eklendi', rename_category:'Kategori adı değişti', delete_category:'Kategori silindi',
    list_menu:'Menü incelendi', log_expense:'Gider kaydedildi', add_size_to_all_products:'Boy eklendi',
    get_report_summary:'Rapor sorgulandı', add_staff:'Personel eklendi', set_staff_panel_login:'Panel girişi tanımlandı',
    list_staff:'Personel listelendi', list_ingredients:'Malzemeler incelendi', set_product_recipe:'Reçete kaydedildi', generate_product_image:'Görsel üretildi'
  };
  return labels[tool] || tool;
}

function renderChatApp(){
  const suggestions = [
    'Bugün en çok satan ürün neydi?',
    'Bu ay ciro geçen aya göre nasıl?',
    'Personele bugün 30 TL ödedim, kaydet',
    'Tüm ürünlere +20₺ ile Ekstra Büyük boy ekle',
  ];
  return `
  <div class="app-shell">
    <div class="chat-header">
      <div class="chat-avatar">✨</div>
      <div>
        <div class="chat-title">DurakPOS Asistan</div>
        <div class="chat-sub">${tenant ? tenant.name : ''}</div>
      </div>
      ${branches.length>1 ? `
        <select id="branchSwitcher">
          ${branches.map(b=>`<option value="${b.tenantId}" ${tenant&&tenant.id===b.tenantId?'selected':''}>${b.name}</option>`).join('')}
        </select>
      ` : ''}
      <button class="logout-x" id="logoutBtn" title="Çıkış Yap">⎋</button>
    </div>
    <div class="chat-messages" id="chatMessages">
      ${aiChatHistory.length===0 ? '<div class="chat-empty">👋 Merhaba! Sadece soru cevaplamıyorum — "bu ürünü ekle", "şu gideri kaydet" gibi talimatları da uygulayabilirim. Bir fotoğraf gönderip ürün ekletebilirsin.</div>' : ''}
      ${aiChatHistory.map(m=>`
        <div class="chat-bubble ${m.role}${m.thinking?' thinking':''}">
          ${m.imagePreview ? `<img class="chat-img" src="${m.imagePreview}">` : ''}
          ${escapeHtml(m.content)}
          ${(m.actionsPerformed && m.actionsPerformed.length) ? m.actionsPerformed.map(a=>`<span class="action-tag">✓ ${actionLabel(a.tool)}</span>`).join('') : ''}
          ${!m.thinking ? `<span class="chat-time">${m.time||''}</span>` : ''}
        </div>`).join('')}
    </div>
    ${aiChatHistory.length===0 ? `<div class="chat-suggestions">${suggestions.map(s=>`<button class="chat-suggestion" data-sugg="${s}">${s}</button>`).join('')}</div>` : ''}
    ${pendingChatImage ? `<div class="chat-img-preview"><img src="${pendingChatImage.previewUrl}"><span style="font-size:12px; color:var(--muted); flex:1;">Fotoğraf eklendi</span><button id="removeImgBtn">Kaldır</button></div>` : ''}
    <div class="chat-input-row">
      <button class="chat-attach-btn" id="attachBtn" title="Fotoğraf ekle">📎</button>
      <input type="file" id="chatImgInput" accept="image/*" style="display:none;">
      <input type="text" id="chatInput" placeholder="Bir mesaj yazın…">
      <button class="chat-send-btn" id="chatSendBtn">➤</button>
    </div>
  </div>`;
}

async function sendChat(text){
  const nowTime = new Date().toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'});
  const imageForMsg = pendingChatImage;
  aiChatHistory.push({role:'user', content:text || '(fotoğraf gönderildi)', time:nowTime, imagePreview: imageForMsg?.previewUrl});
  aiChatHistory.push({role:'assistant', content:'yazıyor…', thinking:true});
  pendingChatImage = null;
  render();

  try{
    const historyForApi = aiChatHistory.filter(m=>!m.thinking).map(m=>({role:m.role, content:m.content}));
    const body = { messages: historyForApi };
    if(imageForMsg) body.image = { mediaType: imageForMsg.mediaType, base64: imageForMsg.base64 };
    const res = await api('/reports/ai-agent', {method:'POST', body:JSON.stringify(body)});
    aiChatHistory = aiChatHistory.filter(m=>!m.thinking);
    aiChatHistory.push({role:'assistant', content:res.reply, time:new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}), actionsPerformed: res.actionsPerformed});
  }catch(e){
    aiChatHistory = aiChatHistory.filter(m=>!m.thinking);
    aiChatHistory.push({role:'assistant', content:'⚠ '+e.message, time:nowTime});
  }
  render();
}

function attach(){
  const loginBtn = document.getElementById('loginBtn');
  if(loginBtn) loginBtn.onclick = async ()=>{
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('pass').value;
    try{
      const res = await fetch(API_BASE+'/auth/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email,password})});
      const data = await res.json();
      if(!res.ok) throw new Error(data.error);
      token = data.token; tenant = data.tenant; branches = data.branches || [];
      localStorage.setItem('panel_token', token);
      localStorage.setItem('panel_tenant', JSON.stringify(tenant));
      localStorage.setItem('panel_branches', JSON.stringify(branches));
      loginErr=''; render();
    }catch(e){ loginErr = e.message; render(); }
  };
  const logoutBtn = document.getElementById('logoutBtn');
  if(logoutBtn) logoutBtn.onclick = ()=>{
    if(!confirm('Çıkış yapmak istiyor musunuz?')) return;
    token=null; aiChatHistory=[];
    localStorage.removeItem('panel_token'); localStorage.removeItem('panel_tenant'); localStorage.removeItem('panel_branches');
    render();
  };
  const branchSwitcher = document.getElementById('branchSwitcher');
  if(branchSwitcher) branchSwitcher.onchange = ()=>switchBranch(Number(branchSwitcher.value));

  const messagesEl = document.getElementById('chatMessages');
  if(messagesEl) messagesEl.scrollTop = messagesEl.scrollHeight;

  document.querySelectorAll('[data-sugg]').forEach(b=>b.onclick=()=>sendChat(b.dataset.sugg));
  const sendBtn = document.getElementById('chatSendBtn');
  if(sendBtn) sendBtn.onclick = ()=>{
    const input = document.getElementById('chatInput');
    if(input.value.trim() || pendingChatImage) sendChat(input.value.trim());
  };
  const chatInput = document.getElementById('chatInput');
  if(chatInput) chatInput.onkeydown = (e)=>{
    if(e.key==='Enter'){ const v=e.target.value.trim(); if(v || pendingChatImage) sendChat(v); }
  };
  const attachBtn = document.getElementById('attachBtn');
  if(attachBtn) attachBtn.onclick = ()=>document.getElementById('chatImgInput').click();
  const chatImgInput = document.getElementById('chatImgInput');
  if(chatImgInput) chatImgInput.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const dataUrl = ev.target.result;
      const base64 = dataUrl.split(',')[1];
      pendingChatImage = { mediaType: file.type, base64, previewUrl: dataUrl };
      render();
    };
    reader.readAsDataURL(file);
  };
  const removeImgBtn = document.getElementById('removeImgBtn');
  if(removeImgBtn) removeImgBtn.onclick = ()=>{ pendingChatImage=null; render(); };
}

render();
</script>
</body>
</html>
