<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#0d1b3d"/>
<link rel="apple-touch-icon" href="/icons/icon-192.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>

<title>Hesabım | Brokers Coffee</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  body { font-family: 'Plus Jakarta Sans', sans-serif; background:#faf9f6; }
  @media (max-width: 768px) { body { padding-bottom: 72px; } }
  h1, h2 { font-family: 'Playfair Display', serif; }
</style>
</head>
<body class="min-h-screen">

<header class="bg-white border-b border-[#e3e2e0]">
<div class="max-w-3xl mx-auto px-5 py-4 flex items-center justify-between">
<a href="/" class="font-bold text-lg text-[#0d1b3d]" style="font-family:'Playfair Display',serif;">Brokers Coffee</a>
<a href="/" class="text-sm text-[#735c00]">← Menüye Dön</a>
</div>
</header>

<main class="max-w-3xl mx-auto px-5 py-8">
<div id="loading" class="text-[#827472]">Yükleniyor...</div>

<div id="content" class="hidden">
<div id="staff-banner" class="hidden bg-[#c9a227] text-[#241a00] font-semibold rounded-lg px-5 py-3 mb-6 text-center"></div>

<div class="bg-white rounded-lg shadow-sm p-6 mb-6">
<h1 class="text-2xl text-[#0d1b3d] mb-1" id="customer-name"></h1>
<p class="text-[#827472]" id="customer-phone"></p>
<span id="staff-tag" class="hidden inline-block mt-2 bg-[#0d1b3d] text-white text-xs font-bold uppercase tracking-widest px-3 py-1 rounded-full">Personel</span>
</div>

<a href="/loyalty.html" class="block text-center bg-[#0d1b3d] text-white rounded py-3 text-sm font-semibold mb-3">Sadakat Programı — Puanlarım</a>
<a href="/orders.html" class="block text-center border border-[#d3c3c0] rounded py-3 text-sm font-semibold text-[#0d1b3d] mb-3">📦 Siparişlerim</a>
<button id="notif-btn" class="w-full border border-[#d3c3c0] rounded py-3 text-sm font-semibold text-[#0d1b3d] mb-3">🔔 Bildirimleri Aç</button>
<p id="notif-status" class="text-xs text-center text-[#827472] mb-3 hidden"></p>
<button id="logout-btn" class="w-full border border-[#d3c3c0] rounded py-3 text-sm font-semibold text-[#0d1b3d]">Çıkış Yap</button>
</div>

<div id="unauth" class="hidden text-center">
<p class="text-[#827472] mb-4">Hesabına erişmek için giriş yapmalısın.</p>
<a href="/login.html" class="inline-block bg-[#0d1b3d] text-white font-semibold uppercase tracking-widest text-sm py-3 px-6 rounded">Giriş Yap</a>
</div>
</main>

<script src="/js/push.js"></script>
<script>
document.getElementById('notif-btn').addEventListener('click', async () => {
  const statusEl = document.getElementById('notif-status');
  statusEl.classList.remove('hidden');
  statusEl.textContent = 'Ayarlanıyor...';
  const result = await subscribeToPush();
  if (result.ok) {
    statusEl.textContent = 'Bildirimler açıldı ✓';
  } else {
    statusEl.textContent = result.error || 'Bildirimler açılamadı';
  }
});
async function init() {
  try {
    const res = await fetch('/api/account/me');
    if (!res.ok) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('unauth').classList.remove('hidden');
      return;
    }
    const data = await res.json();
    document.getElementById('customer-name').textContent = data.name;
    document.getElementById('customer-phone').textContent = data.phone;
    if (data.isStaff) {
      document.getElementById('staff-tag').classList.remove('hidden');
      const banner = document.getElementById('staff-banner');
      banner.textContent = data.staffBannerText;
      banner.classList.remove('hidden');
    }
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('content').classList.remove('hidden');
  } catch (err) {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('unauth').classList.remove('hidden');
  }
}

document.getElementById('logout-btn').addEventListener('click', async () => {
  await fetch('/api/account/logout', { method: 'POST' });
  window.location.href = '/';
});

init();
</script>

<!-- Mobil uygulama tarzı alt gezinme -->
<nav class="md:hidden fixed bottom-0 left-0 right-0 z-50 bg-white border-t border-[#e3e2e0] flex items-stretch justify-around" style="padding-bottom: env(safe-area-inset-bottom);">
<a href="/" class="flex-1 flex flex-col items-center justify-center gap-0.5 py-2.5 text-[#827472]">
<span class="material-symbols-outlined text-[22px]">storefront</span>
<span class="text-[10px] font-semibold uppercase tracking-wide">Ana Sayfa</span>
</a>
<a href="/#menu" class="flex-1 flex flex-col items-center justify-center gap-0.5 py-2.5 text-[#827472]">
<span class="material-symbols-outlined text-[22px]">restaurant_menu</span>
<span class="text-[10px] font-semibold uppercase tracking-wide">Menü</span>
</a>
<a href="/cart.html" class="flex-1 flex flex-col items-center justify-center gap-0.5 py-2.5 text-[#827472] relative">
<span class="material-symbols-outlined text-[22px]">shopping_bag</span>
<span data-cart-badge-mobile class="hidden absolute top-1 right-[calc(50%-18px)] bg-[#c9a227] text-[#241a00] text-[9px] font-bold rounded-full w-4 h-4 flex items-center justify-center">0</span>
<span class="text-[10px] font-semibold uppercase tracking-wide">Sepet</span>
</a>
<a href="/account.html" class="flex-1 flex flex-col items-center justify-center gap-0.5 py-2.5 text-[#0d1b3d]">
<span class="material-symbols-outlined text-[22px]">person</span>
<span class="text-[10px] font-semibold uppercase tracking-wide">Hesabım</span>
</a>
</nav>
<script src="/js/cart.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const badge = document.querySelector('[data-cart-badge-mobile]');
  if (badge) {
    const count = cartCount();
    badge.textContent = count;
    badge.classList.toggle('hidden', count === 0);
  }
});
</script>
</body>
</html>
