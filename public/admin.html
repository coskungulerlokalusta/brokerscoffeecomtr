<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>DurakPOS — Süper Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --bg:#F5F7FA; --surface:#FFFFFF; --surface2:#F0F3F7; --border:#E1E7EE; --text:#1C2733; --muted:#6B7A89;
  --accent:#3F6FDB; --accent-soft:#E8EEFC; --danger:#E0473F; --success:#2FAE72; --warning:#E0952E;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:-apple-system,'Segoe UI',Arial,sans-serif; background:var(--bg); color:var(--text); font-size:14px;}
button,input,select,textarea{font-family:inherit;}
a{text-decoration:none; color:inherit;}

.login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at 30% 20%, #FFFFFF, var(--bg));}
.login-card{background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:38px; width:380px; box-shadow:0 20px 60px rgba(0,0,0,.3);}
.logo{font-size:22px; font-weight:800; margin-bottom:4px; letter-spacing:-0.3px;}
.logo span{color:var(--accent);}
.sub{color:var(--muted); font-size:12px; margin-bottom:22px;}
.field{margin-bottom:14px;}
.field label{font-size:11px; color:var(--muted); display:block; margin-bottom:5px; font-weight:600; text-transform:uppercase; letter-spacing:0.4px;}
.field input{width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:11px 13px; color:var(--text); font-size:13px; outline:none; transition:border-color .15s;}
.field input:focus{border-color:var(--accent);}
.btn-primary{width:100%; background:var(--accent); color:#fff; font-weight:700; padding:12px; border-radius:10px; font-size:13px; border:none; cursor:pointer; transition:opacity .15s;}
.btn-primary:hover{opacity:0.9;}
.err{color:var(--danger); font-size:12px; margin-bottom:8px; min-height:14px;}
.link-btn{background:none; color:var(--accent); font-size:12px; margin-top:16px; border:none; cursor:pointer;}

.shell{display:flex; min-height:100vh;}
.sidebar{width:230px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border); padding:22px 14px; display:flex; flex-direction:column;}
.sidebar .logo{padding:0 8px; margin-bottom:26px;}
.nav-btn{display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none; color:var(--muted); padding:10px 12px; border-radius:10px; font-size:13px; font-weight:600; margin-bottom:3px; border:none; cursor:pointer; transition:all .15s;}
.nav-btn.active{background:var(--accent-soft); color:var(--accent);}
.nav-btn:hover:not(.active){background:var(--surface2); color:var(--text);}
.sidebar .spacer{flex:1;}
.admin-name{padding:10px 12px; color:var(--muted); font-size:12px; border-top:1px solid var(--border); margin-top:8px; padding-top:16px;}
.logout{width:100%; text-align:left; background:none; color:var(--danger); font-size:12px; padding:10px 12px; border:none; cursor:pointer; border-radius:10px;}
.logout:hover{background:var(--surface2);}

.content{flex:1; padding:32px 40px; overflow-y:auto;}
.page-head{margin-bottom:24px;}
.page-head h1{font-size:22px; font-weight:800; letter-spacing:-0.3px;}
.page-head p{color:var(--muted); font-size:13px; margin-top:4px;}

.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:28px; max-width:1000px;}
.stat-box{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px 20px;}
.stat-box .l{color:var(--muted); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.4px; margin-bottom:8px;}
.stat-box .v{font-size:24px; font-weight:800;}
.stat-box .v.accent{color:var(--accent);}

.tenant-card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px 22px; margin-bottom:12px; max-width:1000px;}
.tenant-top{display:flex; align-items:center; gap:14px;}
.tenant-avatar{width:40px; height:40px; border-radius:12px; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px; flex-shrink:0;}
.tenant-info{flex:1;}
.tenant-info .name{font-weight:700; font-size:14px;}
.tenant-info .slug{color:var(--muted); font-size:11px; font-family:monospace; margin-top:2px;}
.tenant-stats{display:flex; gap:28px; align-items:center;}
.tenant-stat{text-align:right;}
.tenant-stat .l{color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:0.3px;}
.tenant-stat .v{font-weight:700; font-size:14px; margin-top:2px;}
.badge{padding:5px 12px; border-radius:999px; font-size:11px; font-weight:700; display:inline-block;}
.badge.trial{background:#FDF1DA; color:#B8760F;}
.badge.active{background:#E1F6EC; color:#1F8E58;}
.badge.past_due{background:#FBE9DE; color:#C06A1E;}
.badge.suspended{background:#FBE4E2; color:#C93A31;}
.status-select{background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:7px 10px; border-radius:8px; font-size:12px; cursor:pointer;}
.feature-toggle-row{display:flex; gap:16px; flex-wrap:wrap; margin-top:14px; padding-top:14px; border-top:1px solid var(--border);}
.feature-toggle-row .tag{color:var(--muted); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.3px; margin-right:4px;}
.feature-toggle-row label{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); cursor:pointer; background:var(--surface2); padding:6px 12px; border-radius:8px; border:1px solid var(--border);}
.feature-toggle-row input[type=checkbox]{accent-color:var(--accent);}

.form-card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:24px; max-width:600px; margin-bottom:16px;}
.form-card label{font-size:11px; color:var(--muted); display:block; margin-bottom:6px; font-weight:600; text-transform:uppercase; letter-spacing:0.4px;}
.form-card input, .form-card textarea{width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:11px 13px; color:var(--text); font-size:13px; margin-bottom:16px; outline:none; font-family:inherit;}
.form-card input:focus, .form-card textarea:focus{border-color:var(--accent);}
.form-card textarea{min-height:80px; resize:vertical;}
.modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:100;}
.modal-card{background:var(--surface); border-radius:16px; padding:26px; width:380px; max-width:90vw;}
.modal-card h3{font-size:16px; margin-bottom:16px;}
.modal-card label{font-size:11px; color:var(--muted); display:block; margin-bottom:6px; margin-top:14px; font-weight:600; text-transform:uppercase; letter-spacing:0.4px;}
.modal-card label:first-of-type{margin-top:0;}
.modal-card input{width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:11px 13px; color:var(--text); font-size:13px; outline:none; font-family:inherit;}
.modal-card input:focus{border-color:var(--accent);}
.modal-err{color:var(--danger); font-size:12px; min-height:16px; margin-top:8px;}
.modal-cancel{display:block; width:100%; text-align:center; margin-top:10px; background:none; color:var(--muted); font-size:12.5px; font-weight:700; padding:8px; border:none; cursor:pointer;}
.btn-save{background:var(--accent); color:#fff; font-weight:700; padding:11px 22px; border-radius:10px; font-size:13px; border:none; cursor:pointer;}
.banner-preview{max-width:100%; border-radius:12px; margin-bottom:12px; display:block; border:1px solid var(--border);}

.blog-row{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 18px; margin-bottom:10px; display:flex; align-items:center; gap:14px; max-width:700px;}
.blog-row .title{font-weight:700; font-size:13px; flex:1;}
.blog-row button{background:var(--surface2); color:var(--muted); font-size:11px; padding:6px 12px; border-radius:8px; border:1px solid var(--border); cursor:pointer;}
.blog-row button:hover{color:var(--text);}
.add-btn2{background:var(--accent); color:#fff; font-weight:700; padding:10px 18px; border-radius:10px; font-size:13px; border:none; cursor:pointer;}
.pos-config-box{background:var(--surface2); border-radius:12px; padding:16px; margin-top:12px;}
.pos-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
.pos-grid label{font-size:10.5px; color:var(--muted); display:block; margin-bottom:5px; text-transform:uppercase; font-weight:700;}
.pos-grid input{width:100%; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:9px 10px; font-size:12.5px; box-sizing:border-box;}
.invoice-table{width:100%; border-collapse:collapse; font-size:13px;}
.invoice-table th{text-align:left; color:var(--muted); font-size:10.5px; text-transform:uppercase; letter-spacing:0.03em; padding:12px; border-bottom:1.5px solid var(--border);}
.invoice-table td{padding:12px; border-bottom:1px solid var(--border);}
.admin-chat-wrap{display:flex; flex-direction:column; height:calc(100vh - 220px); max-width:760px; background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden;}
.admin-chat-messages{flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px;}
.admin-chat-bubble{max-width:82%; padding:11px 15px; border-radius:14px; font-size:13px; line-height:1.55; white-space:pre-wrap;}
.admin-chat-bubble.user{align-self:flex-end; background:var(--navy,#0B1F38); color:#fff; border-bottom-right-radius:4px;}
.admin-chat-bubble.assistant{align-self:flex-start; background:var(--surface2,#F0EAE0); color:var(--text); border-bottom-left-radius:4px;}
.admin-chat-empty{text-align:center; color:var(--muted); font-size:13px; padding:30px 20px;}
.admin-chat-suggestions{display:flex; flex-wrap:wrap; gap:8px; padding:0 20px 14px;}
.admin-chat-sugg{background:var(--surface2,#F0EAE0); border:1px solid var(--border); border-radius:999px; padding:8px 13px; font-size:11.5px; font-weight:600; color:var(--text); cursor:pointer;}
.admin-chat-input-row{display:flex; gap:10px; padding:14px; border-top:1px solid var(--border);}
.admin-chat-input-row input{flex:1; background:var(--surface2,#F0EAE0); border:1px solid var(--border); border-radius:10px; padding:11px 14px; font-size:13px;}
.admin-chat-input-row button{background:var(--accent); color:#fff; font-weight:700; padding:11px 20px; border-radius:10px; font-size:12.5px; border:none; cursor:pointer;}
.integration-card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:24px; max-width:640px;}
.integration-card-head{display:flex; align-items:center; gap:14px; margin-bottom:20px;}
.integration-icon{width:46px; height:46px; border-radius:13px; background:var(--accent-soft); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0;}
.integration-name{font-size:15px; font-weight:800;}
.integration-desc{font-size:12px; color:var(--muted); margin-top:2px;}
.integration-form label{font-size:11px; color:var(--muted); display:block; margin-bottom:6px; margin-top:14px; font-weight:600; text-transform:uppercase; letter-spacing:0.4px;}
.integration-form label:first-of-type{margin-top:0;}
.integration-form input{width:100%; background:var(--surface2,#F5F7FC); border:1px solid var(--border); border-radius:10px; padding:11px 13px; color:var(--text); font-size:13px; outline:none; font-family:inherit; box-sizing:border-box;}
.integration-form input:focus{border-color:var(--accent);}
.empty-note{color:var(--muted); font-size:13px;}

/* ============ MOBİL UYUMLULUK ============ */
.hamburger-btn{display:none; background:none; font-size:22px; color:var(--text); padding:6px 10px; margin-bottom:12px;}
.mobile-overlay{display:none;}
@media (max-width: 860px){
  .hamburger-btn{display:inline-block;}
  .sidebar{
    position:fixed; top:0; left:0; bottom:0; z-index:100;
    transform:translateX(-100%); transition:transform 0.22s ease;
    box-shadow:4px 0 24px rgba(0,0,0,0.25); width:250px; overflow-y:auto;
  }
  .sidebar.open{transform:translateX(0);}
  .mobile-overlay{
    display:block; position:fixed; inset:0; background:rgba(0,0,0,0.4);
    z-index:99; opacity:0; pointer-events:none; transition:opacity 0.2s ease;
  }
  .mobile-overlay.show{opacity:1; pointer-events:auto;}
  .shell{display:block;}
  .content{width:100%; padding:16px;}
  .tenant-card{padding:14px 16px; max-width:100%;}
  .tenant-top{flex-wrap:wrap;}
  .blog-row{flex-wrap:wrap; max-width:100%;}
  .integration-card-head{flex-wrap:wrap;}
  table{display:block; overflow-x:auto; white-space:nowrap; max-width:100%;}
  .page-head{flex-wrap:wrap; gap:12px;}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="/shared.js"></script>
<script>
const API_BASE = '/api';
let token = localStorage.getItem('admin_token') || null;
let admin = JSON.parse(localStorage.getItem('admin_info') || 'null');
let err = '';
let bootstrapMode = false;
let adminTab = 'tenants';

// api(): bkz. /public/shared.js — tüm arayüzler ortak kullanıyor

function render(){ document.getElementById('app').innerHTML = token ? renderShell() : (bootstrapMode ? renderBootstrap() : renderLogin()); attach(); }

function renderLogin(){
  return `
  <div class="login-wrap">
    <div class="login-card">
      <div class="logo">Durak<span>POS</span> — Süper Admin</div>
      <div class="sub">Platform yönetimi — sadece siz erişebilirsiniz</div>
      <div class="err">${err}</div>
      <div class="field"><label>E-posta</label><input type="email" id="email"></div>
      <div class="field"><label>Şifre</label><input type="password" id="pass"></div>
      <button class="btn-primary" id="loginBtn">Giriş Yap</button>
      <button class="link-btn" id="toBootstrap">İlk kurulum — henüz hesabım yok</button>
    </div>
  </div>`;
}

function renderBootstrap(){
  return `
  <div class="login-wrap">
    <div class="login-card">
      <div class="logo">Durak<span>POS</span> — İlk Kurulum</div>
      <div class="sub">Bu, sadece bir kez çalışır — ilk süper admin hesabınızı oluşturur.</div>
      <div class="err">${err}</div>
      <div class="field"><label>Adınız</label><input type="text" id="bName"></div>
      <div class="field"><label>E-posta</label><input type="email" id="bEmail"></div>
      <div class="field"><label>Şifre</label><input type="password" id="bPass"></div>
      <button class="btn-primary" id="bootstrapBtn">Hesabı Oluştur</button>
      <button class="link-btn" id="toLogin">← Giriş ekranına dön</button>
    </div>
  </div>`;
}

function statusLabel(s){
  return {trial:'Deneme', active:'Aktif', past_due:'Ödeme Gecikti', suspended:'Askıda'}[s] || s;
}

function renderShell(){
  const navItems = [
    {v:'tenants', label:'Şubeler', icon:'🏢'},
    {v:'demos', label:'Demo Talepleri', icon:'📞'},
    {v:'invoices', label:'Abonelik Faturaları', icon:'🧾'},
    {v:'content', label:'Web Sitesi İçeriği', icon:'🎨'},
    {v:'blog', label:'Blog', icon:'📝'},
    {v:'aiask', label:'AI Asistan', icon:'✨'},
    {v:'integrations', label:'Entegrasyonlar', icon:'🔌'},
  ];
  const nav = navItems.map(n=>`<button class="nav-btn ${adminTab===n.v?'active':''}" data-tab="${n.v}"><span>${n.icon}</span> ${n.label}</button>`).join('');
  return `
  <div class="shell">
    <div class="mobile-overlay" id="mobileOverlay"></div>
    <div class="sidebar" id="sidebarEl">
      <div class="logo">Durak<span>POS</span></div>
      ${nav}
      <div class="spacer"></div>
      <div class="admin-name">${admin ? admin.name : ''}</div>
      <button class="logout" id="logoutBtn">🚪 Çıkış Yap</button>
    </div>
    <div class="content">
      <button class="hamburger-btn" id="hamburgerBtn">☰</button>
      <div id="tenantArea"><p class="empty-note">Yükleniyor…</p></div>
    </div>
  </div>`;
}

async function loadTenants(){
  const el = document.getElementById('tenantArea');
  try{
    const [tenants, brands] = await Promise.all([api('/admin/tenants'), api('/admin/brands')]);
    const FEATURES = [
      {key:'ai_assistant', label:'AI Asistan'},
      {key:'pos_connection', label:'POS Bağlantısı'},
      {key:'campaigns', label:'Kampanyalar'},
      {key:'reports', label:'Raporlar'},
      {key:'masa_servisi', label:'Masa / Restoran Servisi (mutfak-bar yazıcı yönlendirme)'},
      {key:'market_modu', label:'Market Modu (barkod, kilo bazlı satış, stok takibi)'},
      {key:'ai_image_generation', label:'AI ile Görsel Oluşturma (Gemini — gerçek maliyeti var)'},
      {key:'personel_indirimi', label:'Personel İndirimi (web sitesi/uygulama entegrasyonu için, kategoriye göre)'},
    ];

    const totalRevenue = tenants.reduce((s,t)=>s+Number(t.last30_revenue),0);
    const activeCount = tenants.filter(t=>t.subscription_status==='active').length;
    const trialCount = tenants.filter(t=>t.subscription_status==='trial').length;
    const cur = tenants[0] ? tenants[0].currency : '₺';

    const statsHtml = `
    <div class="page-head" style="display:flex; align-items:center; justify-content:space-between; gap:16px;">
      <div>
        <h1>Şubeler</h1>
        <p>Tüm işletmelerinizi ve abonelik durumlarını buradan yönetin. Aynı markanın (zincir) birden fazla şubesi varsa, aşağıdan bir markaya bağlayın — sahip aynı e-posta/şifreyle panel/patron'da şube değiştirebilir.</p>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn-primary" id="addBrandBtn" style="width:auto; white-space:nowrap; background:var(--surface2); color:var(--text);">+ Yeni Marka</button>
        <button class="btn-primary" id="addTenantBtn" style="width:auto; white-space:nowrap;">+ Yeni Şube Ekle</button>
      </div>
    </div>
    <div class="stat-grid">
      <div class="stat-box"><div class="l">Toplam Şube</div><div class="v">${tenants.length}</div></div>
      <div class="stat-box"><div class="l">Son 30 Gün Ciro</div><div class="v accent">${cur}${totalRevenue.toFixed(2)}</div></div>
      <div class="stat-box"><div class="l">Aktif Abonelik</div><div class="v">${activeCount}</div></div>
      <div class="stat-box"><div class="l">Deneme Sürecinde</div><div class="v">${trialCount}</div></div>
    </div>
    <div id="addTenantModalWrap"></div>
    <div id="addBrandModalWrap"></div>`;

    if(tenants.length === 0){ el.innerHTML = statsHtml + '<p class="empty-note">Henüz kayıtlı şube yok.</p>'; return; }

    const cardsHtml = tenants.map(t=>{
      const feats = t.features ? (typeof t.features==='string'?JSON.parse(t.features):t.features) : {};
      const initial = (t.name||'?').charAt(0).toUpperCase();
      const trialInfo = t.subscription_status==='trial' && t.trial_ends_at
        ? `<div style="color:var(--warning); font-size:11px; margin-top:4px;">Deneme bitiş: ${new Date(t.trial_ends_at).toLocaleDateString('tr-TR')}</div>` : '';
      return `
      <div class="tenant-card">
        <div class="tenant-top">
          <div class="tenant-clickable" data-entertenant="${t.id}" style="display:flex; align-items:center; gap:14px; cursor:pointer; flex:1;">
            <div class="tenant-avatar">${initial}</div>
            <div class="tenant-info">
              <div class="name">${t.name} <button data-editname="${t.id}" data-currentname="${t.name}" onclick="event.stopPropagation()" style="background:none; font-size:12px; color:var(--muted); padding:2px 4px;" title="İsmi düzenle">✏️</button> <span style="font-size:11px; color:var(--muted); font-weight:400;">→ içine gir</span></div>
              <div class="slug">${t.slug} · ${t.plan || 'başlangıç'}</div>
              ${trialInfo}
              <div style="display:flex; gap:6px; margin-top:6px;" onclick="event.stopPropagation()">
                <select data-typesel="${t.id}" style="font-size:11px; padding:4px 8px; border-radius:6px; border:1px solid var(--border); background:var(--surface);">
                  <option value="">İşletme Türü Seç</option>
                  <option value="cafe" ${t.business_type==='cafe'?'selected':''}>☕ Kahve Dükkanı (self-servis)</option>
                  <option value="restoran" ${t.business_type==='restoran'?'selected':''}>🍽 Restoran/Bar</option>
                  <option value="market" ${t.business_type==='market'?'selected':''}>🏪 Market / Bakkal / Çerezci (kilo/barkod)</option>
                  <option value="diger" ${t.business_type==='diger'?'selected':''}>📦 Diğer</option>
                </select>
                <select data-brandsel="${t.id}" style="font-size:11px; padding:4px 8px; border-radius:6px; border:1px solid var(--border); background:var(--surface);">
                  <option value="">Marka yok (bağımsız şube)</option>
                  ${brands.map(b=>`<option value="${b.id}" ${t.brand_id===b.id?'selected':''}>${b.name}</option>`).join('')}
                </select>
                ${t.brand_id ? `<button data-syncowner="${t.id}" data-brandid="${t.brand_id}" title="Bu şubenin sahip girişini, markadaki diğer şubelere kopyala" style="font-size:11px; padding:4px 8px;">🔑 Girişi Şubelere Yay</button>` : ''}
              </div>
              <div style="display:flex; gap:8px; align-items:center; margin-top:8px;">
                <span style="font-size:11px; color:var(--muted); font-weight:700;">💳 Aylık Otomatik Faturalama:</span>
                <input type="number" data-monthlyprice="${t.id}" value="${t.monthly_price||''}" placeholder="Ücret (₺)" style="width:100px; font-size:11px; padding:5px 8px; border-radius:6px; border:1px solid var(--border);">
                <select data-billingday="${t.id}" style="font-size:11px; padding:5px 8px; border-radius:6px; border:1px solid var(--border); background:var(--surface);">

async function loadContent(){
  const el = document.getElementById('tenantArea');
  try{
    const c = await api('/admin/content');
    el.innerHTML = `
    <div class="page-head">
      <h1>Web Sitesi İçeriği</h1>
      <p>durakpos.com'da görünen metin, fiyat ve görselleri buradan yönetin.</p>
    </div>
    <div class="form-card">
      <label>Ana Başlık (Hero)</label>
      <textarea id="c_hero_title">${c.hero_title || 'Hızlı Satış Yapın,\nKarmaşaya Son Verin.'}</textarea>
      <label>Alt Açıklama</label>
      <textarea id="c_hero_subtitle">${c.hero_subtitle || ''}</textarea>
      <label>Banner Görseli</label>
      ${c.banner_image ? `<img src="${c.banner_image}" class="banner-preview">` : ''}
      <input type="file" id="c_banner_file" accept="image/*">
      <label style="margin-top:10px;">Başlangıç Planı Fiyatı (₺/ay)</label>
      <input type="text" id="c_price_baslangic" value="${c.price_baslangic || '499'}">
      <label>Profesyonel Plan Fiyatı (₺/ay)</label>
      <input type="text" id="c_price_pro" value="${c.price_pro || '999'}">
      <label>Kurumsal Plan Metni</label>
      <input type="text" id="c_price_kurumsal" value="${c.price_kurumsal || 'Özel teklif'}">
      <button class="btn-save" id="saveContentBtn">Kaydet</button>
    </div>`;
    document.getElementById('saveContentBtn').onclick = async ()=>{
      const fields = ['hero_title','hero_subtitle','price_baslangic','price_pro','price_kurumsal'];
      try{
        for(const f of fields){
          await api('/admin/content', {method:'PUT', body:JSON.stringify({key:f, value:document.getElementById('c_'+f).value})});
        }
        alert('Kaydedildi.');
      }catch(e){ alert(e.message); }
    };
    document.getElementById('c_banner_file').onchange = (e)=>{
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev)=>{
        const img = new Image();
        img.onload = async ()=>{
          const maxW = 900;
          const scale = Math.min(1, maxW/img.width);
          const canvas = document.createElement('canvas');
          canvas.width = img.width*scale; canvas.height = img.height*scale;
          canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
          try{ await api('/admin/content', {method:'PUT', body:JSON.stringify({key:'banner_image', value:dataUrl})}); loadContent(); }
          catch(err){ alert(err.message); }
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    };
  }catch(e){ el.innerHTML = `<p style="color:var(--danger); font-size:13px;">Veri alınamadı: ${e.message}</p>`; }
}

            <td><b>${i.tenant_name}</b></td>
            <td>${i.invoice_number}</td>
            <td>₺${Number(i.amount).toFixed(2)}</td>
            <td>${new Date(i.due_date).toLocaleDateString('tr-TR')}</td>
            <td><span class="badge ${i.paid?'active':'past_due'}">${i.paid?'Ödendi':'Ödenmemiş'}</span></td>
            <td>
              ${!i.paid ? `<button class="add-btn2" data-markpaid="${i.id}" style="padding:6px 12px; font-size:11.5px;">Ödendi İşaretle</button>` : ''}
              <button data-delinvoice="${i.id}" style="background:none; color:var(--danger); font-size:11.5px; border:none; cursor:pointer;">Sil</button>
            </td>
          </tr>`).join('') || '<tr><td colspan="6" style="color:var(--muted); padding:14px;">Henüz fatura yok.</td></tr>'}
      </tbody>
    </table>
    </div>
    <div id="invoiceModalWrap"></div>`;

    document.getElementById('newInvoiceBtn').onclick = ()=>{
      const wrap = document.getElementById('invoiceModalWrap');
      wrap.innerHTML = `
        <div class="modal-overlay" id="invOverlay">
          <div class="modal-card">
            <h3>Yeni Fatura Oluştur</h3>
            <label>İşletme</label>
            <select id="invTenant">${tenantsList.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}</select>
            <label>Fatura Numarası</label>
            <input id="invNumber" placeholder="Örn: DP2026-001">
            <label>Tutar (₺)</label>
            <input id="invAmount" type="number" placeholder="999">
            <label>Son Ödeme Tarihi</label>
            <input id="invDue" type="date">
            <div class="modal-err" id="invErr"></div>
            <button class="btn-primary" id="invSaveBtn" style="margin-top:14px;">Oluştur</button>
            <button class="modal-cancel" id="invCancelBtn">Vazgeç</button>
          </div>
        </div>`;
      document.getElementById('invCancelBtn').onclick = ()=>{ wrap.innerHTML=''; };
      document.getElementById('invOverlay').onclick = (e)=>{ if(e.target.id==='invOverlay') wrap.innerHTML=''; };
      document.getElementById('invSaveBtn').onclick = async ()=>{
        const body = {
          tenant_id: Number(document.getElementById('invTenant').value),
          invoice_number: document.getElementById('invNumber').value.trim(),
          amount: Number(document.getElementById('invAmount').value),
          due_date: document.getElementById('invDue').value,
        };
        const err = document.getElementById('invErr');
        if(!body.invoice_number || !body.amount || !body.due_date){ err.textContent='Tüm alanları doldurun.'; return; }
        try{ await api('/admin/invoices', {method:'POST', body:JSON.stringify(body)}); wrap.innerHTML=''; loadInvoices(); }
        catch(e){ err.textContent = e.message; }
      };
    };
    document.querySelectorAll('[data-markpaid]').forEach(b=>b.onclick=async()=>{
      try{ await api('/admin/invoices/'+b.dataset.markpaid, {method:'PATCH', body:JSON.stringify({paid:true})}); loadInvoices(); }
      catch(e){ alert(e.message); }
    });
    document.querySelectorAll('[data-delinvoice]').forEach(b=>b.onclick=async()=>{
      if(!confirm('Bu faturayı silmek istiyor musunuz?')) return;
      await api('/admin/invoices/'+b.dataset.delinvoice, {method:'DELETE'}); loadInvoices();
    });
  }catch(e){ el.innerHTML = `<p style="color:var(--danger); font-size:13px;">Veri alınamadı: ${e.message}</p>`; }
}

// ---- Süper Admin AI Asistanı ----
let adminAiHistory = [];
function loadAdminAiAsk(){
  const el = document.getElementById('tenantArea');
  const suggestions = [
    'Hangi müşterilerim risk altında?',
    'Deneme süresi yakında biten şubeler hangileri?',
    'En çok ciro yapan müşterim kim?',
    'Ödenmemiş faturam var mı?'
  ];
  function renderChat(){
    el.innerHTML = `
      <div class="page-head"><h1>AI Asistan</h1><p>Platform genelinde (tüm şubeler) verilerinizi yorumlatıp sorular sorabilirsiniz.</p></div>
      <div class="admin-chat-wrap">
        <div class="admin-chat-messages" id="adminChatMessages">
          ${adminAiHistory.length===0 ? '<div class="admin-chat-empty">👋 Merhaba! Tüm şubelerinizin verilerini biliyorum — sorularınızı sorabilirsiniz.</div>' : ''}
          ${adminAiHistory.map(m=>`<div class="admin-chat-bubble ${m.role}">${escapeHtmlAdmin(m.content)}</div>`).join('')}
        </div>
        ${adminAiHistory.length===0 ? `<div class="admin-chat-suggestions">${suggestions.map(s=>`<button class="admin-chat-sugg" data-sugg="${s}">${s}</button>`).join('')}</div>` : ''}
        <div class="admin-chat-input-row">
          <input type="text" id="adminChatInput" placeholder="Bir soru sorun…">
          <button id="adminChatSendBtn">Gönder</button>
        </div>
      </div>`;
    const msgsEl = document.getElementById('adminChatMessages');
    msgsEl.scrollTop = msgsEl.scrollHeight;
    document.querySelectorAll('[data-sugg]').forEach(b=>b.onclick=()=>sendAdminChat(b.dataset.sugg));
    document.getElementById('adminChatSendBtn').onclick = ()=>{
      const input = document.getElementById('adminChatInput');
      if(input.value.trim()) sendAdminChat(input.value.trim());
    };
    document.getElementById('adminChatInput').onkeydown = (e)=>{ if(e.key==='Enter'){ const v=e.target.value.trim(); if(v) sendAdminChat(v); } };
  }
  async function sendAdminChat(text){
    adminAiHistory.push({role:'user', content:text});
    adminAiHistory.push({role:'assistant', content:'…düşünüyor…', thinking:true});
    renderChat();
    try{
      const historyForApi = adminAiHistory.filter(m=>!m.thinking).map(m=>({role:m.role, content:m.content}));
      const res = await api('/admin/ai-insights', {method:'POST', body:JSON.stringify({messages:historyForApi})});
      adminAiHistory = adminAiHistory.filter(m=>!m.thinking);
      adminAiHistory.push({role:'assistant', content:res.reply});
    }catch(e){
      adminAiHistory = adminAiHistory.filter(m=>!m.thinking);
      adminAiHistory.push({role:'assistant', content:'⚠ '+e.message});
    }
    renderChat();
  }
  renderChat();
}
function escapeHtmlAdmin(str){ return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function loadTab(){
  if(adminTab==='tenants') loadTenants();
  else if(adminTab==='demos') loadDemoRequests();
  else if(adminTab==='invoices') loadInvoices();
  else if(adminTab==='content') loadContent();
  else if(adminTab==='blog') loadBlog();
  else if(adminTab==='aiask') loadAdminAiAsk();
  else if(adminTab==='integrations') loadPlatformSettings();
}

function attach(){
  const loginBtn = document.getElementById('loginBtn');
  if(loginBtn) loginBtn.onclick = async ()=>{
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('pass').value;
    try{
      const data = await api('/admin/login', {method:'POST', body:JSON.stringify({email, password})});
      token = data.token; admin = data.admin;
      localStorage.setItem('admin_token', token);
      localStorage.setItem('admin_info', JSON.stringify(admin));
      err=''; render(); loadTab();
    }catch(e){ err = e.message; render(); }
  };
  const toBootstrap = document.getElementById('toBootstrap');
  if(toBootstrap) toBootstrap.onclick = ()=>{ bootstrapMode=true; err=''; render(); };
  const toLogin = document.getElementById('toLogin');
  if(toLogin) toLogin.onclick = ()=>{ bootstrapMode=false; err=''; render(); };
  const bootstrapBtn = document.getElementById('bootstrapBtn');
  if(bootstrapBtn) bootstrapBtn.onclick = async ()=>{
    const name = document.getElementById('bName').value.trim();
    const email = document.getElementById('bEmail').value.trim();
    const password = document.getElementById('bPass').value;
    try{
      await api('/admin/bootstrap', {method:'POST', body:JSON.stringify({name, email, password})});
      alert('Hesap oluşturuldu, şimdi giriş yapabilirsiniz.');
      bootstrapMode=false; err=''; render();
    }catch(e){ err = e.message; render(); }
  };
  const logoutBtn = document.getElementById('logoutBtn');
  if(logoutBtn) logoutBtn.onclick = ()=>{
    token=null; admin=null;
    localStorage.removeItem('admin_token'); localStorage.removeItem('admin_info');
    render();
  };
  const hamburgerBtn = document.getElementById('hamburgerBtn');
  const sidebarEl = document.getElementById('sidebarEl');
  const mobileOverlay = document.getElementById('mobileOverlay');
  function closeMobileSidebar(){ if(sidebarEl) sidebarEl.classList.remove('open'); if(mobileOverlay) mobileOverlay.classList.remove('show'); }
  if(hamburgerBtn) hamburgerBtn.onclick = ()=>{ sidebarEl.classList.toggle('open'); mobileOverlay.classList.toggle('show'); };
  if(mobileOverlay) mobileOverlay.onclick = closeMobileSidebar;
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ adminTab=b.dataset.tab; render(); loadTab(); closeMobileSidebar(); });
  if(token){ loadTab(); registerForPushNotifications(); }
}

// Native uygulama (Capacitor) içinde çalışıyorsak bildirim izni isteyip
// cihaz jetonunu sunucuya kaydediyoruz. Normal tarayıcıda sessizce atlanır.
function registerForPushNotifications(){
  if(!window.Capacitor || !window.Capacitor.Plugins || !window.Capacitor.Plugins.PushNotifications) return;
  const { PushNotifications } = window.Capacitor.Plugins;
  PushNotifications.requestPermissions().then(res=>{
    if(res.receive === 'granted') PushNotifications.register();
  });
  PushNotifications.addListener('registration', (tok)=>{
    api('/admin/push-token', {method:'POST', body:JSON.stringify({token: tok.value})}).catch(()=>{});
  });
}

render();
</script>
