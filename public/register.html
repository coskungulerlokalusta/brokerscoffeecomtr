<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Üye Ol | Brokers Coffee</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  body { font-family: 'Plus Jakarta Sans', sans-serif; background:#faf9f6; }
  h1 { font-family: 'Playfair Display', serif; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center px-6 py-10">
<div class="w-full max-w-sm">
<a href="/" class="block text-center text-xl mb-6 text-[#0d1b3d]" style="font-family:'Playfair Display',serif;">Brokers Coffee</a>
<h1 class="text-2xl text-[#0d1b3d] text-center mb-6">Üye Ol</h1>

<form id="register-form" class="bg-white rounded-lg shadow-sm p-6 flex flex-col gap-3">
<input required id="name" placeholder="Ad Soyad" class="border border-[#d3c3c0] rounded px-4 py-2.5"/>
<input required id="phone" type="tel" placeholder="Telefon (05xx xxx xx xx)" class="border border-[#d3c3c0] rounded px-4 py-2.5"/>
<input required id="password" type="password" placeholder="Şifre (en az 6 karakter)" class="border border-[#d3c3c0] rounded px-4 py-2.5"/>

<label class="flex items-center gap-2 text-sm text-[#504442] mt-1">
<input type="checkbox" id="is-staff-check"/> Brokers Coffee personeliyim
</label>
<input id="staff-code" placeholder="Personel Kodu" class="border border-[#d3c3c0] rounded px-4 py-2.5 hidden"/>

<p id="error-msg" class="text-red-600 text-sm hidden"></p>

<button type="submit" class="bg-[#0d1b3d] text-white font-semibold py-3 rounded uppercase tracking-widest text-sm hover:bg-[#16285c] transition-colors mt-2">Üye Ol</button>
</form>

<p class="text-center text-sm text-[#827472] mt-4">Zaten üye misin? <a href="/login.html" class="text-[#0d1b3d] font-semibold underline">Giriş Yap</a></p>
</div>

<script>
document.getElementById('is-staff-check').addEventListener('change', (e) => {
  document.getElementById('staff-code').classList.toggle('hidden', !e.target.checked);
});

document.getElementById('register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorMsg = document.getElementById('error-msg');
  errorMsg.classList.add('hidden');
  const payload = {
    name: document.getElementById('name').value,
    phone: document.getElementById('phone').value,
    password: document.getElementById('password').value,
  };
  if (document.getElementById('is-staff-check').checked) {
    payload.staffCode = document.getElementById('staff-code').value;
  }
  try {
    const res = await fetch('/api/account/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) {
      errorMsg.textContent = data.error || 'Kayıt başarısız';
      errorMsg.classList.remove('hidden');
      return;
    }
    window.location.href = '/account.html';
  } catch (err) {
    errorMsg.textContent = 'Bağlantı hatası, tekrar deneyin.';
    errorMsg.classList.remove('hidden');
  }
});
</script>
</body>
</html>
