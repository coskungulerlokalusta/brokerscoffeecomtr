<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Yönetim Paneli | Brokers Coffee</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  body { font-family: 'Plus Jakarta Sans', sans-serif; }
  h1, h2 { font-family: 'Playfair Display', serif; }
  .status-badge { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 4px 10px; border-radius: 999px; }
</style>
</head>
<body class="bg-[#faf9f6] min-h-screen">

<header class="bg-[#0d1b3d] text-white px-6 py-4 flex items-center justify-between">
<h1 class="text-xl">Brokers Coffee — Yönetim</h1>
<div class="flex items-center gap-4 text-sm">
<span id="username-display" class="text-white/70"></span>
<button id="change-pw-btn" class="border border-white/30 rounded px-3 py-1.5 hover:bg-white/10 transition-colors">Şifre Değiştir</button>
<button id="logout-btn" class="border border-white/30 rounded px-3 py-1.5 hover:bg-white/10 transition-colors">Çıkış</button>
</div>
</header>

<div id="pw-modal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50">
<div class="bg-white rounded-lg p-6 w-full max-w-sm">
<h3 class="font-semibold text-[#0d1b3d] mb-4">Şifre Değiştir</h3>
<form id="pw-form" class="flex flex-col gap-3">
<input id="current-pw" type="password" placeholder="Mevcut şifre" required class="border border-[#d3c3c0] rounded px-3 py-2"/>
<input id="new-pw" type="password" placeholder="Yeni şifre (en az 8 karakter)" required minlength="8" class="border border-[#d3c3c0] rounded px-3 py-2"/>
<p id="pw-error" class="text-red-600 text-sm hidden"></p>
<p id="pw-success" class="text-emerald-600 text-sm hidden">Şifre güncellendi.</p>
<div class="flex gap-2 mt-2">
<button type="submit" class="flex-1 bg-[#0d1b3d] text-white rounded py-2 text-sm font-semibold">Kaydet</button>
<button type="button" id="pw-cancel" class="flex-1 border border-[#d3c3c0] rounded py-2 text-sm">Vazgeç</button>
</div>
</form>
</div>
</div>

<main class="max-w-5xl mx-auto px-6 py-8">
<div class="flex items-center justify-between mb-6">
<h2 class="text-2xl text-[#0d1b3d]">Siparişler</h2>
<button id="refresh-btn" class="text-sm text-[#735c00] font-semibold">↻ Yenile</button>
</div>

<div id="orders-list" class="flex flex-col gap-4">
<p class="text-[#827472]">Yükleniyor...</p>
</div>
</main>

<script>
const STATUS_LABELS = {
  'yeni': { label: 'Yeni', color: 'bg-blue-100 text-blue-800' },
  'hazirlaniyor': { label: 'Hazırlanıyor', color: 'bg-amber-100 text-amber-800' },
  'hazir': { label: 'Hazır', color: 'bg-emerald-100 text-emerald-800' },
  'teslim-edildi': { label: 'Teslim Edildi', color: 'bg-gray-200 text-gray-700' },
  'iptal': { label: 'İptal', color: 'bg-red-100 text-red-800' },
};
const STATUS_FLOW = ['yeni', 'hazirlaniyor', 'hazir', 'teslim-edildi'];

async function checkAuth() {
  const res = await fetch('/api/admin/me');
  if (!res.ok) {
    window.location.href = '/admin/login.html';
    return null;
  }
  const data = await res.json();
  document.getElementById('username-display').textContent = data.username;
  return data.username;
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleString('tr-TR');
}

function renderOrders(orders) {
  const list = document.getElementById('orders-list');
  if (!orders.length) {
    list.innerHTML = '<p class="text-[#827472]">Henüz sipariş yok.</p>';
    return;
  }
  list.innerHTML = orders.map(o => {
    const itemsText = o.items.map(i => `${i.qty}× ${i.name}${i.size ? ' (' + i.size + ')' : ''}`).join(', ');
    const statusInfo = STATUS_LABELS[o.orderStatus] || { label: o.orderStatus, color: 'bg-gray-100' };
    const nextIdx = STATUS_FLOW.indexOf(o.orderStatus);
    const nextStatus = nextIdx >= 0 && nextIdx < STATUS_FLOW.length - 1 ? STATUS_FLOW[nextIdx + 1] : null;

    return `
      <div class="bg-white rounded-lg shadow-sm p-5">
        <div class="flex items-start justify-between mb-2">
          <div>
            <p class="font-semibold text-[#0d1b3d]">${o.customerName} · ${o.phone}</p>
            <p class="text-xs text-[#827472]">${formatDate(o.createdAt)} · ${o.deliveryType === 'kurye' ? 'Kurye' : 'Gel Al'}${o.address ? ' · ' + o.address : ''}</p>
          </div>
          <span class="status-badge ${statusInfo.color}">${statusInfo.label}</span>
        </div>
        <p class="text-sm text-[#504442] mb-3">${itemsText}</p>
        <div class="flex items-center justify-between">
          <p class="font-bold text-[#0d1b3d]">₺${o.total.toFixed(2)}</p>
          <div class="flex gap-2">
            ${nextStatus ? `<button data-id="${o.id}" data-status="${nextStatus}" class="advance-btn text-xs font-semibold uppercase tracking-widest border border-[#0d1b3d] text-[#0d1b3d] rounded px-3 py-1.5 hover:bg-[#0d1b3d] hover:text-white transition-colors">${STATUS_LABELS[nextStatus].label} Yap</button>` : ''}
            ${o.orderStatus !== 'iptal' && o.orderStatus !== 'teslim-edildi' ? `<button data-id="${o.id}" data-status="iptal" class="advance-btn text-xs font-semibold uppercase tracking-widest border border-red-300 text-red-700 rounded px-3 py-1.5 hover:bg-red-50 transition-colors">İptal Et</button>` : ''}
          </div>
        </div>
      </div>
    `;
  }).join('');

  document.querySelectorAll('.advance-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      await fetch(`/api/admin/orders/${btn.dataset.id}/status`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderStatus: btn.dataset.status }),
      });
      loadOrders();
    });
  });
}

async function loadOrders() {
  const res = await fetch('/api/admin/orders');
  if (!res.ok) return;
  const orders = await res.json();
  renderOrders(orders);
}

const pwModal = document.getElementById('pw-modal');
document.getElementById('change-pw-btn').addEventListener('click', () => pwModal.classList.remove('hidden'));
document.getElementById('pw-cancel').addEventListener('click', () => pwModal.classList.add('hidden'));
document.getElementById('pw-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const currentPassword = document.getElementById('current-pw').value;
  const newPassword = document.getElementById('new-pw').value;
  const errorEl = document.getElementById('pw-error');
  const successEl = document.getElementById('pw-success');
  errorEl.classList.add('hidden');
  successEl.classList.add('hidden');
  const res = await fetch('/api/admin/change-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ currentPassword, newPassword }),
  });
  if (!res.ok) {
    const data = await res.json();
    errorEl.textContent = data.error || 'Bir hata oluştu';
    errorEl.classList.remove('hidden');
    return;
  }
  successEl.classList.remove('hidden');
  document.getElementById('pw-form').reset();
  setTimeout(() => pwModal.classList.add('hidden'), 1500);
});

document.getElementById('logout-btn').addEventListener('click', async () => {
  await fetch('/api/admin/logout', { method: 'POST' });
  window.location.href = '/admin/login.html';
});
document.getElementById('refresh-btn').addEventListener('click', loadOrders);

(async () => {
  const username = await checkAuth();
  if (username) loadOrders();
})();
</script>
</body>
</html>
