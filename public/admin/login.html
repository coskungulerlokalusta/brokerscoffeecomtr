<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Yönetim Girişi | Brokers Coffee</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  body { font-family: 'Plus Jakarta Sans', sans-serif; }
  h1 { font-family: 'Playfair Display', serif; }
</style>
</head>
<body class="bg-[#faf9f6] min-h-screen flex items-center justify-center px-6">
<div class="w-full max-w-sm">
<h1 class="text-3xl text-[#0d1b3d] text-center mb-1">Brokers Coffee</h1>
<p class="text-center text-sm text-[#827472] mb-8 uppercase tracking-widest">Yönetim Paneli</p>

<form id="login-form" class="bg-white rounded-lg shadow-sm p-8 flex flex-col gap-4">
<div>
<label class="text-xs font-semibold text-[#504442] uppercase tracking-widest mb-1 block">Kullanıcı Adı</label>
<input id="username" type="text" required class="w-full border border-[#d3c3c0] rounded px-4 py-2.5 focus:outline-none focus:border-[#0d1b3d]"/>
</div>
<div>
<label class="text-xs font-semibold text-[#504442] uppercase tracking-widest mb-1 block">Şifre</label>
<input id="password" type="password" required class="w-full border border-[#d3c3c0] rounded px-4 py-2.5 focus:outline-none focus:border-[#0d1b3d]"/>
</div>
<p id="error-msg" class="text-red-600 text-sm hidden"></p>
<button type="submit" class="bg-[#0d1b3d] text-white font-semibold py-3 rounded uppercase tracking-widest text-sm hover:bg-[#16285c] transition-colors">Giriş Yap</button>
</form>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const errorMsg = document.getElementById('error-msg');
  errorMsg.classList.add('hidden');
  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    if (!res.ok) {
      const data = await res.json();
      errorMsg.textContent = data.error || 'Giriş başarısız';
      errorMsg.classList.remove('hidden');
      return;
    }
    window.location.href = '/admin/index.html';
  } catch (err) {
    errorMsg.textContent = 'Bağlantı hatası, tekrar deneyin.';
    errorMsg.classList.remove('hidden');
  }
});
</script>
</body>
</html>
