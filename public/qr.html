<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>QR Menü — DurakPOS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<style>
:root{
  --bg:#F7F4EE; --surface:#FFFFFF; --border:#E1D8C8; --text:#241A0F; --muted:#8A7C67;
  --accent:#C97A2E; --navy:#0B1F38;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:Arial,sans-serif; background:var(--bg); color:var(--text); padding-bottom:70px;}
button{font-family:inherit; cursor:pointer; border:none;}

.topbar{position:sticky; top:0; z-index:10; background:var(--navy); color:#fff; padding:16px 18px; display:flex; align-items:center; justify-content:space-between;}
.topbar .biz{font-size:15px; font-weight:800;}
.topbar .tbl{font-size:11.5px; background:rgba(255,255,255,0.14); padding:5px 11px; border-radius:999px;}

.center-wrap{max-width:520px; margin:0 auto; padding:20px 16px;}

/* Masa seçimi */
.table-pick h1{font-size:20px; margin-bottom:6px;}
.table-pick p{color:var(--muted); font-size:13.5px; margin-bottom:22px;}
.table-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.table-btn{background:var(--surface); border:1.5px solid var(--border); border-radius:14px; padding:18px 8px; text-align:center; font-weight:700; font-size:14px;}
.table-btn:active{background:var(--navy); color:#fff; border-color:var(--navy);}

/* Kategori sekmeleri */
.cat-tabs{display:flex; gap:8px; overflow-x:auto; padding:14px 16px; position:sticky; top:56px; background:var(--bg); z-index:9; border-bottom:1px solid var(--border);}
.cat-tab{flex-shrink:0; background:var(--surface); border:1.5px solid var(--border); padding:8px 15px; border-radius:999px; font-size:12.5px; font-weight:700; white-space:nowrap;}
.cat-tab.active{background:var(--navy); color:#fff; border-color:var(--navy);}
.subcat-tabs{display:flex; gap:8px; overflow-x:auto; padding:10px 16px; position:sticky; top:105px; background:var(--bg); z-index:8; border-bottom:1px solid var(--border);}
.subcat-tab{flex-shrink:0; background:none; border:1px solid var(--border); padding:6px 13px; border-radius:999px; font-size:11.5px; font-weight:600; color:var(--muted); white-space:nowrap;}
.subcat-tab.active{background:var(--accent); color:#fff; border-color:var(--accent);}

.prod-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:4px 16px 16px;}
.prod-card{background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden;}
.prod-card .img{height:130px; background:#EFE3D3; display:flex; align-items:center; justify-content:center; font-size:30px;}
.prod-card .img img{display:block; width:100%; height:100%; object-fit:cover;}
.prod-card .info{padding:10px 12px;}
.prod-card .name{font-size:12.5px; font-weight:700; margin-bottom:4px; line-height:1.3;}
.prod-card .price{font-size:12px; color:var(--accent); font-weight:800;}

/* Boy seçim modalı */
.modal-overlay{position:fixed; inset:0; background:rgba(11,31,56,0.5); display:flex; align-items:flex-end; z-index:50;}
.modal-sheet{background:var(--surface); width:100%; border-radius:20px 20px 0 0; padding:22px 20px 28px; max-height:80vh; overflow-y:auto;}
.modal-sheet h3{font-size:16px; margin-bottom:14px;}
.size-opt{display:flex; justify-content:space-between; align-items:center; padding:13px 14px; border:1.5px solid var(--border); border-radius:12px; margin-bottom:8px; font-size:13.5px; font-weight:600;}
.size-opt b{color:var(--accent);}
.modal-close{display:block; margin:14px auto 0; color:var(--muted); font-size:12.5px; font-weight:700;}

/* Alt sepet çubuğu */
.cart-bar{position:fixed; bottom:0; left:0; right:0; background:var(--navy); color:#fff; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; z-index:20;}
.cart-bar.hidden{display:none;}
.cart-bar .cnt{font-size:13px; opacity:0.85;}
.cart-bar .total{font-size:16px; font-weight:800;}
.cart-bar button{background:var(--accent); color:#fff; font-weight:700; padding:11px 20px; border-radius:12px; font-size:13.5px;}

/* Sepet ekranı */
.cart-screen{max-width:520px; margin:0 auto; padding:20px 16px;}
.cart-line{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--border);}
.cart-line .l-name{font-size:13.5px; font-weight:700;}
.cart-line .l-meta{font-size:11.5px; color:var(--muted);}
.cart-line .l-price{font-size:13.5px; font-weight:800;}
.qty-ctrl{display:flex; align-items:center; gap:8px;}
.qty-ctrl button{width:26px; height:26px; border-radius:8px; background:var(--surface2,#F0EAE0); border:1px solid var(--border); font-weight:800;}
.note-box textarea{width:100%; border:1.5px solid var(--border); border-radius:12px; padding:12px; font-size:13px; font-family:inherit; margin-top:16px; resize:none;}
.submit-btn{width:100%; background:var(--navy); color:#fff; font-weight:800; padding:16px; border-radius:14px; font-size:15px; margin-top:20px;}
.back-link{display:inline-block; margin-bottom:14px; color:var(--muted); font-size:13px; font-weight:700;}

/* Onay ekranı */
.confirm{text-align:center; padding:80px 24px;}
.confirm .check{width:70px; height:70px; border-radius:50%; background:#E7F5EA; color:#2E7D46; display:flex; align-items:center; justify-content:center; font-size:34px; margin:0 auto 20px;}
.confirm h2{font-size:20px; margin-bottom:8px;}
.confirm p{color:var(--muted); font-size:13.5px;}

.loading, .err-box{text-align:center; padding:80px 24px; color:var(--muted); font-size:14px;}
</style>
</head>
<body>
<div id="app"><div class="loading">Menü yükleniyor…</div></div>

<script>
const path = window.location.pathname.split('/').filter(Boolean);
const TENANT_SLUG = path[1] || ''; // /qr/<slug>
let menuData = null;
let selectedTable = null;
let activeGroup = null;
let activeSubCat = null;
let cart = []; // {productId, name, size, price, qty, key}
let screen = 'menu'; // 'table' | 'menu' | 'cart' | 'confirm'
let modalProduct = null;
let orderResult = null;

async function boot(){
  try{
    const res = await fetch(`/api/public/qr-menu/${TENANT_SLUG}`);
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Menü alınamadı');
    menuData = data;
    screen = data.requiresTable ? 'table' : 'menu';
    if(menuData.categories.length){
      activeGroup = menuData.categories[0].group_name;
      const firstSub = menuData.categories.find(c=>c.group_name===activeGroup);
      activeSubCat = firstSub ? firstSub.id : null;
    }
    render();
  }catch(e){
    document.getElementById('app').innerHTML = `<div class="err-box">Menü yüklenemedi: ${e.message}</div>`;
  }
}

// Menü fiyat/ürün değişikliklerini otomatik yansıtmak için periyodik senkronizasyon —
// sadece müşteri menüyü gezerken (sepet/ödeme ekranında değilken) sessizce günceller
async function syncMenuInBackground(){
  if(screen !== 'menu' && screen !== 'table') return;
  try{
    const res = await fetch(`/api/public/qr-menu/${TENANT_SLUG}`);
    const data = await res.json();
    if(!res.ok) return;
    menuData = data;
    if(screen === 'menu') render();
  }catch(e){ /* sessiz geç, bir sonraki denemede tekrar dener */ }
}
setInterval(syncMenuInBackground, 15000);

function cartTotal(){ return cart.reduce((s,c)=>s+c.price*c.qty,0); }
function cartCount(){ return cart.reduce((s,c)=>s+c.qty,0); }
const cur = ()=> menuData && menuData.tenant ? menuData.tenant.currency : '₺';

function render(){
  const app = document.getElementById('app');
  const tableBadge = selectedTable ? `<div class="tbl">🪑 ${selectedTable.name}</div>` : '';
  let body = '';

  if(screen === 'table'){
    body = `
    <div class="center-wrap table-pick">
      <h1>${menuData.tenant.name}</h1>
      <p>Sipariş verebilmek için önce masanızı seçin.</p>
      <div class="table-grid">
        ${menuData.tables.map(t=>`<button class="table-btn" data-tid="${t.id}" data-tname="${t.name}">${t.name}</button>`).join('')}
      </div>
    </div>`;
    app.innerHTML = `<div class="topbar"><div class="biz">${menuData.tenant.name}</div></div>` + body;
    document.querySelectorAll('[data-tid]').forEach(b=>b.onclick=()=>{
      selectedTable = { id: b.dataset.tid, name: b.dataset.tname };
      screen = 'menu'; render();
    });
    return;
  }

  if(screen === 'confirm'){
    app.innerHTML = `
      <div class="topbar"><div class="biz">${menuData.tenant.name}</div>${tableBadge}</div>
      <div class="confirm">
        <div class="check">✓</div>
        <h2>Siparişiniz Alındı!</h2>
        <p>Sipariş No: #${orderResult}${selectedTable ? ' · '+selectedTable.name : ''}<br>Afiyet olsun, en kısa sürede hazırlanıyor.</p>
      </div>`;
    return;
  }

  if(screen === 'cart'){
    app.innerHTML = `
      <div class="topbar"><div class="biz">${menuData.tenant.name}</div>${tableBadge}</div>
      <div class="cart-screen">
        <a class="back-link" id="backToMenu">← Menüye Dön</a>
        <h2 style="font-size:18px; margin-bottom:14px;">Sepetiniz</h2>
        ${cart.length===0 ? '<p style="color:var(--muted); font-size:13.5px;">Sepetiniz boş.</p>' : cart.map((c,i)=>`
          <div class="cart-line">
            <div>
              <div class="l-name">${c.name}</div>
              <div class="l-meta">${c.size}</div>
            </div>
            <div class="qty-ctrl">
              <button data-dec="${i}">−</button>
              <span>${c.qty}</span>
              <button data-inc="${i}">+</button>
            </div>
            <div class="l-price">${cur()}${(c.price*c.qty).toFixed(2)}</div>
          </div>`).join('')}
        ${cart.length ? `
          <div class="note-box"><textarea id="orderNote" rows="2" placeholder="Sipariş notu (isteğe bağlı)"></textarea></div>
          <div style="display:flex; justify-content:space-between; margin-top:16px; font-weight:800; font-size:15px;">
            <span>Toplam</span><span>${cur()}${cartTotal().toFixed(2)}</span>
          </div>
          <button class="submit-btn" id="submitOrderBtn">Siparişi Gönder</button>` : ''}
      </div>`;
    document.getElementById('backToMenu').onclick = ()=>{ screen='menu'; render(); };
    document.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{ cart[b.dataset.inc].qty++; render(); });
    document.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{
      const i = b.dataset.dec; cart[i].qty--; if(cart[i].qty<=0) cart.splice(i,1); render();
    });
    const submitBtn = document.getElementById('submitOrderBtn');
    if(submitBtn) submitBtn.onclick = async ()=>{
      submitBtn.disabled = true; submitBtn.textContent = 'Gönderiliyor…';
      try{
        const items = cart.map(c=>({ name:c.name, size:c.size, price:c.price, qty:c.qty }));
        const note = document.getElementById('orderNote').value.trim();
        const res = await fetch('/api/public/qr-order', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ tenantSlug: TENANT_SLUG, tableId: selectedTable ? selectedTable.id : null, items, customerNote: note })
        });
        const data = await res.json();
        if(!res.ok) throw new Error(data.error || 'Sipariş gönderilemedi');
        orderResult = data.orderId; cart = []; screen = 'confirm'; render();
      }catch(e){ alert(e.message); submitBtn.disabled=false; submitBtn.textContent='Siparişi Gönder'; }
    };
    return;
  }

  // screen === 'menu'
  const groups = [...new Set(menuData.categories.map(c=>c.group_name))];
  const subCats = menuData.categories.filter(c=>c.group_name===activeGroup);
  const prods = menuData.products.filter(p=>p.category_id===activeSubCat);

  body = `
    <div class="cat-tabs">${groups.map(g=>`<button class="cat-tab ${g===activeGroup?'active':''}" data-grp="${g}">${g}</button>`).join('')}</div>
    <div class="subcat-tabs">${subCats.map(c=>`<button class="subcat-tab ${c.id===activeSubCat?'active':''}" data-subcat="${c.id}">${c.name}</button>`).join('')}</div>
    <div class="prod-grid">
      ${prods.map(p=>`
        <div class="prod-card" data-pid="${p.id}">
          <div class="img">${p.image_url ? `<img src="${p.image_url}">` : '☕'}</div>
          <div class="info">
            <div class="name">${p.name}</div>
            <div class="price">${p.sizes.length>1 ? cur()+Math.min(...p.sizes.map(s=>s.price))+' - '+cur()+Math.max(...p.sizes.map(s=>s.price)) : cur()+p.sizes[0].price}</div>
          </div>
        </div>`).join('') || '<p style="grid-column:1/-1; color:var(--muted); font-size:13px; padding:20px 0;">Bu kategoride ürün yok.</p>'}
    </div>
    ${modalProduct ? renderSizeModal() : ''}
  `;
  app.innerHTML = `<div class="topbar"><div class="biz">${menuData.tenant.name}</div>${tableBadge}</div>` + body +
    `<div class="cart-bar ${cartCount()===0?'hidden':''}">
       <div><div class="cnt">${cartCount()} ürün</div><div class="total">${cur()}${cartTotal().toFixed(2)}</div></div>
       <button id="goCartBtn">Sepeti Gör →</button>
     </div>`;

  document.querySelectorAll('[data-grp]').forEach(b=>b.onclick=()=>{
    activeGroup=b.dataset.grp;
    const firstSub = menuData.categories.find(c=>c.group_name===activeGroup);
    activeSubCat = firstSub ? firstSub.id : null;
    render();
  });
  document.querySelectorAll('[data-subcat]').forEach(b=>b.onclick=()=>{ activeSubCat=Number(b.dataset.subcat); render(); });
  document.querySelectorAll('[data-pid]').forEach(c=>c.onclick=()=>{
    modalProduct = menuData.products.find(p=>p.id==c.dataset.pid); render();
  });
  const goCartBtn = document.getElementById('goCartBtn');
  if(goCartBtn) goCartBtn.onclick = ()=>{ screen='cart'; render(); };
  if(modalProduct){
    document.querySelectorAll('[data-addsize]').forEach(b=>b.onclick=()=>{
      const size = modalProduct.sizes.find(s=>s.id==b.dataset.addsize);
      const key = modalProduct.id+'-'+size.id;
      const existing = cart.find(c=>c.key===key);
      if(existing) existing.qty++;
      else cart.push({ key, productId: modalProduct.id, name: modalProduct.name, size: size.label, price: Number(size.price), qty: 1 });
      modalProduct = null; render();
    });
    document.getElementById('closeModal').onclick = ()=>{ modalProduct=null; render(); };
  }
}

function renderSizeModal(){
  return `
  <div class="modal-overlay">
    <div class="modal-sheet">
      <h3>${modalProduct.name}</h3>
      ${modalProduct.sizes.map(s=>`<div class="size-opt" data-addsize="${s.id}" style="cursor:pointer;">${s.label} <b>${cur()}${s.price}</b></div>`).join('')}
      <button class="modal-close" id="closeModal">Vazgeç</button>
    </div>
  </div>`;
}

boot();
</script>
</body>
</html>
