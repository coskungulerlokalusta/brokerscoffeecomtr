<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Ürün | Brokers Coffee</title>
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#f7f5f0"/>
<link rel="apple-touch-icon" href="/icons/icon-192.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'"/>
<link rel="stylesheet" href="/css/app.css"/>
</head>
<body class="bc bc-pd">
<div id="bc-bars"></div>
<div id="loading" class="bc-wrap" style="padding-top:18px"><div class="bc-skel" style="height:360px;margin-bottom:16px"></div><div class="bc-skel" style="height:160px"></div></div>

<div id="product-content" hidden>
  <div class="bc-wrap bc-pd-layout" style="padding-left:0;padding-right:0">
    <div class="bc-pd-hero">
      <img id="product-image" src="" alt=""/>
      <a class="bc-icon-btn" href="/menu.html" aria-label="Geri" id="back-btn"></a>
    </div>
    <div class="bc-pd-body"><div class="bc-wrap">
      <a id="product-category" class="bc-eyebrow" href="/menu.html"></a>
      <h1 id="product-name" class="bc-h1" style="margin:8px 0 10px;font-size:34px"></h1>
      <p id="product-description" style="color:#4a4e59;font-size:16px;line-height:1.6"></p>
      <div id="price-line" style="margin-top:12px"></div>

      <div id="size-section" class="bc-opt">
        <h2>Boyut Seç</h2>
        <div id="size-options" class="bc-opts"></div>
      </div>

      <div id="sugar-section" class="bc-opt" hidden>
        <h2>Şeker Tercihi <span style="color:var(--bc-red)">*</span></h2>
        <div class="bc-opts">
          <label class="bc-optbtn"><input type="radio" name="sugar" value="sade"/>Sade</label>
          <label class="bc-optbtn"><input type="radio" name="sugar" value="az-sekerli"/>Az Şekerli</label>
          <label class="bc-optbtn"><input type="radio" name="sugar" value="orta-sekerli"/>Orta Şekerli</label>
          <label class="bc-optbtn"><input type="radio" name="sugar" value="cok-sekerli"/>Çok Şekerli</label>
        </div>
        <p id="sugar-required-msg" hidden style="color:var(--bc-red);font-size:13px;font-weight:700;margin-top:8px">Lütfen şeker tercihini seç.</p>
      </div>

      <div id="intensity-section" class="bc-opt">
        <h2>İçim Tercihi</h2>
        <div class="bc-opts" style="grid-template-columns:1fr 1fr">
          <label class="bc-optbtn"><input type="radio" name="intensity" value="normal" checked/>Normal İçim<small>Klasik yoğunluk</small></label>
          <label class="bc-optbtn"><input type="radio" name="intensity" value="yumusak"/>Yumuşak İçim<small>Daha hafif</small></label>
        </div>
      </div>

      <div id="extra-shot-section" class="bc-opt">
        <h2>Ekstra</h2>
        <label class="bc-switch"><span>☕ Ekstra Shot <span id="extra-shot-price-label" class="bc-muted" style="font-weight:600"></span></span><input type="checkbox" id="extra-shot-check"/></label>
      </div>

      <div class="bc-opt">
        <h2>Not Ekle <span style="text-transform:none;letter-spacing:0;font-weight:600">(opsiyonel)</span></h2>
        <textarea id="order-note-input" class="bc-textarea" rows="2" placeholder="Örn: bardağa isim yazılsın"></textarea>
      </div>
    </div></div>
  </div>

  <div class="bc-buybar">
    <div class="bc-qty"><button id="qty-minus" aria-label="Azalt">−</button><span id="qty-display">1</span><button id="qty-plus" aria-label="Arttır">+</button></div>
    <button id="add-to-cart-btn" class="bc-btn bc-btn-gold">Sepete Ekle · <span id="total-price">₺0</span></button>
  </div>
</div>

<div id="not-found" class="bc-wrap" hidden style="padding-top:60px;text-align:center">
  <div style="font-size:54px">☕</div><h1 class="bc-h2" style="margin:10px 0">Ürün bulunamadı</h1>
  <a class="bc-btn bc-btn-gold" href="/menu.html">Menüye dön</a>
</div>

<script src="/js/push.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/app.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const productId = params.get('id');
let product = null;
let selectedSize = null;
let qty = 1;
let extraShotPrice = 10;
const backBtn = document.getElementById('back-btn');
backBtn.innerHTML = BC.icons.back;
backBtn.addEventListener('click', (e) => { if (document.referrer.startsWith(location.origin) && history.length > 1) { e.preventDefault(); history.back(); } });

function updateTotal() {
  const eff = selectedSize ? BC.eff(selectedSize) : 0;
  const extra = document.getElementById('extra-shot-check').checked ? extraShotPrice : 0;
  document.getElementById('total-price').textContent = BC.money((eff + extra) * qty);
}

function renderSizes() {
  const wrap = document.getElementById('size-options');
  if (product.sizes.length === 1 && !product.sizes[0].label) {
    document.getElementById('size-section').hidden = true;
    selectedSize = product.sizes[0];
    updateTotal();
    return;
  }
  wrap.innerHTML = product.sizes.map((s, i) => {
    const eff = BC.eff(s);
    const priceHtml = eff < s.price ? `<s>${BC.money(s.price)}</s> <b style="color:var(--bc-green)">${BC.money(eff)}</b>` : BC.money(eff);
    return `<button type="button" data-i="${i}" class="bc-optbtn">${BC.esc(s.label || 'Tek Boy')}<small>${priceHtml}</small></button>`;
  }).join('');
  wrap.querySelectorAll('.bc-optbtn').forEach(btn => {
    btn.addEventListener('click', () => {
      wrap.querySelectorAll('.bc-optbtn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedSize = product.sizes[Number(btn.dataset.i)];
      updateTotal();
    });
  });
  wrap.children[0].click();
}

async function init() {
  if (!productId) { showNotFound(); return; }
  try {
    const [productRes, settingsRes] = await Promise.all([
      fetch(`/api/products/${encodeURIComponent(productId)}`),
      fetch('/api/settings/public'),
      BC.load([]),
    ]);
    if (!productRes.ok) throw new Error('not found');
    product = await productRes.json();
    if (settingsRes.ok) {
      const publicSettings = await settingsRes.json();
      extraShotPrice = publicSettings.extraShotPrice ?? 10;
      const hiddenCats = (publicSettings.hideCustomizationForCategories || []).map((c) => c.toLocaleLowerCase('tr'));
      const productCat = (product.subcategory || product.category || '').toLocaleLowerCase('tr');
      if (hiddenCats.includes(productCat)) {
        document.getElementById('intensity-section').hidden = true;
        document.getElementById('extra-shot-section').hidden = true;
      }
    }
    document.getElementById('bc-bars').innerHTML = BC.bars();
    document.getElementById('extra-shot-price-label').textContent = `(+${BC.money(extraShotPrice)})`;
    document.title = `${product.name} | Brokers Coffee`;
    const img = document.getElementById('product-image');
    img.src = product.image || BC.FALLBACK_IMG;
    img.onerror = () => { img.onerror = null; img.src = BC.FALLBACK_IMG; };
    img.alt = product.name;
    const cat = product.subcategory || product.category;
    const catEl = document.getElementById('product-category');
    catEl.textContent = cat; catEl.href = '/menu.html?cat=' + encodeURIComponent(cat);
    document.getElementById('product-name').textContent = product.name;
    document.getElementById('product-description').textContent = product.description || '';
    document.getElementById('product-description').hidden = !product.description;
    document.getElementById('price-line').innerHTML = BC.priceHtml(product);

    renderSizes();

    if (product.name && product.name.toLocaleLowerCase('tr').includes('türk kahvesi')) {
      document.getElementById('sugar-section').hidden = false;
    }

    document.getElementById('loading').hidden = true;
    document.getElementById('product-content').hidden = false;
  } catch (e) {
    showNotFound();
  }
}
function showNotFound() {
  document.getElementById('loading').hidden = true;
  document.getElementById('not-found').hidden = false;
}

document.getElementById('qty-minus').addEventListener('click', () => {
  qty = Math.max(1, qty - 1);
  document.getElementById('qty-display').textContent = qty;
  updateTotal();
});
document.getElementById('qty-plus').addEventListener('click', () => {
  qty += 1;
  document.getElementById('qty-display').textContent = qty;
  updateTotal();
});

document.getElementById('extra-shot-check').addEventListener('change', updateTotal);

document.getElementById('add-to-cart-btn').addEventListener('click', () => {
  if (!selectedSize) return;

  const sugarSection = document.getElementById('sugar-section');
  const sugarChecked = document.querySelector('input[name="sugar"]:checked');
  if (!sugarSection.hidden && !sugarChecked) {
    document.getElementById('sugar-required-msg').hidden = false;
    sugarSection.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  document.getElementById('sugar-required-msg').hidden = true;

  const extraShot = document.getElementById('extra-shot-check').checked;
  const intensity = document.querySelector('input[name="intensity"]:checked').value;
  const note = document.getElementById('order-note-input').value.trim();
  const sugar = sugarChecked ? sugarChecked.value : null;
  const sugarLabels = { sade: 'Sade', 'az-sekerli': 'Az Şekerli', 'orta-sekerli': 'Orta Şekerli', 'cok-sekerli': 'Çok Şekerli' };
  const finalNote = sugar ? `Şeker: ${sugarLabels[sugar]}${note ? ' — ' + note : ''}` : note;

  addToCart({
    productId: product.id,
    name: product.name,
    price: selectedSize.price + (extraShot ? extraShotPrice : 0),
    size: selectedSize.label || null,
    extras: [],
    intensity,
    extraShot,
    note: finalNote,
    sugar,
    qty,
  });
  BC.fly(document.getElementById('product-image'));
  BC.toast(`${qty} × ${product.name} sepete eklendi`);
  const btn = document.getElementById('add-to-cart-btn');
  const original = btn.innerHTML;
  btn.innerHTML = 'Sepete eklendi ✓';
  btn.classList.replace('bc-btn-gold', 'bc-btn-navy');
  setTimeout(() => { btn.innerHTML = original; btn.classList.replace('bc-btn-navy', 'bc-btn-gold'); updateTotal(); }, 1300);
});

init();
</script>
</body>
</html>
