<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Brokers Coffee | Torium AVM</title>
<meta name="description" content="Brokers Coffee — Torium AVM, Esenyurt. Taze demlenmiş kahveler, sipariş üzerine pişen kruvasanlar. Online sipariş ver, Brokers Club ile puan kazan."/>
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#f7f5f0"/>
<link rel="apple-touch-icon" href="/icons/icon-192.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'"/>
<link rel="stylesheet" href="/css/app.css"/>
</head>
<body class="bc">
<div id="bc-root">
  <div class="bc-wrap" style="padding-top:18px">
    <div class="bc-skel" style="height:60px;margin-bottom:16px"></div>
    <div class="bc-skel" style="height:300px;margin-bottom:16px"></div>
    <div class="bc-skel" style="height:120px"></div>
  </div>
</div>

<script src="/js/push.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/app.js"></script>
<script>
(function () {
  const { esc, icons: I } = BC;
  let progress = null;

  function render() {
    const st = BC.state; const c = st.config || {};
    const me = st.me;
    const cats = BC.visibleCategories();
    const slides = c.slides || [];
    const offers = c.offers || [];
    const rails = (c.rails || []).map((r, i) => ({ r, items: BC.railProducts(r, i) })).filter((x) => x.items.length);
    const about = c.about || {};

    document.getElementById('bc-root').innerHTML = `
      ${BC.bars()}
      ${BC.topbar()}
      <main class="bc-wrap">
        <section class="bc-hello bc-reveal">
          <small>${esc(BC.greeting())}${me ? ', ' + esc((me.name || '').split(' ')[0]) : ''} ☕</small>
          <h1 class="bc-h1">${esc((c.brand && c.brand.tagline) || 'Günün ritüeli, kapına kadar.')}</h1>
          <div style="margin-top:12px">${BC.statusChip()}</div>
        </section>

        ${slides.length ? `<section class="bc-sec bc-carousel" id="hero"><div class="bc-track">${slides.map(BC.slide).join('')}</div><div class="bc-dots"></div></section>` : ''}

        <section class="bc-sec bc-reveal">
          <div class="bc-quick">
            <a href="/siparis.html"><span class="ic">${I.order}</span>Sipariş Ver</a>
            <a href="/club.html#firsatlar"><span class="ic">${I.gift}</span>Fırsatlar</a>
            <a href="/menu.html"><span class="ic">${I.menu}</span>Menü</a>
            <a href="/club.html"><span class="ic">${I.star}</span>Club</a>
          </div>
        </section>

        <section class="bc-sec bc-reveal">${BC.clubCard(progress)}</section>

        ${offers.length ? `<section class="bc-sec bc-reveal">
          <div class="bc-sec-head"><h2 class="bc-h2">Fırsatlar</h2><a class="bc-link" href="/club.html#firsatlar">Hepsini gör ${I.arrow}</a></div>
          <div class="bc-rail">${offers.map((o) => BC.offerCard(o, true)).join('')}</div></section>` : ''}

        ${rails.map(({ r, items }) => `<section class="bc-sec bc-reveal">
          <div class="bc-sec-head"><div><h2 class="bc-h2">${esc(r.title)}</h2>${r.subtitle ? `<p class="bc-muted" style="margin-top:4px">${esc(r.subtitle)}</p>` : ''}</div></div>
          <div class="bc-rail">${items.map(BC.productCard).join('')}</div></section>`).join('')}

        ${cats.length ? `<section class="bc-sec bc-reveal">
          <div class="bc-sec-head"><h2 class="bc-h2">Menüyü Keşfet</h2><a class="bc-link" href="/menu.html">Tümü ${I.arrow}</a></div>
          ${BC.categoryGrid(cats)}</section>` : ''}

        ${about.title || about.text ? `<section class="bc-sec bc-reveal" id="hakkimizda">
          <div class="bc-offer bc-about" style="display:grid">
            ${about.image ? `<div class="ph" style="aspect-ratio:16/9">${BC.imgTag(about.image, about.title)}</div>` : ''}
            <div class="bd"><span class="bc-eyebrow">Hikayemiz</span><h3 style="margin-top:6px;font-size:24px">${esc(about.title)}</h3><p style="font-size:15px;line-height:1.6">${esc(about.text)}</p></div>
          </div></section>` : ''}

        <section class="bc-sec bc-reveal">${BC.storeCard()}</section>
        ${BC.footer()}
      </main>`;

    BC.carousel(document.getElementById('hero'));
    BC.reveal();
    BC.animateClub();
    addOrgSchema();
  }

  // Google'ın logoyu tanıması için yapılandırılmış veri (Organization schema)
  let schemaAdded = false;
  function addOrgSchema() {
    const logo = BC.state.content && BC.state.content.logo;
    if (schemaAdded || !logo) return;
    schemaAdded = true;
    const ld = document.createElement('script');
    ld.type = 'application/ld+json';
    ld.textContent = JSON.stringify({ '@context': 'https://schema.org', '@type': 'Organization', name: 'Brokers Coffee', url: 'https://brokerscoffee.com.tr', logo: logo.startsWith('http') ? logo : 'https://brokerscoffee.com.tr' + logo });
    document.head.appendChild(ld);
  }

  BC.onChange(render);
  BC.load(['products', 'categories', 'me', 'content']).then(async () => {
    if (BC.state.me) progress = await BC.getJSON('/api/account/monthly-progress').catch(() => null);
    render();
  });
})();
</script>
</body>
</html>
