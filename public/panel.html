<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>DurakPOS — Yönetim Paneli</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F7F4EE; --surface:#FFFFFF; --surface2:#F0EAE0; --border:#E1D8C8;
  --text:#2B2016; --muted:#7A6E5C; --accent:#C97A2E; --accent-ink:#FFFFFF;
  --danger:#B5342B; --navy:#1B3A63;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:Arial,sans-serif; background:var(--bg); color:var(--text);}
button{font-family:inherit; cursor:pointer; border:none;}
input,select{font-family:inherit;}

/* login */
.login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center;}
.login-card{background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:40px; width:380px;}
.logo{font-size:26px; font-weight:800; margin-bottom:6px;}
.logo span{color:var(--accent);}
.login-sub{color:var(--muted); font-size:13px; margin-bottom:22px;}
.field{margin-bottom:14px;}
.field label{font-size:12px; color:var(--muted); display:block; margin-bottom:4px;}
.field input{width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:11px 14px; font-size:14px; outline:none;}
.field input:focus{border-color:var(--accent);}
.btn-primary{width:100%; background:var(--navy); color:#fff; font-weight:700; padding:12px; border-radius:10px; font-size:14px;}
.err{color:var(--danger); font-size:12px; margin-bottom:10px; min-height:16px;}
.link-btn{background:none; color:var(--accent); font-size:12px; text-decoration:underline; margin-top:14px;}

/* shell */
.shell{display:flex; min-height:100vh;}
.sidebar{width:230px; flex-shrink:0; background:#0B1F38; color:#E6EAF0; padding:18px 12px; display:flex; flex-direction:column;}
.sidebar .logo{padding:0 8px; margin-bottom:20px;}
.nav-btn{display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none; color:#AEB9CC; padding:11px 12px; border-radius:10px; font-size:13px; font-weight:600; margin-bottom:2px;}
.nav-btn.active{background:var(--accent); color:#fff;}
.nav-btn:hover:not(.active){background:rgba(255,255,255,0.06);}
.sidebar .spacer{flex:1;}
.content{flex:1; padding:0; overflow-y:auto;}
.topbar{display:flex; justify-content:space-between; align-items:center; padding:18px 32px; background:var(--surface); border-bottom:1px solid var(--border);}
.topbar .crumb{font-size:12px; color:var(--muted);}
.topbar .crumb b{color:var(--text); font-size:15px; display:block; margin-bottom:2px;}
.topbar .right{display:flex; align-items:center; gap:16px;}
.bell{width:36px; height:36px; border-radius:10px; background:var(--surface2); display:flex; align-items:center; justify-content:center; font-size:15px; color:var(--muted);}
.who{font-size:12.5px; text-align:right; color:var(--muted); line-height:1.4;}
.who b{color:var(--text);}
.avatar{width:36px; height:36px; border-radius:50%; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px;}
.pagepad{padding:26px 32px;}
.topline{display:none;}

.stat-cards{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px; max-width:900px;}
.stat-card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px;}
.stat-card .l{color:var(--muted); font-size:12px; margin-bottom:6px;}
.stat-card .v{font-size:20px; font-weight:800;}

.section{max-width:900px; margin-bottom:28px;}
.section h3{margin-bottom:12px; font-size:15px;}
.card-row{display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:8px;}
.card-row .name{font-weight:600; font-size:13px;}
.card-row .meta{color:var(--muted); font-size:11px; font-family:monospace;}
.add-btn{background:var(--accent); color:#fff; font-weight:700; padding:9px 16px; border-radius:10px; font-size:13px;}
.section-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
.empty{color:var(--muted); font-size:13px;}
.setup-link{position:fixed; bottom:16px; left:16px; font-size:11px; color:var(--muted);}

.card-panel{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:22px 24px; max-width:1100px;}
.card-panel-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:12px;}
.card-panel-head h3{font-size:16px;}
.filter-row{display:flex; gap:8px; align-items:center;}
.filter-row input{background:var(--surface2); border:1px solid var(--border); border-radius:9px; padding:9px 12px; font-size:12.5px;}
.btn-filter{background:var(--navy); color:#fff; font-weight:700; padding:9px 16px; border-radius:9px; font-size:12.5px;}
.btn-export{background:#EFE3D3; color:var(--accent); font-weight:700; padding:9px 16px; border-radius:9px; font-size:12.5px;}
table.ciro-table{width:100%; border-collapse:collapse; font-size:12.5px;}
table.ciro-table th{text-align:left; color:var(--muted); font-size:10.5px; letter-spacing:0.03em; text-transform:uppercase; padding:10px 12px; border-bottom:1px solid var(--border); white-space:nowrap;}
table.ciro-table td{padding:12px; border-bottom:1px solid var(--border); white-space:nowrap; font-weight:600;}
table.ciro-table tr.total td{font-weight:800; background:var(--surface2);}
table.ciro-table td:first-child, table.ciro-table th:first-child{position:sticky; left:0; background:var(--surface);}
table.ciro-table tr.total td:first-child{background:var(--surface2);}

/* Genişleyen sidebar grubu */
.nav-group-head{display:flex; align-items:center; justify-content:space-between; width:100%; text-align:left; background:none; color:#AEB9CC; padding:11px 12px; border-radius:10px; font-size:13px; font-weight:600; margin-bottom:2px;}
.nav-group-head:hover{background:rgba(255,255,255,0.06);}
.nav-group-head .chev{font-size:10px; transition:transform .15s;}
.nav-group-head.open .chev{transform:rotate(90deg);}
.nav-sub{padding-left:14px;}
.nav-sub .nav-btn{font-size:12.5px; padding:9px 12px 9px 20px; position:relative;}
.nav-sub .nav-btn:before{content:"•"; position:absolute; left:8px; color:#5A6B85;}
.nav-sub .nav-btn.active:before{color:#fff;}

/* Kategori ağacı */
.tree-search{display:flex; gap:10px; margin-bottom:20px;}
.tree-search input{flex:1; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:11px 14px; font-size:13px;}
.tree-group{margin-bottom:6px;}
.tree-row{display:flex; align-items:center; gap:10px; padding:11px 10px; border-radius:10px; cursor:pointer;}
.tree-row.active-filter{background:#EFE3D3;}
.tree-row:hover{background:var(--surface2);}
.tree-row .ico{font-size:14px; opacity:0.5;}
.tree-row .label{flex:1; font-weight:700; font-size:13.5px;}
.tree-row.sub .label{font-weight:500; font-size:13px;}
.tree-row.sub{margin-left:26px; border-left:2px solid var(--border); border-radius:0 10px 10px 0;}
.inline-prod-list{margin-left:40px; padding:4px 0 10px; border-left:2px solid var(--border);}
.inline-prod-row{display:flex; align-items:center; gap:10px; padding:9px 14px; border-radius:10px; cursor:pointer;}
.drag-handle{cursor:grab; color:var(--muted); font-size:16px; padding:0 2px; flex-shrink:0;}
.drag-handle:active{cursor:grabbing;}
.inline-prod-row:hover{background:var(--surface2);}
.inline-prod-row .name{font-size:13px; font-weight:700;}
.inline-prod-row .meta{font-size:11.5px; color:var(--muted);}
.tree-actions{display:flex; gap:4px; opacity:0; transition:opacity .1s;}
.tree-row:hover .tree-actions{opacity:1;}
.tree-actions button{width:28px; height:28px; border-radius:8px; background:var(--surface2); font-size:12px;}
.tree-actions button:hover{background:var(--border);}
.tree-actions .del:hover{background:#FCEAEA; color:var(--danger);}

/* QR Menü sayfası */
.qr-top-grid{display:grid; grid-template-columns:1fr 1.4fr; gap:20px; margin-bottom:24px;}
.qr-box{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:24px; text-align:center;}
.qr-box img{width:180px; height:180px; border-radius:12px; border:1px solid var(--border); margin-bottom:14px;}
.qr-link{background:var(--surface2); border-radius:10px; padding:9px 12px; font-size:11.5px; word-break:break-all; margin-bottom:12px; color:var(--muted);}
.qr-copy{background:var(--navy); color:#fff; font-weight:700; padding:9px 18px; border-radius:9px; font-size:12.5px;}
.qr-mode-badge{display:inline-block; font-size:11px; font-weight:700; padding:5px 12px; border-radius:999px; margin-top:14px;}
.qr-mode-badge.self{background:#E7F5EA; color:#2E7D46;}
.qr-mode-badge.table{background:#FCEFDD; color:#B5651D;}
.table-list{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px;}
.table-list h4{font-size:14px; margin-bottom:12px;}
.table-chip{display:inline-flex; align-items:center; gap:8px; background:var(--surface2); border-radius:999px; padding:7px 8px 7px 14px; font-size:12.5px; font-weight:600; margin:0 6px 8px 0;}
.table-chip button{width:20px; height:20px; border-radius:50%; background:var(--border); font-size:11px;}
.qr-orders-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
.qr-order-card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:10px;}
.qr-order-card .top{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
.qr-order-card .tbl-badge{font-size:11px; font-weight:700; background:#EFE3D3; color:var(--accent); padding:3px 10px; border-radius:999px;}
.qr-order-card .items{font-size:12.5px; color:var(--muted); margin-bottom:10px; line-height:1.6;}
.qr-order-card .actions{display:flex; gap:8px;}
.qr-order-card .actions button{flex:1; padding:8px; border-radius:9px; font-size:12px; font-weight:700;}
.qr-order-card .accept{background:var(--navy); color:#fff;}
.qr-order-card .done{background:#E7F5EA; color:#2E7D46;}
.qr-order-card .cancel{background:#FCEAEA; color:var(--danger);}

/* QR Menü — otomatik oluşturma ekranı */
.qr-gen-box{background:var(--surface); border:1.5px dashed var(--border); border-radius:20px; padding:48px 32px; text-align:center; max-width:560px; margin:20px auto;}
.qr-gen-box .icon{width:64px; height:64px; border-radius:18px; background:#EFE3D3; color:var(--accent); font-size:28px; display:flex; align-items:center; justify-content:center; margin:0 auto 18px;}
.qr-gen-box h3{font-size:18px; margin-bottom:8px;}
.qr-gen-box p{color:var(--muted); font-size:13.5px; line-height:1.6; margin-bottom:6px;}
.qr-gen-box .stat-line{font-size:12.5px; color:var(--text); font-weight:700; margin:14px 0 22px; background:var(--surface2); display:inline-block; padding:8px 16px; border-radius:999px;}
.qr-gen-btn{background:var(--navy); color:#fff; font-weight:800; padding:15px 28px; border-radius:14px; font-size:14.5px;}
.qr-gen-btn:disabled{opacity:0.5;}
.qr-regen{display:block; margin-top:14px; font-size:12px; color:var(--muted); font-weight:700;}

/* Kategori / Ürün ekleme modalları */
.mm-overlay{position:fixed; inset:0; background:rgba(11,31,56,0.45); display:flex; align-items:center; justify-content:center; z-index:60;}
.mm-modal{background:var(--surface); border-radius:18px; padding:26px 24px; width:380px; max-width:90vw;}
.mm-modal h3{font-size:16px; margin-bottom:16px;}
.mm-modal label{font-size:12px; color:var(--muted); display:block; margin-bottom:6px; margin-top:14px;}
.mm-modal label:first-of-type{margin-top:0;}
.mm-modal input, .mm-modal select{width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:11px 14px; font-size:14px; font-family:inherit;}
.field-label{font-size:12px; color:var(--muted); display:block; margin-bottom:6px; margin-top:16px; font-weight:600;}
.field-label:first-of-type{margin-top:0;}
.field-input{width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:12px 14px; font-size:14px; font-family:inherit; box-sizing:border-box; display:block;}
.mm-toggle-new{font-size:11.5px; color:var(--accent); font-weight:700; margin-top:8px; display:inline-block;}
.mm-save{width:100%; background:var(--navy); color:#fff; font-weight:800; padding:13px; border-radius:10px; font-size:14px; margin-top:20px;}
.mm-cancel{display:block; margin:12px auto 0; color:var(--muted); font-size:12.5px; font-weight:700;}
.mm-err{color:var(--danger); font-size:12px; min-height:16px; margin-top:6px;}
.mm-preset-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;}
.mm-preset{background:var(--surface2); border:1px solid var(--border); padding:7px 12px; border-radius:999px; font-size:11.5px; font-weight:700; color:var(--text);}
.mm-preset:hover{border-color:var(--navy);}
.mm-size-row{display:flex; gap:6px; margin-bottom:8px; align-items:center;}
.mm-size-row .sz-label{flex:1.3; width:auto;}
.mm-size-row .sz-price{flex:1; width:auto;}
.mm-size-row .sz-del{width:32px; height:32px; flex-shrink:0; border-radius:8px; background:var(--surface2); color:var(--danger); font-size:12px;}
.prod-thumb{width:44px; height:44px; border-radius:8px; object-fit:cover; margin-right:12px; flex-shrink:0;}
.photo-btn{width:32px; height:32px; border-radius:8px; background:var(--surface2); font-size:13px; margin-right:6px;}

/* AI Menü Asistanı */
.ai-box{background:linear-gradient(135deg, #0B1F38, #173254); border-radius:18px; padding:22px 24px; margin-bottom:22px; color:#fff;}
.ai-box-head{display:flex; gap:14px; margin-bottom:16px;}
.ai-ico{width:40px; height:40px; border-radius:12px; background:rgba(255,255,255,0.12); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;}
.ai-box-head h3{font-size:15px; margin-bottom:4px;}
.ai-box-head p{font-size:12.5px; opacity:0.75; line-height:1.55; margin:0;}
.ai-box textarea{width:100%; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); border-radius:12px; padding:14px; font-size:13px; color:#fff; font-family:inherit; resize:vertical;}
.ai-box textarea::placeholder{color:rgba(255,255,255,0.4);}
.ai-box-actions{display:flex; gap:10px; margin-top:12px; flex-wrap:wrap;}
.ai-btn{padding:11px 18px; border-radius:10px; font-size:12.5px; font-weight:700; background:rgba(255,255,255,0.1); color:#fff; border:1px solid rgba(255,255,255,0.2);}
.ai-btn.primary{background:var(--accent); border-color:var(--accent);}
.ai-btn:disabled{opacity:0.5;}
.ai-status{font-size:12.5px; margin-top:10px; min-height:16px;}
.ai-status.ok{color:#8FE3B0;}
.ai-status.err{color:#FFB4B0;}

/* Maliyet Hesaplama */
.cost-ing-row{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 14px; margin-bottom:8px;}
.cost-ing-row .nm{flex:1.4; font-weight:700; font-size:13px;}
.cost-ing-row .unit-badge{background:var(--surface2); font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:999px; color:var(--muted);}
.cost-ing-row input{width:100px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:12.5px;}
.cost-prod-row{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 16px; margin-bottom:8px; cursor:pointer;}
.cost-prod-row:hover{border-color:var(--navy);}
.cost-prod-row .top{display:flex; justify-content:space-between; align-items:center;}
.cost-prod-row .nm{font-weight:700; font-size:13.5px;}
.cost-prod-row .cost-badge{font-size:12px; font-weight:800; padding:5px 12px; border-radius:999px;}
.cost-prod-row .cost-badge.ok{background:#E7F5EA; color:#2E7D46;}
.cost-prod-row .cost-badge.none{background:var(--surface2); color:var(--muted);}
.cost-prod-row .margins{font-size:11.5px; color:var(--muted); margin-top:6px;}
.recipe-row{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
.recipe-row select{flex:1.6;}
.recipe-row input{flex:1; width:auto;}
.cost-summary-box{background:var(--surface2); border-radius:12px; padding:12px 16px; margin-top:14px; font-size:13px; font-weight:700; display:flex; justify-content:space-between;}
.month-picker-row{display:flex; align-items:center; gap:10px; margin-bottom:18px;}
.month-picker-row input{background:var(--surface2); border:1px solid var(--border); border-radius:9px; padding:9px 12px; font-size:13px;}
.cost-stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px; max-width:900px;}
.trend-row{display:flex; align-items:center; gap:14px; padding:9px 0; border-bottom:1px solid var(--border);}
.trend-row:last-child{border-bottom:none;}
.trend-label{width:90px; font-size:12px; font-weight:700; flex-shrink:0;}
.trend-bar-wrap{flex:1; background:var(--surface2); border-radius:6px; height:10px; overflow:hidden;}
.trend-bar{height:100%; background:var(--navy); border-radius:6px;}
.trend-orders{width:80px; font-size:11.5px; color:var(--muted); flex-shrink:0; text-align:right;}
.trend-amt{width:110px; font-size:12.5px; font-weight:800; flex-shrink:0; text-align:right;}
.staff-report-table{width:100%; border-collapse:collapse; font-size:13px;}
.staff-report-table th{text-align:left; color:var(--muted); font-size:10.5px; text-transform:uppercase; letter-spacing:0.03em; padding:10px 12px; border-bottom:1.5px solid var(--border);}
.staff-report-table td{padding:11px 12px; border-bottom:1px solid var(--border);}
.invoice-table-tenant{width:100%; border-collapse:collapse; font-size:13px; max-width:700px;}
.invoice-table-tenant th{text-align:left; color:var(--muted); font-size:10.5px; text-transform:uppercase; letter-spacing:0.03em; padding:12px; border-bottom:1.5px solid var(--border);}
.invoice-table-tenant td{padding:12px; border-bottom:1px solid var(--border);}

.billing-stat-card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px; display:flex; align-items:center; gap:14px;}
.billing-stat-icon{width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0;}
.billing-stat-label{font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:0.02em; margin-bottom:4px;}
.billing-stat-val{font-size:21px; font-weight:800; color:var(--text);}
.billing-alert{background:#FCEFDD; color:#B5651D; border:1px solid #F0D5AE; padding:14px 18px; border-radius:12px; margin-bottom:22px; font-size:13.5px; max-width:900px;}
.billing-invoice-list{display:flex; flex-direction:column; gap:12px; max-width:900px;}
.billing-invoice-card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px 22px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;}
.billing-invoice-card.unpaid{border-left:4px solid var(--danger);}
.billing-inv-left{display:flex; align-items:center; gap:14px;}
.billing-inv-icon{width:40px; height:40px; border-radius:10px; background:var(--bg); display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0;}
.billing-inv-num{font-weight:800; font-size:14px;}
.billing-inv-date{font-size:12px; color:var(--muted); margin-top:2px;}
.billing-inv-right{display:flex; align-items:center; gap:14px;}
.billing-inv-amount{font-size:17px; font-weight:800;}
.billing-inv-badge{font-size:11px; font-weight:700; padding:5px 12px; border-radius:999px;}
.billing-inv-badge.paid{background:#E7F5EA; color:#2E7D46;}
.billing-inv-badge.unpaid{background:#FCEAEA; color:var(--danger);}
.billing-pay-btn{background:var(--accent); color:#fff; padding:9px 18px; border-radius:9px; font-size:12.5px; font-weight:800;}
@media (max-width:700px){
  .billing-stat-card{padding:14px;}
  div[style*="grid-template-columns:repeat(3,1fr)"]{grid-template-columns:1fr !important;}
}

/* AI Asistan — sohbet */
.chat-wrap{display:flex; flex-direction:column; height:calc(100vh - 160px); max-width:760px; background:#E9DFC9; background-image:radial-gradient(rgba(0,0,0,0.025) 1px, transparent 1px); background-size:18px 18px; border:1px solid var(--border); border-radius:18px; overflow:hidden;}
.chat-header{display:flex; align-items:center; gap:12px; padding:12px 18px; background:var(--navy); color:#fff;}
.chat-header .chat-avatar{width:38px; height:38px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0;}
.chat-header .chat-title{font-size:14px; font-weight:800;}
.chat-header .chat-sub{font-size:11px; opacity:0.7;}
.chat-messages{flex:1; overflow-y:auto; padding:16px 18px; display:flex; flex-direction:column; gap:3px;}

<script>
const API_BASE = '/api';
let token = localStorage.getItem('panel_token') || null;

// AI ile üretilen görseller Gemini'den yüksek çözünürlükte geliyor — ürün
// kartlarında küçük gösterildiği için bu boyutta saklamanın anlamı yok,
// hem yavaş yüklenmesine hem gereksiz depolama alanına sebep oluyordu.
// Kaydetmeden önce, elle yüklenen resimlerle aynı boyuta (480px) küçültüyoruz.
function resizeDataUrl(dataUrl, maxW=480){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width*scale; canvas.height = img.height*scale;
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = ()=>resolve(dataUrl); // küçültme başarısız olursa orijinali kullan
    img.src = dataUrl;
  });
}
let tenant = JSON.parse(localStorage.getItem('panel_tenant') || 'null');
let branches = JSON.parse(localStorage.getItem('panel_branches') || '[]');

async function switchBranch(targetTenantId){
  try{
    const res = await fetch(API_BASE+'/auth/switch-branch', {
      method:'POST', headers:{'Content-Type':'application/json', 'Authorization':'Bearer '+token},
      body: JSON.stringify({ targetTenantId })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error);
    token = data.token; tenant = data.tenant;
    localStorage.setItem('panel_token', token);
    localStorage.setItem('panel_tenant', JSON.stringify(tenant));
    view = 'dashboard'; render(); loadView();
  }catch(e){ alert(e.message); }
}

function panelMasaServisiActive(){
  if(!tenant) return false;
  const feats = tenant.features ? (typeof tenant.features==='string'?JSON.parse(tenant.features):tenant.features) : {};
  return feats.masa_servisi === true;
}

function panelMarketModuActive(){
  if(!tenant) return false;
  const feats = tenant.features ? (typeof tenant.features==='string'?JSON.parse(tenant.features):tenant.features) : {};
  return feats.market_modu === true;
}

// Süper admin panelinden "Bu İşletmenin Paneline Gir" ile açılan geçici oturum —

(function(){
  const params = new URLSearchParams(window.location.search);
  const impToken = params.get('impersonate_token');
  if(impToken){
    token = impToken;
    try{ tenant = JSON.parse(params.get('impersonate_tenant')); }catch(e){}
    localStorage.setItem('panel_token', token);
    localStorage.setItem('panel_tenant', JSON.stringify(tenant));
    window.history.replaceState({}, '', '/panel');
  }
})();

async function loadCiro(range){
  const el = document.getElementById('viewArea');
  const cur = tenant ? tenant.currency : '₺';
  const now = new Date();
  const defStart = range && range.start ? range.start : new Date(now.getTime()-7*24*3600*1000).toISOString().slice(0,10);
  const defEnd = range && range.end ? range.end : now.toISOString().slice(0,10);
  el.innerHTML = `
    <div class="card-panel">
      <div class="card-panel-head">
        <h3>Ciro Detayı</h3>
        <div class="filter-row">
          <input type="date" id="ciroStart" value="${defStart}">
          <span style="color:var(--muted); font-size:12px;">—</span>
          <input type="date" id="ciroEnd" value="${defEnd}">
          <button class="btn-filter" id="ciroFilterBtn">🔍 Filtrele</button>
          <button class="btn-export" id="ciroExportBtn">⬇ Excel'e Aktar</button>
        </div>
      </div>
      <div id="ciroTableWrap"><p class="empty">Yükleniyor…</p></div>
    </div>`;

  async function fetchAndRender(){
    const start = document.getElementById('ciroStart').value + 'T00:00:00';
    const end = document.getElementById('ciroEnd').value + 'T23:59:59';
    try{
      const data = await api(`/reports/breakdown?start=${start}&end=${end}`);
      const rows = data.byPay || [];
      const totalQty = rows.reduce((s,r)=>s+Number(r.qty),0);
      const totalAmt = rows.reduce((s,r)=>s+Number(r.amount),0);
      const wrap = document.getElementById('ciroTableWrap');
      if(rows.length===0){ wrap.innerHTML = '<p class="empty">Bu tarih aralığında satış bulunamadı.</p>'; return; }
      wrap.innerHTML = `
        <div style="overflow-x:auto;">
        <table class="ciro-table">
          <thead><tr><th>Ödeme Yöntemi</th><th>Sipariş Adedi</th><th>Tutar</th></tr></thead>
          <tbody>
            ${rows.map(r=>`<tr><td>${r.pay_label}</td><td>${r.qty}</td><td>${cur}${Number(r.amount).toFixed(2)}</td></tr>`).join('')}
            <tr class="total"><td>TOPLAM</td><td>${totalQty}</td><td>${cur}${totalAmt.toFixed(2)}</td></tr>
          </tbody>
        </table>
        </div>`;
      document.getElementById('ciroExportBtn').onclick = ()=>{
        const sheetData = rows.map(r=>({ 'Ödeme Yöntemi': r.pay_label, 'Sipariş Adedi': r.qty, 'Tutar': Number(r.amount).toFixed(2) }));
        sheetData.push({ 'Ödeme Yöntemi':'TOPLAM', 'Sipariş Adedi': totalQty, 'Tutar': totalAmt.toFixed(2) });
        const ws = XLSX.utils.json_to_sheet(sheetData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Ciro');
        XLSX.writeFile(wb, `DurakPOS-Ciro-${defStart}_${defEnd}.xlsx`);
      };
    }catch(e){ document.getElementById('ciroTableWrap').innerHTML = `<p class="empty">Veri alınamadı: ${e.message}</p>`; }
  }
  document.getElementById('ciroFilterBtn').onclick = fetchAndRender;
  fetchAndRender();
}

    function parseCsv(text){
      // Basit ama tırnaklı alanları (içinde virgül olan) da destekleyen CSV ayrıştırıcı
      const rows = [];
      let row = [], field = '', inQuotes = false;
      for(let i=0; i<text.length; i++){
        const ch = text[i];
        if(inQuotes){
          if(ch === '"'){ if(text[i+1]==='"'){ field+='"'; i++; } else { inQuotes=false; } }
          else field += ch;
        }else{
          if(ch === '"') inQuotes = true;
          else if(ch === ','){ row.push(field); field=''; }
          else if(ch === '\n' || ch === '\r'){
            if(ch==='\r' && text[i+1]==='\n') i++;
            row.push(field); field='';
            if(row.some(f=>f.trim()!=='')) rows.push(row);
            row = [];
          } else field += ch;
        }
      }
      if(field!=='' || row.length>0){ row.push(field); if(row.some(f=>f.trim()!=='')) rows.push(row); }
      return rows;
    }

    let parsedCsvRows = [];
    document.getElementById('csvFileInput').onchange = (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev)=>{
        const rows = parseCsv(ev.target.result);
        if(rows.length < 2){ document.getElementById('csvImportArea').innerHTML = '<p style="color:var(--danger); font-size:12.5px;">Dosyada veri satırı bulunamadı.</p>'; return; }
        const header = rows[0].map(h=>h.trim().toLowerCase());
        const idx = (name)=>header.indexOf(name);
        const iGroup = idx('grup'), iCat = idx('kategori'), iName = idx('urun adi'), iPrice = idx('fiyat'),
              iBarcode = idx('barkod'), iSaleType = idx('satis tipi'), iStock = idx('stok'), iLowStock = idx('dusuk stok esigi');
        if(iGroup<0 || iCat<0 || iName<0 || iPrice<0){
          document.getElementById('csvImportArea').innerHTML = '<p style="color:var(--danger); font-size:12.5px;">Başlık satırında "Grup", "Kategori", "Urun Adi", "Fiyat" sütunları bulunamadı — şablonu indirip o formatı kullanın.</p>';
          return;
        }
        parsedCsvRows = rows.slice(1).map(r => ({
          group_name: (r[iGroup]||'').trim(), category_name: (r[iCat]||'').trim(), name: (r[iName]||'').trim(),
          price: parseFloat(r[iPrice]), barcode: iBarcode>=0 ? (r[iBarcode]||'').trim() : '',
          sale_type: iSaleType>=0 ? (r[iSaleType]||'').trim().toLowerCase() : 'adet',
          stock_qty: iStock>=0 && r[iStock] ? parseFloat(r[iStock]) : null,
          low_stock_threshold: iLowStock>=0 && r[iLowStock] ? parseFloat(r[iLowStock]) : null,
        })).filter(r => r.name);
        document.getElementById('csvImportArea').innerHTML = `

            <p style="font-size:13px; font-weight:700; margin-bottom:8px;">${parsedCsvRows.length} ürün okundu — önizleme (ilk 5):</p>
            <div style="font-size:11.5px; color:var(--muted); max-height:140px; overflow-y:auto;">
              ${parsedCsvRows.slice(0,5).map(r=>`<div>${r.group_name} / ${r.category_name} — ${r.name} — ${r.price}₺${r.barcode?' — '+r.barcode:''}${r.sale_type==='kg'?' (kg)':''}</div>`).join('')}
            </div>
            <button class="ai-btn primary" id="confirmCsvImportBtn" style="margin-top:12px;">${parsedCsvRows.length} Ürünü İçe Aktar</button>
          </div>`;
        document.getElementById('confirmCsvImportBtn').onclick = async ()=>{
          const btn = document.getElementById('confirmCsvImportBtn');
          btn.disabled = true; btn.textContent = 'İçe aktarılıyor… (büyük listelerde biraz sürebilir)';
          try{
            const res = await api('/menu/products/bulk-import', {method:'POST', body:JSON.stringify({rows: parsedCsvRows})});
            document.getElementById('csvImportArea').innerHTML = `
              <div style="background:#E7F5EA; border-radius:10px; padding:14px; margin-top:6px;">
                <p style="font-weight:700; color:#2E7D46;">✓ ${res.added} ürün başarıyla eklendi.</p>
                ${res.errorCount>0 ? `<p style="color:var(--danger); font-size:12px; margin-top:6px;">${res.errorCount} satırda hata oluştu:</p><div style="font-size:11px; color:var(--danger); max-height:100px; overflow-y:auto;">${res.errors.map(e=>`<div>${e}</div>`).join('')}</div>` : ''}
              </div>`;
            loadMenu();
          }catch(e){ alert(e.message); btn.disabled=false; btn.textContent = parsedCsvRows.length+' Ürünü İçe Aktar'; }
        };
      };
      reader.readAsText(file, 'UTF-8');

              const scale = Math.min(1, maxW/img.width);
              const canvas = document.createElement('canvas');
              canvas.width = img.width*scale; canvas.height = img.height*scale;
              canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
              pendingProdImage = canvas.toDataURL('image/jpeg', 0.8);
              paintProd();

      loadMenu();
    });
    document.querySelectorAll('[data-showinactive]').forEach(b=>b.onclick=(e)=>{
      e.stopPropagation();
      const catId = Number(b.dataset.showinactive);
      if(expandedInactiveCats.has(catId)) expandedInactiveCats.delete(catId); else expandedInactiveCats.add(catId);
      loadMenu();
    });
    // Sürükle-bırakla sıralama — aynı kategori içinde
    let dragProdId = null;
    document.querySelectorAll('[data-dragprod]').forEach(row=>{
      row.ondragstart = (e)=>{ dragProdId = Number(row.dataset.dragprod); e.dataTransfer.effectAllowed='move'; row.style.opacity='0.4'; };
      row.ondragend = ()=>{ row.style.opacity='1'; };
      row.ondragover = (e)=>{ e.preventDefault(); };
      row.ondrop = async (e)=>{
        e.preventDefault();
        const targetId = Number(row.dataset.dragprod);
        const catId = Number(row.dataset.dragcat);
        if(!dragProdId || dragProdId===targetId) return;
        const catProds = prods.filter(p=>p.category_id===catId && p.active!==0);
        const fromIdx = catProds.findIndex(p=>p.id===dragProdId);
        const toIdx = catProds.findIndex(p=>p.id===targetId);
        if(fromIdx<0 || toIdx<0) return;
        const reordered = [...catProds];
        const [moved] = reordered.splice(fromIdx,1);
        reordered.splice(toIdx,0,moved);
        const order = reordered.map((p,i)=>({id:p.id, sort_order:i}));
        try{ await api('/menu/products/reorder', {method:'PATCH', body:JSON.stringify({order})}); loadMenu(); }
        catch(err){ alert('Sıralama kaydedilemedi: '+err.message); }
      };
    });
    prodPhotoInput.onchange = ()=>{
      const file = prodPhotoInput.files[0];
      const productId = prodPhotoInput.dataset.targetProd;
      if(!file || !productId) return;
      const reader = new FileReader();
      reader.onload = (ev)=>{
        const img = new Image();
        img.onload = async ()=>{
          const maxW = 480;
          const scale = Math.min(1, maxW/img.width);
          const canvas = document.createElement('canvas');
          canvas.width = img.width*scale; canvas.height = img.height*scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
          try{ await api('/menu/products/'+productId, {method:'PATCH', body:JSON.stringify({image_url:dataUrl})}); loadMenu(); }
          catch(e){ alert(e.message); }
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    };
    document.querySelectorAll('[data-delcat]').forEach(b=>b.onclick=async(e)=>{ e.stopPropagation(); await api('/menu/categories/'+b.dataset.delcat, {method:'DELETE'}); loadMenu(); });
    document.querySelectorAll('[data-delprod]').forEach(b=>b.onclick=async(e)=>{ e.stopPropagation(); await api('/menu/products/'+b.dataset.delprod, {method:'DELETE'}); loadMenu(); });
    document.querySelectorAll('.ren-cat').forEach(b=>b.onclick=async(e)=>{
      e.stopPropagation();
      if(!panelMasaServisiActive()){
        const newName = prompt('Yeni alt kategori adı:', b.dataset.name); if(!newName) return;
        try{ await api('/menu/categories/'+b.dataset.catid, {method:'PATCH', body:JSON.stringify({name:newName})}); loadMenu(); }
        catch(err){ alert(err.message); }
        return;
      }
      const cat = cats.find(c=>c.id==b.dataset.catid);
      const wrap = document.getElementById('mmModalWrap') || (()=>{ const d=document.createElement('div'); d.id='mmModalWrap'; document.body.appendChild(d); return d; })();
      wrap.innerHTML = `
        <div class="mm-overlay" id="catEditOverlay">
          <div class="mm-modal">
            <h3>Alt Kategoriyi Düzenle</h3>
            <label>Kategori Adı</label>
            <input type="text" id="catEditName" value="${cat.name}">
            <label>Yazdırma İstasyonu <span style="font-weight:400; color:var(--muted); text-transform:none;">(bu kategorideki ürünler siparişe girince hangi yazıcıya düşsün)</span></label>
            <select id="catEditStation">
              <option value="" ${!cat.print_station?'selected':''}>Belirtilmedi (fiş kesilmez)</option>
              <option value="mutfak" ${cat.print_station==='mutfak'?'selected':''}>Mutfak</option>
              <option value="bar" ${cat.print_station==='bar'?'selected':''}>Bar</option>
            </select>
            <div class="mm-err" id="catEditErr"></div>
            <button class="mm-save" id="catEditSaveBtn">Kaydet</button>
            <button class="mm-cancel" id="catEditCancelBtn">Vazgeç</button>
          </div>
        </div>`;
      document.getElementById('catEditCancelBtn').onclick = ()=>{ wrap.innerHTML=''; };
      document.getElementById('catEditOverlay').onclick = (ev)=>{ if(ev.target.id==='catEditOverlay') wrap.innerHTML=''; };
      document.getElementById('catEditSaveBtn').onclick = async ()=>{
        const name = document.getElementById('catEditName').value.trim();
        const print_station = document.getElementById('catEditStation').value;
        const err = document.getElementById('catEditErr');
        if(!name){ err.textContent='Kategori adı zorunlu.'; return; }
        try{
          await api('/menu/categories/'+b.dataset.catid, {method:'PATCH', body:JSON.stringify({name, print_station})});
          wrap.innerHTML=''; loadMenu();
        }catch(e){ err.textContent = e.message; }
      };
    });
    document.querySelectorAll('.ren-grp').forEach(b=>b.onclick=async(e)=>{
      e.stopPropagation();
      const oldGroup = b.dataset.grp;
      const newGroup = prompt('Yeni üst kategori adı:', oldGroup); if(!newGroup || newGroup===oldGroup) return;
      try{
        const toUpdate = cats.filter(c=>c.group_name===oldGroup);
        for(const c of toUpdate){ await api('/menu/categories/'+c.id, {method:'PATCH', body:JSON.stringify({group_name:newGroup})}); }
        loadMenu();
      }catch(err){ alert(err.message); }
    });
    const searchInput = document.getElementById('treeSearch');
    if(searchInput) searchInput.oninput = ()=>{
      const q = searchInput.value.trim().toLowerCase();
      document.querySelectorAll('.tree-group').forEach(g=>{
        const text = g.textContent.toLowerCase();
        g.style.display = text.includes(q) ? '' : 'none';
      });
    };
    document.querySelectorAll('[data-filtergroup]').forEach(row=>row.onclick=(e)=>{
      if(e.target.closest('.tree-actions')) return;
      const g = row.dataset.filtergroup;
      menuProductFilter = (menuProductFilter && menuProductFilter.type==='group' && menuProductFilter.value===g) ? null : {type:'group', value:g};
      loadMenu();
    });
    document.querySelectorAll('[data-expandcat]').forEach(row=>row.onclick=(e)=>{
      if(e.target.closest('.tree-actions')) return;
      const id = Number(row.dataset.expandcat);
      expandedCatId = (expandedCatId===id) ? null : id;
      loadMenu();
    });
    document.querySelectorAll('[data-addprodto]').forEach(b=>b.onclick=(e)=>{
      e.stopPropagation();
      const cat = cats.find(c=>c.id===Number(b.dataset.addprodto));
      openProductModal(null, cat);
    });
    const clearFilterBtn = document.getElementById('clearFilterBtn');
    if(clearFilterBtn) clearFilterBtn.onclick = ()=>{ menuProductFilter=null; loadMenu(); };
  }catch(e){ el.innerHTML = `<p class="empty">Veri alınamadı: ${e.message}</p>`; }
}

async function loadOptions(){
  const el = document.getElementById('viewArea');
  try{
    const groups = await api('/menu/option-groups');
    el.innerHTML = `
      <div class="section-head" style="margin-bottom:16px;"><h3>Opsiyonel Özellikler</h3><button class="add-btn" id="addOptGroupBtn">+ Yeni Özellik Oluştur</button></div>

      ${groups.map(g=>`
        <div class="role-card">
          <div class="role-card-head">
            <h4>${g.name} ${g.required ? '<span style="font-size:11px; background:#FCEFDD; color:#B5651D; padding:3px 10px; border-radius:999px; font-weight:700; margin-left:8px;">Zorunlu</span>' : ''}</h4>
            <div class="actions">
              <button data-editoptgrp="${g.id}">✏️</button>
              <button data-deloptgrp="${g.id}" style="color:var(--danger);">🗑</button>
            </div>
          </div>
          <div style="display:flex; flex-wrap:wrap; gap:8px;">
            ${g.choices.map(c=>`<span style="background:var(--surface2); padding:6px 12px; border-radius:999px; font-size:12px; font-weight:600;">${c}</span>`).join('')}
          </div>
        </div>`).join('') || '<p class="empty">Henüz özellik tanımlanmadı.</p>'}
      <div id="optGroupModalWrap"></div>`;

    function openOptGroupModal(existing){
      const wrap = document.getElementById('optGroupModalWrap');
      wrap.innerHTML = `
        <div class="mm-overlay" id="optGrpOverlay">
          <div class="mm-modal">
            <h3>${existing ? 'Özelliği Düzenle' : 'Yeni Özellik Oluştur'}</h3>
            <label>Başlık</label>
            <input type="text" id="optGrpName" value="${existing ? existing.name : ''}" placeholder="Örn: Şeker Oranı">
            <label>Seçenekler (her satıra bir tane)</label>
            <textarea id="optGrpChoices" rows="5" style="width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:11px 14px; font-size:14px; font-family:inherit;" placeholder="Sade&#10;Az Şekerli&#10;Orta Şekerli&#10;Çok Şekerli">${existing ? existing.choices.join('\\n') : ''}</textarea>
            <label style="display:flex; align-items:center; gap:8px; margin-top:14px; cursor:pointer;">
              <input type="checkbox" id="optGrpRequired" ${existing && existing.required ? 'checked' : ''} style="width:16px; height:16px;">
              Bu seçim zorunlu olsun (seçilmeden ürün sepete eklenemez)
            </label>
            <div class="mm-err" id="optGrpErr"></div>
            <button class="mm-save" id="optGrpSaveBtn">Kaydet</button>
            <button class="mm-cancel" id="optGrpCancelBtn">Vazgeç</button>
          </div>
        </div>`;
      document.getElementById('optGrpCancelBtn').onclick = ()=>{ wrap.innerHTML=''; };
      document.getElementById('optGrpOverlay').onclick = (e)=>{ if(e.target.id==='optGrpOverlay') wrap.innerHTML=''; };
      document.getElementById('optGrpSaveBtn').onclick = async ()=>{
        const name = document.getElementById('optGrpName').value.trim();
        const choices = document.getElementById('optGrpChoices').value.split('\n').map(s=>s.trim()).filter(Boolean);
        const required = document.getElementById('optGrpRequired').checked;
        const err = document.getElementById('optGrpErr');
        if(!name || choices.length===0){ err.textContent='Başlık ve en az bir seçenek girin.'; return; }
        try{
          if(existing) await api('/menu/option-groups/'+existing.id, {method:'PATCH', body:JSON.stringify({name, choices, required})});
          else await api('/menu/option-groups', {method:'POST', body:JSON.stringify({name, choices, required})});
          wrap.innerHTML=''; loadOptions();
        }catch(e){ err.textContent = e.message; }
      };
    }

    document.getElementById('addOptGroupBtn').onclick = ()=>openOptGroupModal(null);
    document.querySelectorAll('[data-editoptgrp]').forEach(b=>b.onclick=()=>{
      const g = groups.find(x=>x.id==b.dataset.editoptgrp);
      openOptGroupModal(g);
    });
    document.querySelectorAll('[data-deloptgrp]').forEach(b=>b.onclick=async()=>{
      if(!confirm('Bu özelliği silmek istiyor musunuz? Bağlı olduğu ürünlerden de kaldırılır.')) return;
      try{ await api('/menu/option-groups/'+b.dataset.deloptgrp, {method:'DELETE'}); loadOptions(); }
      catch(e){ alert(e.message); }
    });
  }catch(e){ el.innerHTML = `<p class="empty">Veri alınamadı: ${e.message}</p>`; }
}

async function loadFloorplan(){

    let selectMode = false;
    let selectedIds = new Set();
    const zoneById = id => zones.find(z=>z.id===id);

    function renderCanvas(){
      const legend = zones.length ? `<div class="fp-legend">${zones.map(z=>`
          <div class="fp-legend-item"><span class="fp-legend-dot" style="background:${z.color};"></span>${z.name}<button data-delzone="${z.id}">✕</button></div>
        `).join('')}</div>` : '';

      el.innerHTML = `

          <span class="fp-hint" id="fpHint">${selectMode ? 'Bu bölüme dahil etmek istediğiniz masalara tıklayın, sonra Kaydet\'e basın.' : 'Masaları sürükleyip yerleştirin. Bir bölüm oluşturmak için "Bölüm Oluştur"a basın.'}</span>
        </div>
        ${legend}
        <div class="fp-canvas" id="fpCanvas">
          ${tables.map(t=>{
            const zone = t.zone_id ? zoneById(t.zone_id) : null;
            const isSel = selectedIds.has(t.id);
            const borderColor = isSel ? '#C97A2E' : (zone ? zone.color : 'var(--navy)');
            return `
            <div class="fp-table ${selectMode?'select-mode':''} ${isSel?'selected':''}" data-tableid="${t.id}" style="left:${t.x}px; top:${t.y}px;">
              <div class="top-chairs"><div class="chair"></div>${t.seats>=4?'<div class="chair"></div>':''}</div>
              <div class="mid-row">
                ${t.seats>=4?'<div class="side-chair left"></div>':''}
                <div class="top" style="border-color:${borderColor}; ${zone && !isSel ? 'background:'+zone.color+'18;' : ''}">
                  ${t.name}
                  <span class="check-badge">✓</span>
                  <button class="del-x" data-deltable="${t.id}">✕</button>
                </div>
                ${t.seats>=4?'<div class="side-chair right"></div>':''}
              </div>

            </div>`;
          }).join('')}
        </div>
        <div class="fp-select-bar ${selectMode?'show':''}">
          <div class="cnt">${selectedIds.size} masa seçildi</div>
          <div class="actions">
            <button class="cancel-btn" id="fpSelCancel">Vazgeç</button>
            <button class="save-btn" id="fpSelSave">Kaydet</button>
          </div>
        </div>
        <div id="fpModalWrap"></div>`;

      attachHandlers();
    }

    function attachHandlers(){
      const canvas = document.getElementById('fpCanvas');

      document.getElementById('fpAddTable').onclick = ()=>{
        const wrap = document.getElementById('fpModalWrap');
        wrap.innerHTML = `
          <div class="fp-modal-overlay" id="fpModalOverlay">
            <div class="fp-modal">
              <h3>Yeni Masa Ekle</h3>
              <label>Masa Adı</label>
              <input type="text" id="fpNewTableName" placeholder="Örn: Masa 5">
              <label>Kaç Kişilik?</label>
              <div class="fp-seat-row">
                <div class="fp-seat-opt" data-seats="2"><span class="n">🪑🪑</span>2 Kişilik</div>
                <div class="fp-seat-opt" data-seats="4"><span class="n">🪑🪑🪑🪑</span>4 Kişilik</div>
              </div>
              <button class="fp-modal-cancel" id="fpModalCancel">Vazgeç</button>
            </div>
          </div>`;
        document.getElementById('fpModalCancel').onclick = ()=>{ wrap.innerHTML=''; };
        document.getElementById('fpModalOverlay').onclick = (e)=>{ if(e.target.id==='fpModalOverlay') wrap.innerHTML=''; };
        document.querySelectorAll('.fp-seat-opt').forEach(opt=>{
          opt.onclick = async ()=>{
            const name = document.getElementById('fpNewTableName').value.trim() || ('Masa ' + (tables.length+1));
            const seats = Number(opt.dataset.seats);
            const ox = 30 + (tables.length % 6) * 90, oy = 30 + Math.floor(tables.length/6) * 90;
            try{ await api('/menu/tables', {method:'POST', body:JSON.stringify({name, x:ox, y:oy, seats})}); reload(); }
            catch(e){ alert(e.message); }
          };
        });
      };

      document.getElementById('fpZoneBtn').onclick = ()=>{
        selectMode = !selectMode;
        if(!selectMode) selectedIds.clear();
        renderCanvas();

      const selCancel = document.getElementById('fpSelCancel');
      if(selCancel) selCancel.onclick = ()=>{ selectMode=false; selectedIds.clear(); renderCanvas(); };
      const selSave = document.getElementById('fpSelSave');
      if(selSave) selSave.onclick = async ()=>{
        if(selectedIds.size===0){ alert('En az bir masa seçin.'); return; }
        const name = prompt('Bu bölüme ne ad vermek istersiniz? (örn: İç Salon, Orta, Dış Bahçe)');
        if(!name) return;
        const colors = ['#C97A2E','#5AAA96','#7896DC','#DCB45A','#B5342B','#9B6FC9'];
        const color = colors[zones.length % colors.length];
        try{
          const newZone = await api('/menu/zones', {method:'POST', body:JSON.stringify({ name, color })});
          for(const id of selectedIds){
            await api('/menu/tables/'+id, {method:'PATCH', body:JSON.stringify({zone_id:newZone.id})});
          }
          selectMode=false; selectedIds.clear();
          reload();
        }catch(err){ alert(err.message); }
      };

      document.querySelectorAll('[data-deltable]').forEach(b=>b.onclick=async(e)=>{
        e.stopPropagation();
        if(!confirm('Bu masayı silmek istiyor musunuz?')) return;
        try{ await api('/menu/tables/'+b.dataset.deltable, {method:'DELETE'}); reload(); }
        catch(err){ alert(err.message); }
      });
      document.querySelectorAll('[data-delzone]').forEach(b=>b.onclick=async(e)=>{
        e.stopPropagation();
        if(!confirm('Bu bölümü silmek istiyor musunuz? Masalar silinmez, sadece bölümden çıkar.')) return;
        await api('/menu/zones/'+b.dataset.delzone, {method:'DELETE'}); reload();
      });

      // ---- Masa tıklama: seçim modunda seç/bırak, değilse sürükle ----
      document.querySelectorAll('.fp-table').forEach(tEl=>{
        const tableId = Number(tEl.dataset.tableid);

        tEl.addEventListener('pointerdown', (e)=>{
          if(e.target.classList.contains('del-x')) return;

          if(selectMode){
            e.preventDefault();
            if(selectedIds.has(tableId)) selectedIds.delete(tableId); else selectedIds.add(tableId);
            renderCanvas();
            return;
          }

          e.preventDefault();
          const rect = canvas.getBoundingClientRect();
          const startLeft = parseInt(tEl.style.left);
          const startTop = parseInt(tEl.style.top);
          const startX = e.clientX, startY = e.clientY;
          let moved = false;
          tEl.setPointerCapture(e.pointerId);
          function onMove(ev){
            moved = true;
            let nx = startLeft + (ev.clientX - startX);
            let ny = startTop + (ev.clientY - startY);
            nx = Math.max(0, Math.min(nx, rect.width - 78));
            ny = Math.max(0, Math.min(ny, rect.height - 60));
            tEl.style.left = nx + 'px';
            tEl.style.top = ny + 'px';
          }
          async function onUp(){
            tEl.removeEventListener('pointermove', onMove);
            tEl.removeEventListener('pointerup', onUp);
            if(!moved) return;
            const finalX = parseInt(tEl.style.left), finalY = parseInt(tEl.style.top);
            try{ await api('/menu/tables/'+tableId, {method:'PATCH', body:JSON.stringify({x:finalX, y:finalY})}); }
            catch(err){ /* sessiz geç */ }
            reload();
          }
          tEl.addEventListener('pointermove', onMove);
          tEl.addEventListener('pointerup', onUp);
        });
      });
    }

    async function reload(){
      [tables, zones] = await Promise.all([api('/menu/tables'), api('/menu/zones')]);
      renderCanvas();
    }

    renderCanvas();
  }catch(e){ el.innerHTML = `<p class="empty">Veri alınamadı: ${e.message}</p>`; }
}

        catch(e){ err.textContent = e.message; }
      };

    document.querySelectorAll('.ing-price').forEach(inp=>{

    });

    document.querySelectorAll('.cost-prod-row').forEach(row=>{

        const productId = row.dataset.prodid;
        const productName = row.dataset.prodname;
        const recipe = await api('/menu/products/'+productId+'/recipe');
        let rows = recipe.length ? recipe.map(r=>({ingredient_id:r.ingredient_id, quantity:r.quantity})) : [{ingredient_id:'', quantity:''}];
        const wrap = document.getElementById('costModalWrap');

        function calcCost(){
          return rows.reduce((sum,r)=>{
            const ing = ingredients.find(i=>i.id==r.ingredient_id);
            return sum + (ing ? Number(ing.unit_price) * (parseFloat(r.quantity)||0) : 0);
          },0);
        }

        function paintRecipe(){
          wrap.innerHTML = `
            <div class="mm-overlay" id="recOverlay">
              <div class="mm-modal" style="width:440px;">
                <h3>${productName} — Reçete</h3>

                      </select>
                      <input type="number" step="0.0001" class="rec-qty" data-i="${i}" placeholder="Miktar" value="${r.quantity}">
                      <button type="button" class="sz-del" data-i="${i}">✕</button>
                    </div>`).join('')}
                </div>
                <span class="mm-toggle-new" id="addRecRow">+ Malzeme Satırı Ekle</span>
                <div class="cost-summary-box"><span>Toplam Maliyet</span><span>${cur}${calcCost().toFixed(2)}</span></div>
                <div class="mm-err" id="recErr"></div>
                <button class="mm-save" id="recSave">Kaydet</button>
                <button class="mm-cancel" id="recCancel">Vazgeç</button>
              </div>
            </div>`;
          document.querySelectorAll('.rec-ing').forEach(sel=>sel.onchange=()=>{ rows[sel.dataset.i].ingredient_id = sel.value; paintRecipe(); });
          document.querySelectorAll('.rec-qty').forEach(inp=>inp.oninput=()=>{ rows[inp.dataset.i].quantity = inp.value; document.querySelector('.cost-summary-box span:last-child').textContent = cur+calcCost().toFixed(2); });
          document.querySelectorAll('#recRows .sz-del').forEach(b=>b.onclick=()=>{
            rows.splice(Number(b.dataset.i),1);
            if(rows.length===0) rows.push({ingredient_id:'', quantity:''});
            paintRecipe();
          });
          document.getElementById('addRecRow').onclick = ()=>{ rows.push({ingredient_id:'', quantity:''}); paintRecipe(); };
          document.getElementById('recCancel').onclick = ()=>{ wrap.innerHTML=''; };
          document.getElementById('recOverlay').onclick = (e)=>{ if(e.target.id==='recOverlay') wrap.innerHTML=''; };
          document.getElementById('recSave').onclick = async ()=>{
            const items = rows.filter(r=>r.ingredient_id && r.quantity).map(r=>({ingredient_id:Number(r.ingredient_id), quantity:parseFloat(r.quantity)}));
            try{ await api('/menu/products/'+productId+'/recipe', {method:'PUT', body:JSON.stringify({items})}); wrap.innerHTML=''; loadCost(); }
            catch(e){ document.getElementById('recErr').textContent = e.message; }
          };
        }
        if(ingredients.length===0){ alert('Önce en az bir malzeme ekleyin.'); return; }
        paintRecipe();
      };
    });
  }catch(e){ el.innerHTML = `<p class="empty">Veri alınamadı: ${e.message}</p>`; }
}

function loadAiAsk(){
  const el = document.getElementById('viewArea');
  const suggestions = [
    'Bugün en çok satan ürün neydi?',
    'Bu ay ciro geçen aya göre nasıl?',
    'Deniz\'e bugün 30 TL ödedim, kaydet',
    'Tüm ürünlere +20₺ ile Ekstra Büyük boy ekle',
  ];

  function renderChat(){
    el.innerHTML = `
      <div class="chat-wrap">
        <div class="chat-header">
          <div class="chat-avatar">✨</div>
          <div style="flex:1;">
            <div class="chat-title">DurakPOS Asistan</div>
            <div class="chat-sub">ürün ekleyebilir, gider kaydedebilir, rapor sorgulayabilir</div>
          </div>
          <button id="gsheetSettingsBtn" title="Google E-Tablosu Bağla" style="background:none; font-size:19px;">⚙️</button>
        </div>
        <div class="chat-messages" id="chatMessages">
          ${aiChatHistory.length===0 ? '<div class="chat-empty">👋 Merhaba! Sadece soru cevaplamıyorum — "bu ürünü ekle", "şu gideri kaydet" gibi talimatları da uygulayabilirim. Bir fotoğraf gönderip ürün ekletebilirsin.</div>' : ''}
          ${aiChatHistory.map(m=>`
            <div class="chat-bubble ${m.role}${m.thinking?' thinking':''}">
              ${m.imagePreview ? `<img class="chat-img" src="${m.imagePreview}">` : ''}
              ${escapeHtml(m.content)}
              ${(m.actionsPerformed && m.actionsPerformed.length) ? m.actionsPerformed.map(a=>`<span class="action-tag">✓ ${actionLabel(a.tool)}</span>`).join('') : ''}
              ${!m.thinking ? `<span class="chat-time">${m.time||''}</span>` : ''}
            </div>`).join('')}
        </div>
        ${aiChatHistory.length===0 ? `<div class="chat-suggestions">${suggestions.map(s=>`<button class="chat-suggestion" data-sugg="${s}">${s}</button>`).join('')}</div>` : ''}
        ${pendingChatImage ? `<div class="chat-img-preview"><img src="${pendingChatImage.previewUrl}"><span style="font-size:12px; color:var(--muted); flex:1;">Fotoğraf eklendi</span><button id="removeImgBtn">Kaldır</button></div>` : ''}
        <div class="chat-input-row">
          <button class="chat-attach-btn" id="attachBtn" title="Fotoğraf ekle">📎</button>
          <input type="file" id="chatImgInput" accept="image/*" style="display:none;">
          <input type="text" id="chatInput" placeholder="Bir mesaj yazın…">
          <button class="chat-send-btn" id="chatSendBtn">➤</button>
        </div>
      </div>`;

    const messagesEl = document.getElementById('chatMessages');
    messagesEl.scrollTop = messagesEl.scrollHeight;

    document.querySelectorAll('[data-sugg]').forEach(b=>b.onclick=()=>sendChat(b.dataset.sugg));
    document.getElementById('chatSendBtn').onclick = ()=>{
      const input = document.getElementById('chatInput');
      if(input.value.trim() || pendingChatImage) sendChat(input.value.trim());
    };
    document.getElementById('chatInput').onkeydown = (e)=>{
      if(e.key==='Enter'){ const v=e.target.value.trim(); if(v || pendingChatImage) sendChat(v); }
    };
    document.getElementById('attachBtn').onclick = ()=>document.getElementById('chatImgInput').click();
    document.getElementById('gsheetSettingsBtn').onclick = openGoogleSheetModal;
    document.getElementById('chatImgInput').onchange = (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev)=>{
        const dataUrl = ev.target.result;
        const base64 = dataUrl.split(',')[1];
        pendingChatImage = { mediaType: file.type, base64, previewUrl: dataUrl };
        renderChat();
      };
      reader.readAsDataURL(file);
    };
    const removeImgBtn = document.getElementById('removeImgBtn');
    if(removeImgBtn) removeImgBtn.onclick = ()=>{ pendingChatImage=null; renderChat(); };
  }

  function actionLabel(tool){
    const labels = {
      add_product: 'Ürün eklendi', update_product: 'Ürün güncellendi', delete_product: 'Ürün silindi',
      add_category: 'Kategori eklendi', rename_category: 'Kategori yeniden adlandırıldı', delete_category: 'Kategori silindi',
      list_menu: 'Menü incelendi', log_expense: 'Gider kaydedildi', add_size_to_all_products: 'Boy eklendi',
      get_report_summary: 'Rapor sorgulandı', add_staff: 'Personel eklendi', set_staff_panel_login: 'Panel girişi tanımlandı',
      list_staff: 'Personel listelendi', list_ingredients: 'Malzemeler incelendi', set_product_recipe: 'Reçete kaydedildi', generate_product_image: 'Görsel üretildi'
    };
    return labels[tool] || tool;
  }

  async function sendChat(text){
    const nowTime = new Date().toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'});
    const imageForMsg = pendingChatImage;
    aiChatHistory.push({role:'user', content:text || '(fotoğraf gönderildi)', time:nowTime, imagePreview: imageForMsg?.previewUrl});
    aiChatHistory.push({role:'assistant', content:'yazıyor…', thinking:true});
    pendingChatImage = null;
    renderChat();

    try{
      const historyForApi = aiChatHistory.filter(m=>!m.thinking).map(m=>({role:m.role, content:m.content}));
      const body = { messages: historyForApi };
      if(imageForMsg) body.image = { mediaType: imageForMsg.mediaType, base64: imageForMsg.base64 };
      const res = await api('/reports/ai-agent', {method:'POST', body:JSON.stringify(body)});
      aiChatHistory = aiChatHistory.filter(m=>!m.thinking);
      aiChatHistory.push({role:'assistant', content:res.reply, time:new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}), actionsPerformed: res.actionsPerformed});
    }catch(e){
      aiChatHistory = aiChatHistory.filter(m=>!m.thinking);
      aiChatHistory.push({role:'assistant', content:'⚠ '+e.message, time:nowTime});
    }
    renderChat();
  }

  renderChat();
}

            <button data-delslide="${s.id}" style="width:32px;height:32px;border-radius:8px;background:var(--surface2);color:var(--danger);">✕</button>
          </div>`).join('') || '<p class="empty">Henüz slayt eklenmedi.</p>'}
      </div>`;

    document.getElementById('copyDisplayLink').onclick = ()=>{
      navigator.clipboard.writeText(displayUrl);
      const b = document.getElementById('copyDisplayLink');
      b.textContent = 'Kopyalandı ✓'; setTimeout(()=>b.textContent='Bağlantıyı Kopyala', 1800);
    };

    const uploadBox = document.getElementById('slideUploadBox');
    const fileInput = document.getElementById('slideFileInput');
    uploadBox.onclick = ()=>fileInput.click();
    fileInput.onchange = ()=>{
      const file = fileInput.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev)=>{
        const img = new Image();
        img.onload = async ()=>{
          const maxW = 1280;
          const scale = Math.min(1, maxW/img.width);
          const canvas = document.createElement('canvas');
          canvas.width = img.width*scale; canvas.height = img.height*scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
          try{ await api('/menu/slides', {method:'POST', body:JSON.stringify({image_url:dataUrl, seconds:5})}); loadSlider(); }
          catch(e){ alert(e.message); }
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    };

    document.querySelectorAll('.sec-input').forEach(inp=>{
      inp.onchange = async ()=>{
        try{ await api('/menu/slides/'+inp.dataset.secid, {method:'PATCH', body:JSON.stringify({seconds: parseInt(inp.value)||5})}); }
        catch(e){ alert(e.message); }
      };
    });
    document.querySelectorAll('[data-delslide]').forEach(b=>b.onclick=async()=>{
      if(!confirm('Bu slaytı silmek istiyor musunuz?')) return;
      await api('/menu/slides/'+b.dataset.delslide, {method:'DELETE'}); loadSlider();
    });
    document.querySelectorAll('[data-up]').forEach(b=>b.onclick=async()=>{
      const idx = slides.findIndex(s=>s.id==b.dataset.up);
      if(idx<=0) return;
      const a = slides[idx], c = slides[idx-1];
      await api('/menu/slides/'+a.id, {method:'PATCH', body:JSON.stringify({sort_order: idx-1})});
      await api('/menu/slides/'+c.id, {method:'PATCH', body:JSON.stringify({sort_order: idx})});
      loadSlider();
    });
    document.querySelectorAll('[data-down]').forEach(b=>b.onclick=async()=>{
      const idx = slides.findIndex(s=>s.id==b.dataset.down);
      if(idx>=slides.length-1) return;
      const a = slides[idx], c = slides[idx+1];
      await api('/menu/slides/'+a.id, {method:'PATCH', body:JSON.stringify({sort_order: idx+1})});
      await api('/menu/slides/'+c.id, {method:'PATCH', body:JSON.stringify({sort_order: idx})});
      loadSlider();
    });
  }catch(e){ el.innerHTML = `<p class="empty">Veri alınamadı: ${e.message}</p>`; }
}

async function loadBilling(){
  const el = document.getElementById('viewArea');
  try{
    const [invoices, paymentStatus, billingInfo, cardStatus] = await Promise.all([api('/billing'), api('/billing/payment-status'), api('/menu/billing-info'), api('/billing/card-status')]);
    const unpaidCount = invoices.filter(i=>!i.paid).length;
    const unpaidTotal = invoices.filter(i=>!i.paid).reduce((s,i)=>s+Number(i.amount),0);
    const paidTotal = invoices.filter(i=>i.paid).reduce((s,i)=>s+Number(i.amount),0);
    const billingComplete = !!(billingInfo.billing_tckn && billingInfo.billing_address && billingInfo.billing_city);
    const c = tenant?tenant.currency:'₺';

    el.innerHTML = `
      <div class="section-head" style="margin-bottom:20px;"><h3>Faturalarım</h3></div>

      <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:26px; max-width:900px;">
        <div class="billing-stat-card">
          <div class="billing-stat-icon" style="background:#FCEAEA; color:var(--danger);">⏳</div>
          <div><div class="billing-stat-label">Ödenmemiş</div><div class="billing-stat-val" style="color:var(--danger);">${c}${unpaidTotal.toFixed(2)}</div></div>
        </div>
        <div class="billing-stat-card">
          <div class="billing-stat-icon" style="background:#E7F5EA; color:#2E7D46;">✓</div>
          <div><div class="billing-stat-label">Ödenen (Toplam)</div><div class="billing-stat-val" style="color:#2E7D46;">${c}${paidTotal.toFixed(2)}</div></div>
        </div>
        <div class="billing-stat-card">
          <div class="billing-stat-icon" style="background:#FDF1E4; color:var(--accent);">📄</div>
          <div><div class="billing-stat-label">Toplam Fatura</div><div class="billing-stat-val">${invoices.length}</div></div>
        </div>
      </div>

      ${unpaidCount>0 ? `<div class="billing-alert">⚠ <b>${unpaidCount} ödenmemiş faturanız var.</b> ${paymentStatus.configured ? 'Aşağıdan hemen online ödeyebilirsiniz.' : 'Ödemeleriniz için DurakPOS temsilcinizle iletişime geçin.'}</div>` : ''}

      ${paymentStatus.configured ? `
      <div class="card-panel" style="max-width:640px; margin-bottom:24px;">
        <h4 style="font-size:14.5px; margin-bottom:6px; display:flex; align-items:center; gap:8px;">💳 Fatura Bilgileri ${billingComplete?'<span style="font-size:11px; background:#E7F5EA; color:#2E7D46; padding:3px 10px; border-radius:999px; font-weight:700;">Tamamlandı</span>':'<span style="font-size:11px; background:#FCEFDD; color:#B5651D; padding:3px 10px; border-radius:999px; font-weight:700;">Eksik</span>'}</h4>
        <p style="font-size:12.5px; color:var(--muted); margin-bottom:16px;">Online ödeme yapabilmek için bu bilgilerin dolu olması gerekiyor.</p>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
          <div><label style="font-size:11px; color:var(--muted); display:block; margin-bottom:5px; font-weight:700;">TCKN</label><input type="text" id="billTckn" maxlength="11" value="${billingInfo.billing_tckn||''}" placeholder="11111111111"></div>
          <div><label style="font-size:11px; color:var(--muted); display:block; margin-bottom:5px; font-weight:700;">Şehir</label><input type="text" id="billCity" value="${billingInfo.billing_city||''}" placeholder="Örn: İstanbul"></div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px;">
          <div><label style="font-size:11px; color:var(--muted); display:block; margin-bottom:5px; font-weight:700;">Fatura Adresi</label><input type="text" id="billAddress" value="${billingInfo.billing_address||''}" placeholder="Örn: Bağdat Cad. No:12, Kadıköy"></div>
          <div><label style="font-size:11px; color:var(--muted); display:block; margin-bottom:5px; font-weight:700;">Telefon (SMS bildirimleri için)</label><input type="text" id="billPhone" value="${billingInfo.billing_phone||''}" placeholder="Örn: 0532 123 45 67"></div>
        </div>
        <div style="margin-top:16px; display:flex; align-items:center; gap:12px;">
          <button class="btn-filter" id="saveBillingInfoBtn" style="background:var(--navy); color:#fff;">Kaydet</button>
          <span id="billingInfoStatus" style="font-size:12px; font-weight:700;"></span>
        </div>
      </div>

      <div class="card-panel" style="max-width:640px; margin-bottom:24px;">
        <h4 style="font-size:14.5px; margin-bottom:6px;">💳 Kayıtlı Kart</h4>
        ${cardStatus.hasCard ? `
          <p style="font-size:13.5px; margin-bottom:14px;">•••• •••• •••• ${cardStatus.lastFour} <span style="color:var(--muted); font-size:12px;">— ödeme günü geldiğinde otomatik çekim yapılır</span></p>
          <button id="removeCardBtn" style="color:var(--danger); font-size:12.5px; font-weight:700;">Kayıtlı Kartı Kaldır</button>
        ` : `<p style="font-size:12.5px; color:var(--muted);">Henüz kayıtlı bir kartınız yok — bir faturayı öderken açılan ödeme formunda "Bu kartı sakla" seçeneğini işaretlerseniz, sonraki ödemeleriniz otomatik çekilir.</p>`}
      </div>` : ''}

      <div class="billing-invoice-list">
        ${invoices.map(i=>`
          <div class="billing-invoice-card ${i.paid?'':'unpaid'}">

              <div class="billing-inv-icon">${i.paid?'✓':'📄'}</div>
              <div>
                <div class="billing-inv-num">${i.invoice_number}</div>
                <div class="billing-inv-date">Son ödeme: ${new Date(i.due_date).toLocaleDateString('tr-TR', {day:'numeric', month:'long', year:'numeric'})}</div>
              </div>
            </div>
            <div class="billing-inv-right">
              <div class="billing-inv-amount">${c}${Number(i.amount).toFixed(2)}</div>
              <span class="billing-inv-badge ${i.paid?'paid':'unpaid'}">${i.paid?'Ödendi':'Ödenmedi'}</span>
              ${!i.paid && paymentStatus.configured ? `<button data-payinvoice="${i.id}" data-amount="${i.amount}" ${!billingComplete?'disabled title="Önce fatura bilgilerinizi tamamlayın"':''} class="billing-pay-btn" ${!billingComplete?'style="opacity:0.4;"':''}>Öde</button>` : ''}
            </div>
          </div>`).join('') || '<p class="empty">Henüz faturanız yok.</p>'}
      </div>
      ${!paymentStatus.configured ? '<p class="empty" style="margin-top:20px; max-width:600px;">Online kart ile ödeme yakında bu sayfadan yapılabilecek — o zamana kadar ödemeleriniz için işletmenizle görüşen DurakPOS temsilcinizle iletişime geçebilirsiniz.</p>' : ''}
      <div id="checkoutModalWrap"></div>`;

    const saveBillingBtn = document.getElementById('saveBillingInfoBtn');
    if(saveBillingBtn) saveBillingBtn.onclick = async ()=>{
      const status = document.getElementById('billingInfoStatus');
      const tckn = document.getElementById('billTckn').value.trim();
      if(tckn && !/^\d{11}$/.test(tckn)){ status.style.color='var(--danger)'; status.textContent='TCKN 11 haneli olmalı'; return; }
      try{
        await api('/menu/billing-info', {method:'PATCH', body:JSON.stringify({
          billing_tckn: tckn, billing_address: document.getElementById('billAddress').value.trim(), billing_city: document.getElementById('billCity').value.trim(), billing_phone: document.getElementById('billPhone').value.trim()
        })});
        status.style.color = '#2E7D46'; status.textContent = '✓ Kaydedildi';
        loadBilling();
      }catch(e){ status.style.color='var(--danger)'; status.textContent = 'Hata: '+e.message; }
    };
    document.querySelectorAll('[data-payinvoice]').forEach(b=>b.onclick=async()=>{
      b.disabled = true; b.textContent = 'Yükleniyor…';
      try{
        const res = await api(`/billing/${b.dataset.payinvoice}/checkout`, {method:'POST'});
        const wrap = document.getElementById('checkoutModalWrap');
        wrap.innerHTML = `<div class="overlay" id="ovCheckout" style="z-index:900;"><div class="sheet" style="max-width:460px; padding:0; overflow:hidden;">
          <div style="display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--border);">
            <b style="font-size:14px;">Ödeme</b><button id="closeCheckout" style="font-size:20px;">✕</button>
          </div>
          <div id="iyzicoFormHolder" style="padding:10px;"></div>
        </div></div>`;
        document.getElementById('iyzicoFormHolder').innerHTML = res.checkoutFormContent;
        // iyzico'nun döndürdüğü içerik kendi <script> etiketini taşıyor —
        // innerHTML ile eklenen script'ler tarayıcıda OTOMATİK çalışmaz,
        // bu yüzden elle yeniden oluşturup enjekte ediyoruz.
        document.querySelectorAll('#iyzicoFormHolder script').forEach(oldScript=>{
          const s = document.createElement('script');
          s.text = oldScript.text; oldScript.replaceWith(s);
        });
        document.getElementById('closeCheckout').onclick = ()=>{ wrap.innerHTML=''; loadBilling(); };
      }catch(e){ alert('Ödeme başlatılamadı: '+e.message); }
      b.disabled = false; b.textContent = 'Öde';
    });
    const removeCardBtn = document.getElementById('removeCardBtn');
    if(removeCardBtn) removeCardBtn.onclick = async ()=>{
      if(!confirm('Kayıtlı kartınızı kaldırmak istiyor musunuz? Bir sonraki ödeme günü otomatik çekim yapılmayacak.')) return;
      await api('/billing/card', {method:'DELETE'});
      loadBilling();
    };
  }catch(e){ el.innerHTML = `<p class="empty">Veri alınamadı: ${e.message}</p>`; }
}

async function loadStaff(){
  const el = document.getElementById('viewArea');
  try{
    const [staff, roles] = await Promise.all([api('/staff-mgmt/staff'), api('/staff-mgmt/roles')]);
    el.innerHTML = `
      <div class="section-head" style="margin-bottom:16px;"><h3>Personel</h3><button class="add-btn" id="addStaffBtn">+ Personel Ekle</button></div>
      ${staff.map(s=>`
        <div class="staff-row">
          <div class="avatar">${s.name.charAt(0).toUpperCase()}</div>
          <div class="info">
            <div class="nm">${s.name}</div>
            <div class="role-tag ${s.role==='owner'?'owner':''}">${s.role==='owner' ? 'İşletme Sahibi (tam yetkili)' : (s.role_name || 'Rol atanmadı — hiçbir özel yetkisi yok')}</div>
            ${s.email ? `<div style="font-size:11.5px; color:var(--muted); margin-top:2px;">🔑 Panel girişi: ${s.email}</div>` : ''}
          </div>
          <button data-panellogin="${s.id}" data-staffname="${s.name}" data-hasemail="${s.email||''}" title="Panel/Patron Girişi" style="font-size:12px;">${s.email ? '🔑 Girişi Düzenle' : '🔑 Panel Girişi Ver'}</button>
          ${s.role!=='owner' ? `
            <button data-editstaff="${s.id}" title="Düzenle">✏️</button>
            <button data-delstaff="${s.id}" title="Sil" style="color:var(--danger);">🗑</button>
          ` : ''}
        </div>`).join('') || '<p class="empty">Henüz personel yok.</p>'}
      <div id="staffModalWrap"></div>
      <div id="panelLoginModalWrap"></div>`;

    function openStaffModal(existing){
      const wrap = document.getElementById('staffModalWrap');
      wrap.innerHTML = `
        <div class="mm-overlay" id="staffOverlay">
          <div class="mm-modal">
            <h3>${existing ? 'Personeli Düzenle' : 'Yeni Personel Ekle'}</h3>
            <label>Ad Soyad</label>
            <input type="text" id="stName" value="${existing ? existing.name : ''}" placeholder="Örn: Ahmet Yılmaz">
            <label>Kasa PIN (4 haneli)${existing ? ' — değiştirmek istemiyorsan boş bırak' : ''}</label>
            <input type="text" id="stPin" maxlength="4" placeholder="1234">
            <label>Rol</label>
            <select id="stRole">
              <option value="">Rol atanmadı (yetkisiz)</option>
              ${roles.map(r=>`<option value="${r.id}" ${existing && existing.role_id===r.id ? 'selected' : ''}>${r.name}</option>`).join('')}
            </select>
            <div class="mm-err" id="stErr"></div>
            <button class="mm-save" id="stSaveBtn">Kaydet</button>
            <button class="mm-cancel" id="stCancelBtn">Vazgeç</button>
          </div>
        </div>`;
      document.getElementById('stCancelBtn').onclick = ()=>{ wrap.innerHTML=''; };
      document.getElementById('staffOverlay').onclick = (e)=>{ if(e.target.id==='staffOverlay') wrap.innerHTML=''; };
      document.getElementById('stSaveBtn').onclick = async ()=>{
        const name = document.getElementById('stName').value.trim();
        const pin = document.getElementById('stPin').value.trim();
        const role_id = document.getElementById('stRole').value || null;
        const err = document.getElementById('stErr');
        if(!name){ err.textContent='İsim zorunlu.'; return; }
        if(!existing && (pin.length!==4)){ err.textContent='4 haneli PIN zorunlu.'; return; }
        if(pin && pin.length!==4){ err.textContent='PIN 4 haneli olmalı.'; return; }
        try{
          if(existing) await api('/staff-mgmt/staff/'+existing.id, {method:'PATCH', body:JSON.stringify({name, pin: pin||undefined, role_id})});
          else await api('/staff-mgmt/staff', {method:'POST', body:JSON.stringify({name, pin, role_id})});
          wrap.innerHTML=''; loadStaff();
        }catch(e){ err.textContent = e.message; }
      };
    }

    function openPanelLoginModal(staffId, staffName, existingEmail){
      const wrap = document.getElementById('panelLoginModalWrap');
      wrap.innerHTML = `
        <div class="mm-overlay" id="plOverlay">
          <div class="mm-modal">
            <h3>${staffName} — Panel/Patron Girişi</h3>
            <p style="font-size:12.5px; color:var(--muted); margin-bottom:14px;">Bu bilgilerle ${staffName}, panele veya Patron uygulamasına giriş yapabilir. Birden fazla şubede AYNI e-posta/şifreyle giriş bilgisi tanımlarsanız, giriş yaptığında şubeler arasında geçiş yapabilir.</p>
            <label>E-posta</label>
            <input type="email" id="plEmail" value="${existingEmail||''}" placeholder="ornek@eposta.com">
            <label>Şifre ${existingEmail ? '— değiştirmek istemiyorsan boş bırak' : '(en az 6 karakter)'}</label>
            <input type="password" id="plPassword" placeholder="••••••">
            <div class="mm-err" id="plErr"></div>
            <button class="mm-save" id="plSaveBtn">Kaydet</button>
            ${existingEmail ? `<button class="mm-cancel" id="plRemoveBtn" style="color:var(--danger);">Girişi Kaldır</button>` : ''}
            <button class="mm-cancel" id="plCancelBtn">Vazgeç</button>
          </div>
        </div>`;
      document.getElementById('plCancelBtn').onclick = ()=>{ wrap.innerHTML=''; };
      document.getElementById('plOverlay').onclick = (e)=>{ if(e.target.id==='plOverlay') wrap.innerHTML=''; };
      document.getElementById('plSaveBtn').onclick = async ()=>{
        const email = document.getElementById('plEmail').value.trim();
        const password = document.getElementById('plPassword').value;
        const err = document.getElementById('plErr');
        if(!email){ err.textContent='E-posta zorunlu.'; return; }
        if(!existingEmail && (!password || password.length<6)){ err.textContent='Şifre en az 6 karakter olmalı.'; return; }
        if(password && password.length<6){ err.textContent='Şifre en az 6 karakter olmalı.'; return; }
        try{
          await api(`/staff-mgmt/staff/${staffId}/panel-login`, {method:'POST', body:JSON.stringify({email, password: password||undefined})});
          wrap.innerHTML=''; loadStaff();
        }catch(e){ err.textContent = e.message; }
      };
      const removeBtn = document.getElementById('plRemoveBtn');
      if(removeBtn) removeBtn.onclick = async ()=>{
        if(!confirm(`${staffName} kişisinin panel girişini kaldırmak istiyor musunuz?`)) return;
        await api(`/staff-mgmt/staff/${staffId}/panel-login`, {method:'DELETE'});
        wrap.innerHTML=''; loadStaff();
      };
    }

    document.getElementById('addStaffBtn').onclick = ()=>openStaffModal(null);
    document.querySelectorAll('[data-panellogin]').forEach(b=>b.onclick=()=>{
      openPanelLoginModal(b.dataset.panellogin, b.dataset.staffname, b.dataset.hasemail);
    });
    document.querySelectorAll('[data-editstaff]').forEach(b=>b.onclick=()=>{
      const s = staff.find(x=>x.id==b.dataset.editstaff);
      openStaffModal(s);
    });
    document.querySelectorAll('[data-delstaff]').forEach(b=>b.onclick=async()=>{
      if(!confirm('Bu personeli silmek istiyor musunuz?')) return;
      try{ await api('/staff-mgmt/staff/'+b.dataset.delstaff, {method:'DELETE'}); loadStaff(); }
      catch(e){ alert(e.message); }
    });
  }catch(e){ el.innerHTML = `<p class="empty">Veri alınamadı: ${e.message}</p>`; }
}
