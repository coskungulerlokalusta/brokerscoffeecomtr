              <div class="actions">
                <button data-edittask="${t.id}">✏️</button>
                <button data-deltask="${t.id}" style="color:var(--danger);">🗑</button>
              </div>
            </div>
            <p style="font-size:12.5px; color:var(--muted);">${RECUR_LABELS[t.recurrence_type]}${t.time_of_day?' · '+t.time_of_day.slice(0,5):''}${t.interval_hours?' · her '+t.interval_hours+' saatte bir':''} · ${t.requires_photo?'📷 Fotoğraf zorunlu':'Fotoğrafsız'} · ${t.assigned_name ? t.assigned_name : 'Tüm personel'}</p>
          </div>`).join('') || '<p class="empty">Henüz görev tanımlanmadı.</p>'}
        <div id="taskModalWrap"></div>`;

      function openTaskModal(existing){
        const wrap = document.getElementById('taskModalWrap');
        wrap.innerHTML = `
          <div class="mm-overlay" id="taskOverlay">
            <div class="mm-modal">
              <h3>${existing ? 'Görevi Düzenle' : 'Yeni Görev Ekle'}</h3>
              <label>Görev Başlığı</label>
              <input type="text" id="taskTitle" value="${existing?existing.title:''}" placeholder="Örn: Dükkanı Aç, Masaları Sil">
              <label>Açıklama (isteğe bağlı)</label>
              <input type="text" id="taskDesc" value="${existing?(existing.description||''):''}" placeholder="Personele gösterilecek kısa talimat">
              <label>Tekrar Sıklığı</label>
              <select id="taskRecur">
                <option value="daily" ${existing&&existing.recurrence_type==='daily'?'selected':''}>Her gün, belirli bir saatte</option>
                <option value="interval" ${existing&&existing.recurrence_type==='interval'?'selected':''}>Gün içinde belirli aralıklarla</option>
                <option value="weekly" ${existing&&existing.recurrence_type==='weekly'?'selected':''}>Haftada bir</option>
                <option value="monthly" ${existing&&existing.recurrence_type==='monthly'?'selected':''}>Ayda bir</option>
              </select>
              <div id="taskRecurFields"></div>
              <label style="margin-top:14px;">
                <input type="checkbox" id="taskPhoto" ${!existing||existing.requires_photo?'checked':''} style="width:auto; margin-right:8px;"> Fotoğraf zorunlu olsun
              </label>
              <label style="margin-top:10px;">Kime Atanacak</label>
              <select id="taskAssigned">
                <option value="">Tüm personel</option>
                ${staffList.map(s=>`<option value="${s.id}" ${existing&&existing.assigned_to===s.id?'selected':''}>${s.name}</option>`).join('')}
              </select>
              <div class="mm-err" id="taskErr"></div>
              <button class="mm-save" id="taskSaveBtn">Kaydet</button>
              <button class="mm-cancel" id="taskCancelBtn">Vazgeç</button>
            </div>
          </div>`;
        function paintRecurFields(){
          const type = document.getElementById('taskRecur').value;
          const box = document.getElementById('taskRecurFields');
          if(type==='daily'){
            box.innerHTML = `<label>Saat</label><input type="time" id="taskTime" value="${existing&&existing.time_of_day?existing.time_of_day.slice(0,5):'10:00'}">`;
          } else if(type==='interval'){
            box.innerHTML = `<label>Kaç Saatte Bir</label><input type="number" step="0.5" min="0.5" id="taskInterval" value="${existing&&existing.interval_hours?existing.interval_hours:'3'}">`;
          } else if(type==='weekly'){
            const days = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
            box.innerHTML = `<label>Hangi Gün</label><select id="taskDow">${days.map((d,i)=>`<option value="${i}" ${existing&&existing.day_of_week===i?'selected':''}>${d}</option>`).join('')}</select><label>Saat</label><input type="time" id="taskTime" value="${existing&&existing.time_of_day?existing.time_of_day.slice(0,5):'10:00'}">`;
          } else if(type==='monthly'){
            box.innerHTML = `<label>Ayın Kaçı</label><input type="number" min="1" max="31" id="taskDom" value="${existing&&existing.day_of_month?existing.day_of_month:'1'}"><label>Saat</label><input type="time" id="taskTime" value="${existing&&existing.time_of_day?existing.time_of_day.slice(0,5):'10:00'}">`;
          }
        }
        paintRecurFields();
        document.getElementById('taskRecur').onchange = paintRecurFields;
        document.getElementById('taskCancelBtn').onclick = ()=>{ wrap.innerHTML=''; };
        document.getElementById('taskOverlay').onclick = (e)=>{ if(e.target.id==='taskOverlay') wrap.innerHTML=''; };
        document.getElementById('taskSaveBtn').onclick = async ()=>{
          const title = document.getElementById('taskTitle').value.trim();
          const err = document.getElementById('taskErr');
          if(!title){ err.textContent='Başlık zorunlu.'; return; }
          const recurrence_type = document.getElementById('taskRecur').value;
          const body = {
            title, description: document.getElementById('taskDesc').value.trim() || null,
            recurrence_type,
            requires_photo: document.getElementById('taskPhoto').checked,
            assigned_to: document.getElementById('taskAssigned').value || null,
            time_of_day: null, interval_hours: null, day_of_week: null, day_of_month: null,
          };
          if(recurrence_type==='daily'){ body.time_of_day = document.getElementById('taskTime').value; }
          else if(recurrence_type==='interval'){ body.interval_hours = parseFloat(document.getElementById('taskInterval').value); }
          else if(recurrence_type==='weekly'){ body.time_of_day = document.getElementById('taskTime').value; body.day_of_week = Number(document.getElementById('taskDow').value); }
          else if(recurrence_type==='monthly'){ body.time_of_day = document.getElementById('taskTime').value; body.day_of_month = Number(document.getElementById('taskDom').value); }
          try{
            if(existing) await api('/tasks/templates/'+existing.id, {method:'PATCH', body:JSON.stringify(body)});
            else await api('/tasks/templates', {method:'POST', body:JSON.stringify(body)});
            wrap.innerHTML=''; renderTemplates();
          }catch(e){ err.textContent = e.message; }
        };
      }
      document.getElementById('addTaskBtn').onclick = ()=>openTaskModal(null);
      document.querySelectorAll('[data-edittask]').forEach(b=>b.onclick=()=>openTaskModal(templates.find(t=>t.id==b.dataset.edittask)));
      document.querySelectorAll('[data-deltask]').forEach(b=>b.onclick=async()=>{
        if(!confirm('Bu görevi silmek istiyor musunuz?')) return;
        await api('/tasks/templates/'+b.dataset.deltask, {method:'DELETE'});
        renderTemplates();
      });
      document.querySelectorAll('[data-tsv]').forEach(b=>b.onclick=()=>{ taskSubView=b.dataset.tsv; loadTasks(); });
    }catch(e){ el.innerHTML = `<p class="empty">Veri alınamadı: ${e.message}</p>`; }
  }

  async function renderHistory(startVal, endVal){
    el.innerHTML = `
      <div class="section-head" style="margin-bottom:16px;"><h3>Görev Takibi</h3></div>
      <div class="filter-row" style="margin-bottom:18px;">
        <button class="btn-filter" data-tsv="templates">Görev Şablonları</button>
        <button class="btn-filter" data-tsv="history" style="background:var(--navy); color:#fff;">Tamamlanma Geçmişi</button>
      </div>
      <div class="filter-row" style="margin-bottom:18px;">
        <input type="date" id="taskHistStart" value="${startVal||defStart}">
        <span style="color:var(--muted); font-size:12px;">—</span>
        <input type="date" id="taskHistEnd" value="${endVal||defEnd}">
        <button class="btn-filter" id="taskHistFilterBtn">🔍 Filtrele</button>
      </div>
      <div id="taskHistWrap"><p class="empty">Yükleniyor…</p></div>`;
    document.querySelectorAll('[data-tsv]').forEach(b=>b.onclick=()=>{ taskSubView=b.dataset.tsv; loadTasks(); });

    async function fetchAndRenderHist(){
      const s = document.getElementById('taskHistStart').value + 'T00:00:00';
      const e = document.getElementById('taskHistEnd').value + 'T23:59:59';
      const histWrap = document.getElementById('taskHistWrap');
      try{
        const rows = await api(`/tasks/history?start=${s}&end=${e}`);
        histWrap.innerHTML = rows.length===0 ? '<p class="empty">Bu aralıkta görev kaydı yok.</p>' : rows.map(r=>`
          <div class="role-card" style="${r.completed?'':(new Date(r.dueAt)<now?'border-color:var(--danger); background:#FCF3F2;':'')}">
            <div class="role-card-head">
              <h4>${r.title}</h4>
              <span style="font-size:12px; font-weight:700; color:${r.completed?'#2E7D46':(new Date(r.dueAt)<now?'var(--danger)':'var(--muted)')};">
                ${r.completed?'✓ Tamamlandı':(new Date(r.dueAt)<now?'⚠ Kaçırıldı':'Bekleniyor')}
              </span>
            </div>
            <p style="font-size:12.5px; color:var(--muted);">Zamanı: ${new Date(r.dueAt).toLocaleString('tr-TR')}${r.completedBy?' · '+r.completedBy+' tarafından '+new Date(r.completedAt).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})+'\'de tamamlandı':''}</p>
            ${r.photoUrl ? `<img src="${r.photoUrl}" style="max-width:220px; border-radius:8px; margin-top:8px;">` : ''}
          </div>`).join('');
      }catch(e){ histWrap.innerHTML = `<p class="empty">Veri alınamadı: ${e.message}</p>`; }
    }
    document.getElementById('taskHistFilterBtn').onclick = fetchAndRenderHist;
    fetchAndRenderHist();
  }

  if(taskSubView==='history') renderHistory();
  else renderTemplates();
}

async function loadRoles(){
  const el = document.getElementById('viewArea');
  try{
    const roles = await api('/staff-mgmt/roles');
    el.innerHTML = `
      <div class="section-head" style="margin-bottom:16px;"><h3>Roller ve Yetkiler</h3><button class="add-btn" id="addRoleBtn">+ Yeni Rol Ekle</button></div>
      <p class="empty" style="margin-bottom:18px; max-width:640px;">Her role hangi işlemlerin izinli olduğunu işaretleyin. Personel sayfasından her çalışana bir rol atayabilirsiniz — rol atanmamış personelin hiçbir özel yetkisi olmaz.</p>
      ${roles.map(r=>`
        <div class="role-card">
          <div class="role-card-head">
            <h4>${r.name}</h4>
            <div class="actions">
              <button data-editrole="${r.id}">✏️</button>
              <button data-delrole="${r.id}" style="color:var(--danger);">🗑</button>
            </div>
          </div>
          <div class="perm-grid">
            ${PERMISSION_DEFS.map(p=>`<div class="perm-check" style="opacity:${r.permissions[p.key]?1:0.45};">
              <span>${r.permissions[p.key]?'✅':'⬜'}</span> ${p.label}
            </div>`).join('')}
          </div>
        </div>`).join('') || '<p class="empty">Henüz rol tanımlanmadı. "Yeni Rol Ekle" ile başlayın — örn. "Yönetici" (çoğu yetki açık) veya "Barista" (sınırlı yetki).</p>'}
      <div id="roleModalWrap"></div>`;

    function openRoleModal(existing){
      const wrap = document.getElementById('roleModalWrap');
      const currentPerms = existing ? existing.permissions : {};
      wrap.innerHTML = `
        <div class="mm-overlay" id="roleOverlay">
          <div class="mm-modal" style="width:440px;">
            <h3>${existing ? 'Rolü Düzenle' : 'Yeni Rol Ekle'}</h3>
            <label>Rol Adı</label>
            <input type="text" id="roleName" value="${existing ? existing.name : ''}" placeholder="Örn: Yönetici, Barista">
            <label>Yetkiler</label>
            <div class="perm-grid" style="margin-bottom:14px;">
              ${PERMISSION_DEFS.map(p=>`
                <label class="perm-check">
                  <input type="checkbox" data-permkey="${p.key}" ${currentPerms[p.key] ? 'checked' : ''}>
                  ${p.label}
                </label>`).join('')}
            </div>
            <div class="mm-err" id="roleErr"></div>
            <button class="mm-save" id="roleSaveBtn">Kaydet</button>
            <button class="mm-cancel" id="roleCancelBtn">Vazgeç</button>
          </div>
        </div>`;
      document.getElementById('roleCancelBtn').onclick = ()=>{ wrap.innerHTML=''; };
      document.getElementById('roleOverlay').onclick = (e)=>{ if(e.target.id==='roleOverlay') wrap.innerHTML=''; };
      document.getElementById('roleSaveBtn').onclick = async ()=>{
        const name = document.getElementById('roleName').value.trim();
        const err = document.getElementById('roleErr');
        if(!name){ err.textContent='Rol adı zorunlu.'; return; }
        const permissions = {};
        document.querySelectorAll('[data-permkey]').forEach(cb=>{ permissions[cb.dataset.permkey] = cb.checked; });
        try{
          if(existing) await api('/staff-mgmt/roles/'+existing.id, {method:'PATCH', body:JSON.stringify({name, permissions})});
          else await api('/staff-mgmt/roles', {method:'POST', body:JSON.stringify({name, permissions})});
          wrap.innerHTML=''; loadRoles();
        }catch(e){ err.textContent = e.message; }
      };
    }

    document.getElementById('addRoleBtn').onclick = ()=>openRoleModal(null);
    document.querySelectorAll('[data-editrole]').forEach(b=>b.onclick=()=>{
      const r = roles.find(x=>x.id==b.dataset.editrole);
      openRoleModal(r);
    });
    document.querySelectorAll('[data-delrole]').forEach(b=>b.onclick=async()=>{
      if(!confirm('Bu rolü silmek istiyor musunuz? Bu role sahip personelin yetkisi kalkar.')) return;
      try{ await api('/staff-mgmt/roles/'+b.dataset.delrole, {method:'DELETE'}); loadRoles(); }
      catch(e){ alert(e.message); }
    });
  }catch(e){ el.innerHTML = `<p class="empty">Veri alınamadı: ${e.message}</p>`; }
}

async function loadReports(monthStr, groupBy){
  const el = document.getElementById('viewArea');
  const now = new Date();
  const ym = monthStr || `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const gb = groupBy || 'day';
  const [y,m] = ym.split('-').map(Number);
  const monthStart = new Date(y, m-1, 1).toISOString();
  const monthEnd = new Date(y, m, 0, 23, 59, 59).toISOString();
  try{
    const cur = tenant ? tenant.currency : '₺';
    const [data, costData, detailed] = await Promise.all([
      api(`/reports/breakdown?start=${monthStart}&end=${monthEnd}`),
      api(`/reports/cost-summary?start=${monthStart}&end=${monthEnd}`).catch(()=>null),
      api(`/reports/detailed?start=${monthStart}&end=${monthEnd}&groupBy=${gb}`)
    ]);
    const maxRev = Math.max(1, ...detailed.dateBreakdown.map(d=>d.revenue));
    el.innerHTML = `
      <div class="month-picker-row">
        <label style="font-size:12.5px; color:var(--muted); font-weight:700;">Ay Seçin:</label>
        <input type="month" id="reportMonth" value="${ym}">
      </div>
      ${costData ? `
      <div class="cost-stat-grid">
        <div class="stat-card"><div class="l">Aylık Ciro</div><div class="v">${cur}${costData.revenue.toFixed(2)}</div></div>
        <div class="stat-card"><div class="l">Toplam Maliyet</div><div class="v">${cur}${costData.totalCost.toFixed(2)}</div></div>
        <div class="stat-card"><div class="l">Maliyet Oranı</div><div class="v">%${costData.costRatio.toFixed(1)}</div></div>
        <div class="stat-card"><div class="l">Kâr Marjı</div><div class="v">%${costData.marginRatio.toFixed(1)}</div></div>
      </div>
      ${costData.unmatchedItemCount > 0 ? `<p class="empty" style="margin-bottom:18px;">Not: ${costData.unmatchedItemCount} satış kaleminin reçetesi tanımlı değil, maliyet hesabına dahil edilmedi. Maliyet Hesaplama sayfasından ürün reçetelerini tamamlayın.</p>` : ''}
      ` : ''}

      <div class="section-head" style="margin-top:8px;">
        <h3>Ciro Trendi</h3>
        <div style="display:flex; gap:6px;">
          <button class="btn-filter ${gb==='day'?'':'ghost-btn'}" id="gbDay" style="${gb==='day'?'':'background:var(--surface2); color:var(--text);'}">Günlük</button>
          <button class="btn-filter ${gb==='month'?'':'ghost-btn'}" id="gbMonth" style="${gb==='month'?'':'background:var(--surface2); color:var(--text);'}">Aylık</button>
        </div>
      </div>
      <div class="card-panel" style="margin-bottom:24px;">
        ${detailed.dateBreakdown.length===0 ? '<p class="empty">Bu ayda veri yok.</p>' : detailed.dateBreakdown.map(d=>`
          <div class="trend-row">
            <span class="trend-label">${d.period}</span>
            <div class="trend-bar-wrap"><div class="trend-bar" style="width:${(d.revenue/maxRev*100).toFixed(1)}%"></div></div>
            <span class="trend-orders">${d.order_count} sipariş</span>
            <span class="trend-amt">${cur}${d.revenue.toFixed(2)}</span>
          </div>`).join('')}
      </div>

      <div class="section-head"><h3>Personel Bazlı Satışlar</h3></div>
      <div class="card-panel" style="margin-bottom:24px;">
        <div style="overflow-x:auto;">
        <table class="staff-report-table">
          <thead><tr><th>Personel</th><th>Sipariş Adedi</th><th>Ürün Adedi</th><th>Ciro</th></tr></thead>
          <tbody>
            ${detailed.staffBreakdown.map(s=>`<tr><td><b>${s.staff_name}</b></td><td>${s.order_count}</td><td>${s.item_count}</td><td>${cur}${s.revenue.toFixed(2)}</td></tr>`).join('') || '<tr><td colspan="4" style="color:var(--muted);">Bu ayda veri yok.</td></tr>'}
          </tbody>
        </table>
        </div>
      </div>

      <div class="section"><h3>Bu Ay — Ödeme Tipine Göre</h3>
      ${data.byPay.map(x=>`<div class="card-row"><div class="name">${x.pay_label}</div><div class="meta">${x.qty} sipariş</div><div style="margin-left:auto; font-weight:700;">${cur}${Number(x.amount).toFixed(2)}</div></div>`).join('') || '<p class="empty">Bu ayda veri yok.</p>'}
      </div>`;
    document.getElementById('reportMonth').onchange = (e)=>loadReports(e.target.value, gb);
    document.getElementById('gbDay').onclick = ()=>loadReports(ym, 'day');
    document.getElementById('gbMonth').onclick = ()=>loadReports(ym, 'month');
  }catch(e){ el.innerHTML = `<p class="empty">Veri alınamadı: ${e.message}</p>`; }
}

function loadView(){
  if(view==='dashboard') loadDashboard();
  else if(view==='ciro') loadCiro();
  else if(view==='menu') loadMenu();
  else if(view==='options') loadOptions();
  else if(view==='qrmenu') loadQrMenu();
  else if(view==='floorplan') loadFloorplan();
  else if(view==='cost') loadCost();
  else if(view==='slider') loadSlider();
  else if(view==='delivery') loadDelivery();
  else if(view==='storeapi') loadStoreApi();
  else if(view==='posdevice') loadPosDevice();
  else if(view==='staffdiscount') loadStaffDiscount();
  else if(view==='paymentmethods') loadPaymentMethods();
  else if(view==='printers') loadPrinters();
  else if(view==='staff') loadStaff();
  else if(view==='roles') loadRoles();
  else if(view==='tasks') loadTasks();
  else if(view==='breaks') loadBreaks();
  else if(view==='reports') loadReports();
  else if(view==='billing') loadBilling();
  else if(view==='aiask') loadAiAsk();
}

function attach(){
  const loginBtn = document.getElementById('loginBtn');
  if(loginBtn) loginBtn.onclick = async ()=>{
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPass').value;
    try{
      const data = await api('/auth/login', {method:'POST', body:JSON.stringify({email, password})});
      token = data.token; tenant = data.tenant; branches = data.branches || [];
      localStorage.setItem('panel_token', token);
      localStorage.setItem('panel_tenant', JSON.stringify(tenant));
      localStorage.setItem('panel_branches', JSON.stringify(branches));
      loginError = ''; view='dashboard'; render(); loadView();
    }catch(e){ loginError = e.message; render(); }
  };
  const toSetup = document.getElementById('toSetup');
  if(toSetup) toSetup.onclick = ()=>{ setupMode = true; loginError=''; render(); };
  const toLogin = document.getElementById('toLogin');
  if(toLogin) toLogin.onclick = ()=>{ setupMode = false; loginError=''; render(); };
  const fetchStaffBtn = document.getElementById('fetchStaffBtn');
  if(fetchStaffBtn) fetchStaffBtn.onclick = async (e)=>{
    e.preventDefault();
    const slug = document.getElementById('setupTenantSlug').value.trim().toLowerCase();
    if(!slug){ loginError = 'İşletme kodunu girin.'; render(); return; }
    setupTenantSlug = slug;
    try{
      const res = await fetch(`${API_BASE}/auth/staff?tenantSlug=${encodeURIComponent(slug)}`);
      const list = await res.json();
      if(!res.ok) throw new Error(list.error || 'Personel listesi alınamadı');
      setupStaffList = list;
      loginError = '';
    }catch(e){ loginError = e.message; setupStaffList = null; }
    render();
  };
  const setupBtn = document.getElementById('setupBtn');
  if(setupBtn) setupBtn.onclick = async ()=>{
    const userIdEl = document.getElementById('setupUserId');
    if(!userIdEl){ loginError = 'Önce "Personel Listesini Getir" ile personelinizi seçin.'; render(); return; }
    const userId = userIdEl.value;
    const pin = document.getElementById('setupPin').value;
    const email = document.getElementById('setupEmail').value.trim();
    const newPassword = document.getElementById('setupPass').value;
    try{
      await api('/auth/set-password', {method:'POST', body:JSON.stringify({tenantSlug:setupTenantSlug, userId:Number(userId), pin, email, newPassword})});
      alert('Panel giriş bilgileri kaydedildi. Şimdi giriş yapabilirsiniz.');
      setupMode = false; setupStaffList = null; loginError=''; render();
    }catch(e){ loginError = e.message; render(); }
  };
  const branchSwitcher = document.getElementById('branchSwitcher');
  if(branchSwitcher) branchSwitcher.onchange = ()=>switchBranch(Number(branchSwitcher.value));
  const logoutBtn = document.getElementById('logoutBtn');
  if(logoutBtn) logoutBtn.onclick = ()=>{
    token=null; tenant=null; branches=[];
    localStorage.removeItem('panel_token'); localStorage.removeItem('panel_tenant'); localStorage.removeItem('panel_branches');
    render();
  };
  // Mobilde kenar çubuğu varsayılan gizli — hamburger butonuyla açılıp/kapanıyor,
  // arkaplana (overlay) veya bir menü öğesine tıklayınca otomatik kapanıyor.
  const hamburgerBtn = document.getElementById('hamburgerBtn');
  const sidebarEl = document.getElementById('sidebarEl');
  const mobileOverlay = document.getElementById('mobileOverlay');
  function closeMobileSidebar(){ if(sidebarEl) sidebarEl.classList.remove('open'); if(mobileOverlay) mobileOverlay.classList.remove('show'); }
  if(hamburgerBtn) hamburgerBtn.onclick = ()=>{ sidebarEl.classList.toggle('open'); mobileOverlay.classList.toggle('show'); };
  if(mobileOverlay) mobileOverlay.onclick = closeMobileSidebar;
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{ view=b.dataset.v; render(); loadView(); closeMobileSidebar(); });
  const posToggle = document.getElementById('posGroupToggle');
  if(posToggle) posToggle.onclick = ()=>{ posGroupOpen = !posGroupOpen; render(); if(token) loadView(); };
  if(token) loadView();
}

render();
</script>
