<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#0d1b3d"/>
<link rel="apple-touch-icon" href="/icons/icon-192.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>

<title>Ödeme Sonucu | Brokers Coffee</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  body { font-family: 'Plus Jakarta Sans', sans-serif; background:#faf9f6; }
  h1 { font-family: 'Playfair Display', serif; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center px-6">
<div class="max-w-sm w-full bg-white rounded-lg shadow-sm p-8 text-center">
<div id="icon" class="text-5xl mb-4"></div>
<h1 id="title" class="text-2xl text-[#0d1b3d] mb-2"></h1>
<p id="message" class="text-[#827472] mb-6"></p>
<a href="/" class="inline-block bg-[#0d1b3d] text-white font-semibold uppercase tracking-widest text-sm py-3 px-6 rounded hover:bg-[#16285c] transition-colors">Ana Sayfaya Dön</a>
</div>

<script src="/js/push.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const status = params.get('status');
const message = params.get('message');
const method = params.get('method');

if (status === 'success') {
  document.getElementById('icon').textContent = method === 'store' ? '🏪' : '✅';
  document.getElementById('title').textContent = method === 'store' ? 'Sipariş Alındı' : 'Ödeme Başarılı';
  document.getElementById('message').textContent = method === 'store'
    ? 'Siparişiniz alındı, hazırlanmaya başlıyor. Ödemeyi teslim alırken mağazada yapabilirsin.'
    : 'Siparişiniz alındı, en kısa sürede hazırlanmaya başlayacak.';
} else {
  document.getElementById('icon').textContent = '❌';
  document.getElementById('title').textContent = 'Ödeme Başarısız';
  document.getElementById('message').textContent = message || 'Ödeme tamamlanamadı, lütfen tekrar deneyin.';
}
</script>
</body>
</html>
