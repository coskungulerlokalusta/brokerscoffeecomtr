<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Ödeme Sonucu | Brokers Coffee</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  body { font-family: 'Plus Jakarta Sans', sans-serif; background:#faf9f6; }
  h1 { font-family: 'Playfair Display', serif; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center px-6">
<div class="max-w-sm w-full bg-white rounded-lg shadow-sm p-8 text-center">
<div id="icon" class="text-5xl mb-4"></div>
<h1 id="title" class="text-2xl text-[#271310] mb-2"></h1>
<p id="message" class="text-[#827472] mb-6"></p>
<a href="/" class="inline-block bg-[#271310] text-white font-semibold uppercase tracking-widest text-sm py-3 px-6 rounded hover:bg-[#3e2723] transition-colors">Ana Sayfaya Dön</a>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const status = params.get('status');
const message = params.get('message');

if (status === 'success') {
  document.getElementById('icon').textContent = '✅';
  document.getElementById('title').textContent = 'Ödeme Başarılı';
  document.getElementById('message').textContent = 'Siparişiniz alındı, en kısa sürede hazırlanmaya başlayacak.';
} else {
  document.getElementById('icon').textContent = '❌';
  document.getElementById('title').textContent = 'Ödeme Başarısız';
  document.getElementById('message').textContent = message || 'Ödeme tamamlanamadı, lütfen tekrar deneyin.';
}
</script>
</body>
</html>
